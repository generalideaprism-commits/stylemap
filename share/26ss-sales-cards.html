<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>26SS 판매자료 카드</title>
<style>
  :root{
    --bg:#eef1f5; --card:#fff; --line:#e6e9ef; --soft:#f6f8fa;
    --ink:#111827; --muted:#8b93a1; --sub:#5b6472;
    --blue:#2563eb; --blue-soft:#eaf0fe; --red:#e0294a; --green:#0f9d58;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:"Pretendard","Malgun Gothic","맑은 고딕",-apple-system,Segoe UI,sans-serif;font-size:13px}

  /* ---------- 상단 필터 ---------- */
  header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);
         padding:10px 18px;box-shadow:0 2px 10px rgba(16,24,40,.05);
         /* 왼쪽 필터 묶음 · 오른쪽 검색 — 한 줄에 나란히, 바탕 높이는 필터 줄 수에 맞춘다 */
         display:flex;align-items:flex-start;gap:18px}
  #filters{flex:1;min-width:0}
  /* 오른쪽 묶음: 검색은 위, 정렬은 헤더 아래쪽 변에 붙인다 — 필터 줄 높이만큼 늘어나 둘 사이를 벌린다 */
  .top{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;
       align-self:stretch;gap:8px;flex:none;padding-top:1px;max-width:460px}   /* 정렬 버튼이 7개로 늘어 한 줄에 다 놓으면 필터 영역이 좁아진다 — 두 줄로 접는다 */
  #sortbox .fgroup.sortg{margin-left:0}
  .top h1{font-size:16px;margin:0;letter-spacing:-.2px}
  .tabs{display:flex;gap:4px;background:var(--soft);border-radius:999px;padding:3px}
  .tab{border:0;background:transparent;color:var(--sub);border-radius:999px;
       padding:6px 16px;font-size:12.5px;font-weight:700;cursor:pointer}
  .tab.on{background:var(--blue);color:#fff}
  #sum{padding:16px;display:none}
  #sum.on{display:block}
  #sum .note{background:#fff;border:1px dashed var(--line);border-radius:12px;
             padding:40px 20px;text-align:center;color:var(--muted);line-height:1.8}
  .mrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .mrow .flabel{margin-right:4px}
  .panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(430px,1fr));gap:14px;
          align-items:start}
  .panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px 16px;
         box-shadow:0 1px 3px rgba(16,24,40,.06)}
  .panel h3{margin:0 0 2px;font-size:13.5px;letter-spacing:-.2px}
  .panel .sub{font-size:11px;color:var(--muted);margin-bottom:12px}
  .panel.wide{grid-column:1/-1}
  .grp{font-size:11px;font-weight:800;color:var(--sub);background:var(--soft);
       border-radius:6px;padding:3px 8px;display:inline-block;margin:10px 0 6px}
  .brow{display:grid;grid-template-columns:112px 1fr 96px;align-items:center;gap:8px;
        padding:3px 0;font-size:11.5px}
  .brow .nm{color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brow .tr{height:14px;background:var(--soft);border-radius:4px;overflow:hidden}
  .brow .tr i{display:block;height:100%;background:var(--blue);border-radius:4px;
              transition:width .25s}
  .brow .vl{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
  .brow.ttl{border-top:1px solid var(--line);margin-top:6px;padding-top:6px}
  .brow.ttl .nm,.brow.ttl .vl{color:var(--ink);font-weight:800}
  .brow.ttl .tr i{background:#111827}
  /* 비교 */
  .crow{display:grid;grid-template-columns:112px 1fr 92px;align-items:center;gap:8px;
        padding:6px 0;border-bottom:1px solid #f1f3f7;font-size:11.5px}
  .crow .bars{display:grid;gap:3px}
  .cbar{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:6px;font-size:10.5px}
  .cbar span{color:var(--muted)}
  .cbar .tr{height:11px;background:var(--soft);border-radius:3px;overflow:hidden}
  .cbar .tr i{display:block;height:100%;border-radius:3px}
  .cbar.cur .tr i{background:var(--blue)}
  .cbar.prv .tr i{background:#c7cedb}
  .cbar b{font-variant-numeric:tabular-nums;min-width:60px;text-align:right}
  .delta{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
  .delta.up{color:var(--blue)} .delta.down{color:var(--red)} .delta.flat{color:var(--muted)}
  .legend{display:flex;gap:10px;font-size:10.5px;color:var(--muted);margin-bottom:8px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
  .search{margin-left:auto;display:flex;align-items:center;gap:8px}
  input#q{border:1px solid var(--line);background:var(--soft);border-radius:999px;
          padding:8px 14px;font-size:12.5px;width:230px;outline:none;color:var(--ink)}
  input#q:focus{border-color:var(--blue);background:#fff}
  .meta-right{text-align:right;line-height:1.45;white-space:nowrap}
  .meta-right .upd{font-size:11px;color:var(--muted)}
  .meta-right .upd b{color:var(--ink)}
  .meta-right #count{font-size:11px;color:var(--muted)}
  .frow{display:flex;align-items:center;gap:14px;padding:3px 0;flex-wrap:wrap}
  .fgroup{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .fgroup+.fgroup{border-left:1px solid var(--line);padding-left:14px}
  /* 정렬 묶음은 줄 오른쪽 끝으로 (마지막 캡슐이 헤더 우측 끝과 맞도록) */
  .fgroup.sortg{margin-left:auto;border-left:0;padding-left:0}
  .flabel{flex:none;font-size:11px;color:var(--muted);font-weight:700;margin-right:2px}
  .chip{border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:999px;
        padding:5px 12px;font-size:12px;cursor:pointer;transition:.12s;white-space:nowrap}
  .chip:hover{border-color:#c9d2e0;color:var(--ink)}
  .chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
  #reset{border:1px solid var(--line);background:var(--soft);border-radius:999px;
         padding:8px 14px;font-size:12px;cursor:pointer;color:var(--sub)}
  #reset:hover{background:#eceff4}

  /* ---------- 요약 바 (지금 걸러진 집합의 합계 — 카드 목록 바로 위) ---------- */
  #sumbar{margin:16px 16px 0;background:#fff;border:1px solid var(--line);border-radius:12px;
          padding:9px 14px;box-shadow:0 1px 3px rgba(16,24,40,.06);
          display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap;
          font-variant-numeric:tabular-nums}
  #sumbar .si{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
  #sumbar .si+.si{border-left:1px solid var(--line);padding-left:16px}
  #sumbar .si.wrapx{white-space:normal;flex-wrap:wrap}
  #sumbar .si.wrapx .sv{white-space:normal}
  #sumbar .sl{flex:none;font-size:11px;color:var(--muted);font-weight:700}
  #sumbar .sv{font-size:13px;font-weight:800;letter-spacing:-.2px}
  #sumbar .si.hl .sv{color:var(--blue)}
  #sumbar .sv small{font-weight:600;font-size:10.5px;color:var(--muted);margin-left:5px}
  #sumbar .snote{margin-left:auto;font-size:10.5px;color:var(--muted);line-height:1.4}
  @media (max-width:860px){
    #sumbar .si+.si{border-left:0;padding-left:0}
    #sumbar .snote{margin-left:0;flex-basis:100%}
  }

  /* ---------- 카드 ---------- */
  main{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(276px,100%),1fr));gap:14px;
       align-items:start}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
        box-shadow:0 1px 3px rgba(16,24,40,.06);
        /* 화면 밖 카드는 렌더링을 건너뛰고, 레이아웃 영향도 카드 안으로 가둠 */
        content-visibility:auto;contain-intrinsic-size:auto 700px;contain:layout paint style;
        container-type:inline-size}   /* 카드 폭 기준(cqw)으로 글자 크기를 줄여 표가 잘리지 않게 */
  .chead{display:flex;align-items:center;gap:4px;padding:10px 11px 0;flex-wrap:wrap}
  .chead .code{font-size:11px;font-size:clamp(5px,3.7cqw,11px);color:var(--muted);letter-spacing:.4px}
  .tags{margin-left:auto;display:flex;gap:4px}
  .tag{font-size:9.5px;font-size:clamp(4.5px,3.2cqw,9.5px);border-radius:5px;padding:1px 5px;font-weight:700}
  .tag.b{background:var(--blue);color:#fff}
  .tag.g{background:var(--soft);color:var(--sub);border:1px solid var(--line)}
  .tag.ro{background:#fff1e6;color:#c2560c;border:1px solid #f6d3b5}
  td.re{color:#c2560c}
  .recard{cursor:pointer}
  .recard th.on,.recard td.on,.recard .stats div.on b,.lotcard th.on,.lotcard td.on,.lotcard .stats div.on b{color:var(--blue)}
  .recard td.on b,.lotcard td.on b{color:var(--blue)}
  .cname{font-size:14px;font-size:clamp(8px,5.2cqw,14px);font-weight:800;letter-spacing:-.3px;padding:4px 11px 9px;line-height:1.3;
         white-space:normal;word-break:keep-all;overflow-wrap:anywhere}   /* 품명은 줄바꿈으로 전부 보이게 */

  .thumb{position:relative;background:var(--soft);height:264px;display:flex;
         align-items:center;justify-content:center}
  .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--soft)}
  .thumb .noimg{font-size:11px;color:#c3c9d2;letter-spacing:1px}

  .prices{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;border-top:1px solid var(--line);
          border-bottom:1px solid var(--line);background:#fff}
  .prices div{padding:8px 4px;text-align:center;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:flex-start;gap:2px}
  .prices div:last-child{border-right:0}
  /* 세로 3줄: 항목명(부 데이터명 괄호) → 숫자 → 부 데이터(실판가 · x배수) */
  .prices span{display:block;font-size:9.5px;font-size:clamp(4.5px,3.6cqw,9.5px);color:var(--muted);white-space:nowrap}
  .prices b{display:block;font-size:12px;font-size:clamp(6px,4.4cqw,12px);font-weight:800;white-space:nowrap}
  .prices i{display:block;font-style:normal;font-size:9.5px;font-size:clamp(5px,3.6cqw,9.5px);font-weight:700;color:var(--ink);white-space:nowrap}
  /* 할인율 · 실판가 줄이 없는 TAG가: 타이틀 아래 남은 공간의 정중앙에 숫자 */
  .prices .r b,.prices .solo b{flex:1;display:flex;align-items:center;justify-content:center}
  /* 플로팅 툴팁(배수 칸: 마우스 올리면 배수(택가)) */
  .prices .tip{position:relative;cursor:default}
  .prices .tip::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% - 2px);transform:translateX(-50%) translateY(4px);
    background:var(--ink);color:#fff;font-size:10px;font-weight:600;line-height:1;padding:6px 8px;border-radius:6px;white-space:nowrap;
    opacity:0;pointer-events:none;transition:opacity .12s,transform .12s;z-index:5;box-shadow:0 2px 8px rgba(0,0,0,.18)}
  .prices .tip::before{content:'';position:absolute;left:50%;bottom:calc(100% - 8px);transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--ink);
    opacity:0;pointer-events:none;transition:opacity .12s;z-index:5}
  .prices .tip:hover::after{opacity:1;transform:translateX(-50%) translateY(0)}
  .prices .tip:hover::before{opacity:1}
  .prices .r b{color:var(--red)}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);padding:12px 4px 10px}
  /* 러닝 카드는 현재고(시점재고+신규입고)까지 5칸 */
  .stats.s5{grid-template-columns:repeat(5,1fr)}
  .stats div{text-align:center}
  .stats b{display:block;font-size:13px;font-size:clamp(6px,4.9cqw,13px);font-weight:800;letter-spacing:-.4px;
           white-space:nowrap}
  .stats span{display:block;font-size:9px;font-size:clamp(4.5px,3.4cqw,9px);color:var(--muted);margin-top:2px;white-space:nowrap}
  .stats .hl b{color:var(--blue)}
  .stats b span.dim{display:inline;font-size:1em;margin:0}   /* 값 없음 '-' 는 숫자와 같은 크기로 */

  .prog{margin:2px 12px 13px;background:var(--soft);border:1px solid var(--line);border-radius:8px;
        padding:7px 10px}
  .prog .lb{display:flex;justify-content:space-between;font-size:11px;font-size:clamp(5px,3.7cqw,11px);color:var(--sub);margin-bottom:5px}
  .prog .lb b{color:var(--blue)}
  .bar{height:6px;border-radius:99px;background:#e3e8ef;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px;background:var(--blue)}

  table{width:100%;border-collapse:collapse;table-layout:auto}
  /* 표 글씨는 카드 폭에 맞춰 줄어든다(cqw) — 어떤 화면 폭·확대에서도 숫자가 말줄임(…)으로 잘리지 않는다 */
  .card table{font-size:11px;font-size:clamp(4.5px,3.0cqw,11px)}
  /* 주차별 판매 추이(2026-11-09): 막대 = 주간 판매, 마지막 주 = 전주(파랑). 제목을 누르면 컬러별 주차 표 */
  .trend{margin:4px 10px 8px;border-top:1px dashed var(--line);padding-top:6px}
  .trend .tl{display:flex;justify-content:space-between;align-items:baseline;font-size:10.5px;color:var(--sub);cursor:pointer}
  .trend .tl b{color:var(--ink)} .trend .tl small{color:var(--muted)}
  .trend .bars{display:flex;align-items:flex-end;gap:1.5px;height:44px;margin-top:4px}
  .trend .bars i{flex:1 1 0;background:#c9d3e3;border-radius:1px 1px 0 0;min-height:1px;position:relative}
  .trend .bars i.last{background:var(--blue)} .trend .bars i.peak{background:#7f93b8}
  .trend .bars i:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#111827;color:#fff;font-size:10px;padding:2px 5px;border-radius:4px;white-space:nowrap;z-index:5}
  .trend .ax{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-top:2px}
  .trend table.tt{width:100%;border-collapse:collapse;margin-top:6px;font-size:10px}
  .trend table.tt th,.trend table.tt td{padding:2px 3px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  .trend table.tt th{color:var(--sub);font-weight:600;background:var(--soft)} .trend table.tt td:first-child,.trend table.tt th:first-child{text-align:left}
  .trend table.tt tr.ttl td{font-weight:700} .trend .tw{overflow:auto;max-height:220px}   /* 폰트가 넓어져도 안 잘리게 여유를 둔다 */
  .recard table,.lotcard table{font-size:11px;font-size:clamp(4.5px,2.6cqw,11px)}   /* 8열 표라 조금 더 줄인다 — 좁은 팝업에서도 판매율 열이 안 잘리게 */
  th,td{font-size:1em;padding:.32em .38em;text-align:right;white-space:nowrap;line-height:1.25}
  th{color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);background:#fff}
  td.c{text-align:left}
  tbody tr+tr td{border-top:1px solid #f1f3f7}
  .cl{color:var(--blue);font-weight:700;font-size:1.04em;line-height:1.15}
  .cl small{display:block;color:var(--muted);font-weight:400;font-size:.82em;line-height:1.15}
  tr.ttl td{border-top:1px solid var(--line);font-weight:800;background:#fbfcfe}
  .pnote{margin:8px 12px 10px;font-size:11px;font-size:clamp(4.5px,3.7cqw,11px);line-height:1.5;color:var(--sub)}
  /* 26FW 미진행 컬러(구품번 시점재고만) — 글자색을 회색으로 */
  tr.oldc td,tr.oldc td.cl,tr.oldc td small,.pnote .oldc{color:#9aa3b2}
  tr.oldc td.cl{font-weight:600}
  .dim{color:#c3c9d2}

  details.det{border-top:1px solid var(--line);background:#fcfdfe}
  details.det>summary{list-style:none;cursor:pointer;padding:6px 12px;font-size:11px;font-size:clamp(5px,3.7cqw,11px);
        color:var(--muted);display:flex;align-items:center;gap:5px;user-select:none}
  details.det>summary::-webkit-details-marker{display:none}
  details.det>summary::after{content:'▾';margin-left:auto;font-size:10px;transition:.15s}
  details.det[open]>summary::after{transform:rotate(180deg)}
  details.det>summary:hover{color:var(--sub);background:var(--soft)}
  .meta{padding:2px 12px 8px;display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}
  .meta div{display:flex;justify-content:space-between;gap:.4em;font-size:11px;font-size:clamp(4.5px,3.7cqw,11px);color:var(--sub);
        line-height:1.5}
  .meta div span{color:var(--muted)}
  .foot{border-top:1px solid var(--line);padding:8px 12px;display:flex;gap:6px;flex-wrap:wrap}
  .foot em{font-style:normal;font-size:9.5px;font-size:clamp(4.5px,3.2cqw,9.5px);background:var(--blue-soft);color:var(--blue);
           border-radius:5px;padding:2px 6px;font-weight:700}
  .foot em.th{background:#fff4e5;color:#b45309}
  .foot em.n{background:var(--soft);color:var(--sub)}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:70px 0}
  .chead .code b{color:var(--blue);font-weight:800}
  .card.has-sub{cursor:pointer}
  .card.has-sub:hover{box-shadow:0 4px 14px rgba(16,24,40,.12);border-color:#c9d6f0}
  .foot em.click{background:#fff;border:1px dashed #c9d6f0;color:var(--blue)}


  /* ---------- 정렬 기준값 줄 · 정렬 메뉴 · 리뷰 비교 (MD 2026-10-19) ---------- */
  .sortv{margin:0 11px 8px;padding:5px 8px;border-radius:8px;background:#fff8e6;border:1px solid #f6e3b4;
         color:#7a5200;font-size:11px;font-size:clamp(5px,3.7cqw,11px);line-height:1.45}
  .sortv b{font-weight:800;color:#5c3d00}
  .sgw{position:relative}
  .sgbtn::after{content:' ▾';font-size:10px}
  .smenu{display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:60;background:#fff;border:1px solid var(--line);
         border-radius:12px;box-shadow:0 10px 30px rgba(16,24,40,.16);padding:8px;min-width:210px;flex-direction:column;gap:4px}
  .sgw.open .smenu{display:flex;max-height:min(60vh,440px);overflow:auto}
  .smenu .chip{text-align:left;width:100%}
  #sortbox .fgroup .chip{padding:5px 10px}
  .rv{border-top:1px dashed var(--line);padding:8px 12px 8px;font-size:11px;font-size:clamp(5px,3.5cqw,11px);color:var(--sub);line-height:1.55}
  .rvh{font-weight:800;color:var(--ink);margin-bottom:5px}
  .rvh small{font-weight:500;color:var(--muted);margin-left:6px}
  .rvg{display:grid;grid-template-columns:.9fr 1fr 1fr 1.1fr;gap:2px 4px;align-items:baseline;font-variant-numeric:tabular-nums}
  .rvc{text-align:right;white-space:nowrap}
  .rvc.l{text-align:left;color:var(--muted)}
  .rvc.hd{color:var(--muted);font-weight:600;font-size:.92em;white-space:normal;line-height:1.2}
  .rvc small{display:block;color:var(--muted);font-size:.85em;line-height:1.1}
  .rv .up{color:var(--blue)} .rv .down{color:var(--red)}
  .rvn{margin-top:7px;display:grid;gap:5px}
  .rvn b{color:var(--ink)}
  .rvx{color:var(--sub)}
  /* ---------- 차수(초도·리오더) · 온/오프 · 품목별 요약 ---------- */
  .lotv,.chv{margin:0 11px 8px;padding:5px 8px;border-radius:8px;font-size:11px;font-size:clamp(5px,3.7cqw,11px);line-height:1.45}

/* ---------- 필터 (버튼형) ---------- */
const KEYS = [['season','시즌'],['line','메인/러닝'],['arrived','입고여부'],['reorder','리오더 여부'],
              ['gender','성별'],['item','품목'],['themes','테마']];
// 필터 배치: 1줄 = 시즌 | 메인/러닝 | 입고여부, 2줄 = 성별 | 품목, 3줄 = 테마(+정렬)
const ROWS = [['season','line','arrived','reorder'], ['gender','item'], ['themes']];
/* ---------- 차수(초도 · 리오더 N차) — 입고스케줄 '리오더' 탭 + 스타일맵 총량 (MD 2026-10-19) ----------
   s.lots.list = [{n, kind:'base'|'first'|'re', label, ord(지시), recv(입고), sold(판매), pend(입고예정), state, inv(투입), rd(입고일), due(납기), colors:[{c,cn,ord,recv,sold}]}]
   판매는 차수별 기록이 없어 컬러별 선입선출(초도 → 1차 → 2차 …)로 나눈 추정(≈). 합계는 항상 카드 값과 같다.
   러닝의 이월재고(구품번 시점재고) 판매는 구품번 판매 그대로라 추정이 아니다. lots 가 없는 카드는 전체를 '초도' 한 덩어리로 본다. */
const lotsOf = s => (s.lots && s.lots.list) ? s.lots.list : null;
function lotsAny(s){
  const L = lotsOf(s);
  if(L) return L;
  const t = s.ttl || {};
  return [{n:0, kind:'first', label:'초도', ord:+t.plan||0, recv:+t.qtyIn||0, sold:+t.total||0, pend:0, state:(+t.qtyIn>0?'종결':'예정'), colors:[]}];
}
const reLotsOf = s => lotsAny(s).filter(l=>l.kind==='re');
const RESEQ = [...new Set(DATA.flatMap(s=>reLotsOf(s).map(l=>l.n)))].sort((a,b)=>a-b);
const anyReIn = L => L.some(l=>l.kind==='re' && l.recv>0);                 // 리오더가 실제로 들어왔나 — 아니면 판매는 전부 초도 몫(추정 아님)
const isApprox = (l, L) => l.kind==='re' || (l.kind==='first' && anyReIn(L));
let VIEW = 'all';                                                            // 보기: all · first · re · re1 · re2 …
const viewLabel = v => v==='all' ? '전체' : v==='first' ? '초도' : v==='re' ? '리오더 전체' : (v.slice(2) + '차 리오더');
const viewMatch = (l, v) => l.kind!=='base' && (v==='all' || (v==='first' && l.kind==='first') || (v==='re' && l.kind==='re') || (/^re\d+$/.test(v) && l.kind==='re' && l.n===+v.slice(2)));
/* 보기 기준 수량 — 해당 차수가 없는 카드는 null */
function lotNums(s, v){
  const L = lotsAny(s), sel = L.filter(l=>viewMatch(l, v));
  if(!sel.length) return null;
  const r = {ord:0, recv:0, sold:0, pend:0, est:false, lots:sel, n:sel.length};
  sel.forEach(l=>{ r.ord += l.ord; r.recv += l.recv; r.sold += l.sold; r.pend += l.pend||0; if(isApprox(l, L)) r.est = true; });
  return r;
}
/* 카드 한 장의 수량 — 보기가 전체면 지금 카드 값 그대로 */
function numsOf(s){
  if(VIEW==='all'){ const t = s.ttl || {}; return {ord:+t.plan||0, recv:+t.qtyIn||0, sold:+t.total||0, pend:0, est:false}; }
  return lotNums(s, VIEW);
}
const reAgg = s => lotNums(s, 're');
const reShare = s => { const r = reAgg(s); if(!r) return null; const all = lotNums(s, 'all'); return all && all.ord>0 ? r.ord/all.ord : null; };
const reWait = s => { const L = reLotsOf(s); return L.length ? L.reduce((a,l)=>a + (l.state==='종결' ? 0 : Math.max(0, l.ord - l.recv)), 0) : null; };
const lotRate = (l) => l.recv>0 ? l.sold / l.recv * 100 : null;
/* 보기 중 카드 위에 한 줄 */
function lotStrip(s){
  if(VIEW==='all') return '';
  const r = lotNums(s, VIEW); if(!r) return '';
  const rate = r.recv>0 ? r.sold/r.recv*100 : null, one = r.n===1 ? r.lots[0] : null;
  let when = '';
  if(one && one.kind==='re') when = ` · 투입 ${one.inv||'-'}` + (one.state==='예정' ? ` · 납기 ${one.due||'-'} 예정` : (one.rd ? ` · 입고 ${one.rd}` : ''));
  return `<div class="lotv"><b>${viewLabel(VIEW)}</b> · 지시 ${qty(r.ord)} · 입고 ${qty(r.recv)}${r.pend?` (+예정 ${qty(r.pend)})`:''} · 판매${r.est?'≈':''} ${qty(r.sold)}${rate==null?'':` (${rate.toFixed(1)}%)`}${when}</div>`;
}
/* 카드 상세(펼침) 맨 위 한 줄 — 초도 N + 리오더 N = 입고 N */
function lotLine(s){
  const L = lotsOf(s); if(!L) return '';
  const first = L.find(l=>l.kind==='first'), re = L.filter(l=>l.kind==='re');
  if(!re.length) return '';
  const rin = re.reduce((a,l)=>a+l.recv,0), pend = reWait(s) || 0;
  return `<div class="lotline">초도 입고 ${qty(first?first.recv:0)} + 리오더 입고 ${qty(rin)} (${re.length}회 지시) = ${qty((first?first.recv:0)+rin)}장${pend?` · 리오더 입고 대기 ${qty(pend)}장`:''}</div>`;
}
function reNote(s){
  const r = reAgg(s);
  if(!r) return '리오더 없음 — 맨 뒤로 정렬';
  return `리오더 ${r.n}회 · 지시 ${qty(r.ord)} · 입고 ${qty(r.recv)} · 판매≈ ${qty(r.sold)}${reWait(s)?` · 입고 대기 ${qty(reWait(s))}`:''}`;

                     : `재고 ${qty(stockLeft(s))}장 = 입고 ${qty(qin(s))} − 누계판매 ${qty(sold(s))}`; }
    case 'stockAmtDesc': case 'stockAmtAsc': { const u = unitReal(s); return u==null ? '실판가·TAG가 없음' : `재고금액 ${eok(stockAmt(s))} = ${qty(stockLeft(s))}장 × ${s.real>0?'실판가':'TAG가'} ${won(u)}${rn}`; }
    case 'stockCostDesc': case 'stockCostAsc': { const c = costVat(s); return c>0 ? `재고원가 ${eok(stockCostV(s))} = ${qty(stockLeft(s))}장 × 원가(VAT 포함) ${won(c)}${rn}` : '원가 없음'; }
    case 'realDesc': case 'realAsc': return `판매가(실판가) ${won(s.real)} · TAG ${won(s.tag)}`;
    case 'tagDesc': case 'tagAsc': return `TAG가 ${won(s.tag)}`;
    case 'discDesc': case 'discAsc': return s.discount==null ? '할인율 없음' : `할인율 ${pct(s.discount*100,0)}${s.tagAmt ? ` (TAG판매금액 ${eok(s.tagAmt)} → 실판매금액 ${eok(s.saleAmt||0)})` : ''}`;
    case 'multDesc': return `배수(택가) ${s.mult ?? '-'} · 원가(VAT 포함) ${won(s.costV)}`;
    case 'multRealDesc': return `배수(실판) ${s.multReal ?? '-'} · 실판가 ${won(s.real)}`;
    case 'qtyInDesc': case 'qtyInAsc': return `입고량 ${qty(qin(s))}장 (기획 ${qty(t.plan||0)})`;
    case 'planDesc': return `기획량 ${qty(t.plan||0)}장 (입고 ${qty(qin(s))})`;
    case 'saleAmtDesc': case 'saleAmtAsc': return `실판매금액 ${eok(s.saleAmt||0)} (누계판매 ${qty(sold(s))}장)`;
    case 'inDateAsc': case 'inDateDesc': return `입고일 ${s.inDate||'-'}`;
    case 'reOrdDesc': case 'reRecvDesc': case 'reSoldDesc': case 'reWaitDesc': case 'reShareDesc': case 'reCntDesc': return reNote(s);
    case 'chOnDesc': case 'chOffDesc': case 'chOnShareDesc': case 'chOffShareDesc': case 'chOnWDesc': case 'chOffWDesc': return chNote(s);
  }
  return '';
}

// 카테고리별 버튼 노출 순서 (목록에 없는 값은 뒤에 자동 추가)
const ORDER = {
  season : ['봄','여름','가을','겨울'],
  line   : ['메인','러닝'],
  arrived: ['입고','미입고'],
  reorder: ['O','X'],
  gender : ['여성','공용','남성'],
  item   : ['OUTER','KNIT','INNER (W/O KNIT)','BOTTOM','ACC','기타'],
};
const norm = v => String(v).replace(/\s+/g,'').toUpperCase();
const sortByOrder = (vals,k) => {
  const o = (ORDER[k]||[]).map(norm);
  return vals.slice().sort((a,b)=>{
    const ia = o.indexOf(norm(a)), ib = o.indexOf(norm(b));
    if(ia<0 && ib<0) return a.localeCompare(b,'ko');
    return (ia<0?9e9:ia) - (ib<0?9e9:ib);
  });
};
const sel = {};

function buildFilters(){
  const group = k => {
    const label = KEYS.find(x=>x[0]===k)[1];
    const raw = DATA.flatMap(s=>Array.isArray(s[k]) ? s[k] : [s[k]]).filter(Boolean);
    const vals = sortByOrder([...new Set(raw)], k);
    const btns = [`<button class="chip on" data-k="${k}" data-v="">전체</button>`]
      .concat(vals.map(v=>`<button class="chip" data-k="${k}" data-v="${v}">${v}</button>`));
    return `<div class="fgroup"><span class="flabel">${label}</span>${btns.join('')}</div>`;

  document.getElementById('filters').innerHTML =
    ROWS.map(r=>`<div class="frow">${r.map(group).join('')}</div>`).join('') + '<div class="frow" id="viewrow"></div>';
  syncViewUI();

}

/* ---------- 요약 바 (필터·검색·정렬이 바뀔 때마다 지금 걸러진 집합의 합계) ----------
   금액 합계는 택가·원가가 확인된 스타일만 — 수량·누계판매·판매율은 전부 포함한다.
   마크업은 레코드의 mult 평균이 아니라 금액 가중(Σ택가금액 ÷ Σ원가금액(VAT 포함))으로 다시 계산한다.
   러닝 통합 카드의 ttl 은 카드에 보이는 값 그대로다. 신품번 단독(s.sub)은 DATA 에 별도 원소로
   들어있지 않으므로 ttl 만 더해도 중복 계상되지 않는다. */
const amtOK   = s => !s.tagNA && +s.tag > 0 && +s.cost > 0;
const costVat = s => (s.costV != null && +s.costV) ? +s.costV : (+s.cost || 0) * 1.1;
const eok = v => (!v || v <= 0) ? '0원'
              : v < 1e6 ? (Math.max(1, Math.round(v / 1e4)).toLocaleString('ko-KR') + '만원')
              : ((Math.abs(v) / 1e8 >= 10 ? (v / 1e8).toFixed(1) : (v / 1e8).toFixed(2)) + '억');
const qty = v => (Math.round(v) || 0).toLocaleString('ko-KR');

function summarize(list){
  const r = {styles:list.length, plan:0, qtyIn:0, sales:0,
             supIn:0, supPlan:0, costIn:0, costPlan:0, noPrice:0, on:0, off:0, et:0, cn:0, est:false};
  for(const s of list){
    const nn = numsOf(s); if(!nn) continue;                  // 보기(차수) 기준 수량 — 전체면 카드 값 그대로
    const p = nn.ord, qi = nn.recv; let tot = nn.sold; if(nn.est) r.est = true;
    const cn = chNums(s); if(cn){ r.on += cn.on; r.off += cn.off; r.et += cn.et; r.cn++; }
    if(cn) r.cardTot = (r.cardTot||0) + (+(s.ttl||{}).total || 0);
    if(CH!=='all' && VIEW==='all') tot = cn ? cn[CH] : 0;    // 채널 보기: 그 채널의 판매
    r.plan += p; r.qtyIn += qi; r.sales += tot;
    if(!amtOK(s)){ r.noPrice++; continue; }          // 택가·원가 미확인 — 금액에서만 제외
    const tg = +s.tag, cv = costVat(s);
    r.supIn   += tg * qi;  r.costIn   += cv * qi;    // 입고 기준
    r.supPlan += tg * p;   r.costPlan += cv * p;     // 기획 기준
  }
  r.mult     = r.costIn   > 0 ? r.supIn   / r.costIn   : null;
  r.multPlan = r.costPlan > 0 ? r.supPlan / r.costPlan : null;
  r.rate     = r.qtyIn    > 0 ? r.sales / r.qtyIn * 100 : null;
  return r;
}

const si = (label, val, cls) =>

    return;
  }
  const markup = r.mult != null     ? r.mult.toFixed(2) + '배'
               : r.multPlan != null ? r.multPlan.toFixed(2) + '배<small>기획 기준</small>'
               : '-';
  sumEl.innerHTML =
    si('스타일',         `${qty(r.styles)} / ${qty(DATA.length)}`) +
    (VIEW!=='all' ? si('보기', `${viewLabel(VIEW)}`, 'hl') : '') +

    si('마크업',         markup, 'hl') +
    si(CH!=='all' && VIEW==='all' ? chanLabel(CH) + ' 판매' : (VIEW!=='all' ? viewLabel(VIEW) + ' 판매' + (r.est?'≈':'') : '누계판매'),
       `${qty(r.sales)}장<small>입고 대비 ${r.rate != null ? r.rate.toFixed(1) + '%' : '-'}</small>`) +
    (HASCH && r.cn ? si('온/오프', `온라인 ${qty(r.on)} (${pct0(r.on/(r.on+r.off+r.et||1))}) · 오프라인 ${qty(r.off)} (${pct0(r.off/(r.on+r.off+r.et||1))})${r.et?`<small>기타 ${qty(r.et)}</small>`:''}${VIEW!=='all'?'<small>카드 전체 기준</small>':''}${!CHAT ? '<small>MARK 기준일 미상</small>' : chStale() ? `<small>⚠ MARK ${esc(CHAT)} 기준 — 카드 마감(${esc(CARDEND)})과 날짜가 다름</small>` : `<small>MARK ${esc(CHAT.slice(5).replace('-','/'))} 기준</small>`}${r.cardTot && r.cardTot !== r.on+r.off+r.et ? `<small>카드 누계와 ${qty(Math.abs(r.cardTot-(r.on+r.off+r.et)))}장 차이(전주 열)</small>` : ''}`, 'wrapx') : '') +
    (!HASLOTS ? `<div class="snote">입고스케줄을 읽지 못해 차수(초도·리오더) 정보 없이 만든 화면입니다</div>` : '') +
    (r.noPrice ? `<div class="snote">택가·원가 미확인 ${qty(r.noPrice)}스타일은 금액 합계에서 제외<br>(수량 · 누계판매 · 판매율에는 포함)</div>` : '');
}

const CHUNK = 30;

const listEl = document.getElementById('list');

function more(){
  if(shown >= view.length) return;
  const part = view.slice(shown, shown + CHUNK).map(card).join('');
  listEl.insertAdjacentHTML('beforeend', part);
  paintRv();
  shown += CHUNK;
  // 화면이 아직 덜 찼으면 이어서 채움
  if(shown < view.length && document.body.scrollHeight < innerHeight * 1.8) more();
}

function render(){
  const q = document.getElementById('q').value.trim().toUpperCase();
  const passes = (s, skip) =>
    KEYS.every(([k]) => k===skip || !sel[k] || (Array.isArray(s[k]) ? s[k].includes(sel[k]) : s[k]===sel[k])) &&
    (!q || (s.style||'').toUpperCase().includes(q) || (s.altStyle||'').toUpperCase().includes(q)
        || (s.name||'').toUpperCase().includes(q)) &&
    (VIEW==='all' || VIEW==='first' || !!lotNums(s, VIEW));      // 보기: 그 차수가 있는 카드만
  view = applySort(DATA.filter(s=>passes(s)));
  const itemBase = DATA.filter(s=>passes(s, 'item'));            // 품목별 표는 품목 필터만 빼고 계산
  shown = 0;
  listEl.innerHTML = view.length ? '' : '<div class="empty">조건에 맞는 스타일이 없습니다.</div>';
  scrollTo(0, 0);
  more();
  document.getElementById('count').textContent = `${view.length} / ${DATA.length} 스타일`;
  renderSummary(view);                 // 오른쪽 위 건수와 같은 view 로 계산 — 숫자가 어긋나지 않는다
  renderItems(itemBase);
}

/* ---------- 팝업: 차수 버튼 + 차수별 입고·판매 (MD 2026-10-19) ---------- */
let POP = {style:'', sel:'all'};
const ap = (l, L) => isApprox(l, L) ? '≈' : '';
function lotChips(s){

    `<button class="lchip${POP.sel===v?' on':''}${/예정/.test(t)?' pend':''}" role="tab" aria-selected="${POP.sel===v}" data-lot="${v}">${t}</button>`).join('')}</div>`;

/* 전체 화면: 차수별 요약표 (+ 메인 리오더 카드는 판매율 기준 버튼) */
function lotSummary(s){
  const L = lotsOf(s), est = anyReIn(L);

  const rows = L.map(l=>{
    const rate = lotRate(l), isB = l.kind==='base';
    tot.recv += l.recv; tot.sold += l.sold; tot.pend += l.pend||0;
    if(!isB){ tot.ord += l.ord; tot2.ord += l.ord; }
    let sub = '';
    if(isB) sub = '7/31 시점 · 구품번 판매(7/27주~)';
    else if(l.kind==='first') sub = (l.rd ? esc(l.rd) + ' 입고' : '') + (l.state==='입고중' ? ' · 입고중' : '');
    else sub = '투입 ' + esc(l.inv||'-') + (l.state==='예정' ? ' · 납기 ' + esc(l.due||'-') + ' 예정' : (l.rd ? ' · 입고 ' + esc(l.rd) : ''));
    const a = ap(l, L);
    return `<tr class="${l.state==='예정'?'pend':''}" data-lot="${l.n}"><td class="l"><b>${l.label}</b>${sub?`<small>${sub}</small>`:''}</td>
      <td>${isB ? '<span class="dim">-</span>' : qty(l.ord)}</td>
      <td>${qty(l.recv)}${l.pend?`<small>+예정 ${qty(l.pend)}</small>`:''}</td>
      <td>${l.state==='예정' && l.recv===0 ? '<span class="dim">-</span>' : qty(l.sold) + (a ? '<small>≈</small>' : '')}</td>
      <td>${rate==null ? '<span class="dim">-</span>' : rate.toFixed(1) + '%'}</td></tr>`;
  }).join('');
  const rate = tot.recv>0 ? tot.sold/tot.recv*100 : null;
  const plan = s.re ? s.re.stat.plan : (s.popup ? (+s.ttl.plan||0) : null);       // 카드 기획과 시트 지시합이 다르면 밝힌다
  const diff = plan==null ? 0 : Math.round(tot2.ord - plan);
  const sw = s.re ? `<div class="basesw"><span>판매율 기준</span><button class="bchip${RE_FIRST?'':' on'}" data-base="all">총 기획</button><button class="bchip${RE_FIRST?' on':''}" data-base="first">최초 기획</button></div>` : '';
  return `${sw}<div class="lotsum"><div class="lsh">차수별 입고·판매${est?'<em>판매는 추정(≈)</em>':''}<span>행을 누르면 그 차수만 봅니다</span></div>
    <table class="lt"><thead><tr><th class="l">구분</th><th>지시</th><th>입고</th><th>판매${est?'≈':''}</th><th>판매율${est?'≈':''}<small>입고 기준</small></th></tr></thead><tbody>${rows}
    <tr class="sum"><td class="l">합계</td><td>${qty(tot.ord)}</td><td>${qty(tot.recv)}</td><td>${qty(tot.sold)}</td><td>${rate==null?'-':rate.toFixed(1)+'%'}</td></tr></tbody></table>
    ${diff ? `<div class="lsx">지시 합계가 위 기획(${qty(plan)})과 ${qty(Math.abs(diff))}장 ${diff>0?'많습니다':'적습니다'} — 차수별 지시는 입고스케줄 기준, 기획은 스타일맵 기준이라 집계가 다릅니다.</div>` : ''}</div>`;
}
function lotNote(s, l){

  }else{

  }

  out.push(`지시·입고·예정: 총 입고는 스타일맵, 차수별 지시·입고 쪼개기는 입고스케줄(${esc(s.lots.src||'')}) 기준입니다. 입고는 두 자료가 다르면 스타일맵을 따르고 입고 예정분은 판매·판매율에 넣지 않습니다.`);
  out.push('입고일은 입고스케줄 기준입니다(카드 상세의 입고일은 스타일맵 초입고일이라 며칠 다를 수 있습니다).');
  if(m.noSheet) out.push('⚠ 입고스케줄에 이 품번의 리오더 행이 없어 스타일맵의 리오더기획·입고를 차수 구분 없이 한 줄로 보여 줍니다.');
  if((m.warnColors||[]).length) out.push(`⚠ 입고스케줄과 스타일맵의 리오더 입고가 다른 컬러: ${m.warnColors.map(esc).join(', ')} — 스타일맵 값 기준으로 표시했습니다.`);
  if(m.over) out.push(`⚠ 스타일맵 판매가 입고보다 ${qty(m.over)}장 많아(입고 반영 시차) 마지막 입고 차수에 얹었습니다.`);
  return `<div class="lotnote">${out.join('<br>')}</div>`;

function popHead(s, tag){

/* 팝업 카드가 없는 카드(입고스케줄에만 리오더가 있는 경우)용 기본 카드 */
function lotOnlyCard(s){

}
/* 차수 하나를 눌렀을 때 */
function lotDetail(s, l){
  const L = lotsOf(s), a = ap(l, L), isB = l.kind==='base', rate = lotRate(l), left = l.recv - l.sold;
  const bar = rate==null ? 0 : Math.max(0, Math.min(100, rate));
  const tiles = isB
    ? [['기초재고(7/31)', qty(l.recv)], ['구품번 판매(7/27주~)', qty(l.sold)], ['잔여', qty(left)], ['판매율', rate==null?'-':rate.toFixed(1)+'%', 1]]
    : [['지시', qty(l.ord)], ['입고', qty(l.recv)], ['판매'+a, l.state==='예정'&&!l.recv ? '-' : qty(l.sold)], ['잔여'+a, l.state==='예정'&&!l.recv ? '-' : qty(left)], ['판매율'+a, rate==null?'-':rate.toFixed(1)+'%', 1]];
  const info = isB ? '러닝 이월재고 — 구품번 26.07.31 시점재고와 구품번 7/27주 이후 주간 판매(추정 아님 · 주 단위 집계라 7/27~7/31 판매가 일부 포함)'
    : l.kind==='first' ? `${l.rd?`입고 ${esc(l.rd)} · `:''}${l.state}${l.pend?` · 입고 예정 ${qty(l.pend)}장${l.pendDate?`(${esc(l.pendDate)})`:''}`:''}`
    : `투입 ${esc(l.inv||'-')} · ${l.state==='예정' ? `납기 ${esc(l.due||'-')} 입고 예정 — 판매·판매율은 입고 후부터` : `입고 ${esc(l.rd||'-')} · ${l.state}${l.pend?` · 예정 ${qty(l.pend)}장`:''}`}`;
  const cols = (l.colors||[]).filter(c=>c.ord || c.recv || c.sold);
  const sum = cols.reduce((x,c)=>({ord:x.ord+c.ord, recv:x.recv+c.recv, sold:x.sold+c.sold}), {ord:0, recv:0, sold:0});
  const rows = cols.map(c=>{
    const r = c.recv>0 ? c.sold/c.recv*100 : null;
    return `<tr${c.old?' class="oldc"':''}><td class="c cl">${esc(c.c)}<small>${esc(c.cn)}</small></td>
      ${isB ? '' : `<td>${qty(c.ord)}</td>`}<td>${qty(c.recv)}</td><td>${c.recv===0 && l.state==='예정' ? '<span class="dim">-</span>' : qty(c.sold)}</td>
      <td>${c.recv===0 && l.state==='예정' ? '<span class="dim">-</span>' : qty(c.recv - c.sold)}</td><td>${r==null?'<span class="dim">-</span>':r.toFixed(1)+'%'}</td></tr>`;
  }).join('');
  const pr = sum.recv>0 ? sum.sold/sum.recv*100 : null;
  return `<div class="card lotcard">
    ${popHead(s, `<em class="tag ro">${l.label}</em>`)}
    <div class="stats${tiles.length===5?' s5':''}">${tiles.map(t=>`<div${t[2]?' class="hl"':''}><b>${t[1]}</b><span>${t[0]}</span></div>`).join('')}</div>
    <div class="prog"><div class="lb"><span>${l.label} 판매 진행률 (입고 기준)</span><b>${rate==null?'-':rate.toFixed(1)+'%'}</b></div><div class="bar"><i style="width:${bar}%"></i></div></div>
    <div class="lotinfo">${info}</div>
    ${cols.length ? `<table class="lt lc"><thead><tr><th class="l">컬러</th>${isB?'':'<th>지시</th>'}<th>입고</th><th>판매${a}</th><th>잔여${a}</th><th>판매율${a}</th></tr></thead><tbody>${rows}
      <tr class="sum"><td class="l">TTL</td>${isB?'':`<td>${qty(sum.ord)}</td>`}<td>${qty(sum.recv)}</td><td>${l.state==='예정'&&!sum.recv?'-':qty(sum.sold)}</td><td>${l.state==='예정'&&!sum.recv?'-':qty(sum.recv-sum.sold)}</td><td>${pr==null?'-':pr.toFixed(1)+'%'}</td></tr></tbody></table>` : ''}
    ${lotNote(s, l)}
  </div>`;
}
function renderPop(){
  const s = DATA.find(x=>x.style===POP.style);
  const body = document.getElementById('mbody');
  if(!s){ body.innerHTML = ''; return; }
  if(!s.lots){ body.innerHTML = s.re ? rePopupCard(s) : (s.popup ? popupCard(s) : ''); return; }     // 차수 자료가 없으면 지금 팝업 그대로
  const L = lotsOf(s);
  let h = L.length > 1 ? lotChips(s) : '';
  if(POP.sel === 'all'){
    h += (s.re ? rePopupCard(s, lotSummary(s)) : s.popup ? popupCard(s, lotSummary(s)) : lotOnlyCard(s)).replace(/<\/div>\s*$/, chBlock(s) + lotNote(s) + '</div>');
  }else{
    h += lotDetail(s, L.find(l=>String(l.n)===POP.sel) || L[0]);
  }
  body.innerHTML = h;
}
/* ---------- 아이템(품목)별 요약 — 지금 걸러진 목록을 품목별로 (품목 필터만 빼고 계산) ---------- */
const itemEl = document.getElementById('itembar');
let ITEM_OPEN = true;
function renderItems(list){
  const g = new Map();
  for(const s of list){
    const n = numsOf(s); if(!n) continue;
    const k = s.item || '기타';
    const a = g.get(k) || {k, styles:0, ord:0, recv:0, sold:0, est:false, reN:0, reOrd:0, reRecv:0, on:0, off:0, et:0, cn:0};

/* ---------- 신상 판매 리뷰와 수량 비교 (MD 2026-10-19) ----------

const UPDATED = "2026-11-09";
const CARDEND = "2026-11-08";            // 카드 '전주'(스타일맵 W1)의 마지막 날(일요일) — 빌드 때 박힘

  const s = BYSTYLE.get(el.dataset.k); if(s){ el.innerHTML = rvHTML(s); el.dataset.p = '1'; }
});
fetch('style-lookup.json', {cache:'no-store'}).then(r=>r.ok ? r.json() : Promise.reject())
  .then(j=>{ LOOK = j.styles || null; LOOKAT = j.at || ''; LOOKW1 = j.w1d || ''; LOOKSTATE = 'ok'; paintRv(true); render(); })
  .catch(()=>{ LOOKSTATE = 'fail'; paintRv(true); });

buildFilters();
document.getElementById('q').addEventListener('input',render);
document.getElementById('reset').addEventListener('click',()=>{
  document.getElementById('q').value='';
  SORT=''; VIEW='all'; CH='all';
  document.querySelectorAll('.chip[data-k]').forEach(b=>b.classList.toggle('on', b.dataset.v===''));
  syncViewUI();
  syncSortUI();
  KEYS.forEach(([k])=>sel[k]='');
  render();
});
render();
</script>
</body>
</html>
