<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>26 시즌 집계표 · 제안안</title>
<style>
  :root{
    color-scheme:light;
    --bg:#eef1f5; --card:#fff; --line:#e6e9ef; --soft:#f6f8fa;
    --ink:#111827; --muted:#5f6672; --sub:#4b5563;
    --blue:#2563eb; --blue-soft:#eaf0fe; --red:#d4203f; --green:#0f9d58;
    --c26:#2570cc;      /* 이번(26FW) — 강조색 */
    --c25:#b9bfc9;      /* 비교(25FW·직전) — 물러난 회색 */
    --g1:#c2410c; --g2:#0b7a55;   /* 성별 구분색(여성·유니맨) — 글자(흰색)가 읽히도록 한 단계 진하게 */
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:"Pretendard","Malgun Gothic","맑은 고딕",-apple-system,Segoe UI,sans-serif;font-size:13px}
  button{font-family:inherit}

  /* ---------- 상단 조작줄 (한 줄에 ‘무엇을 볼지’만) ---------- */
  .hd{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);
      padding:10px 18px 8px;box-shadow:0 2px 10px rgba(16,24,40,.06)}
  .hdin{max-width:1500px;margin:0 auto}
  .hd1{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .hd1 h1{font-size:16px;margin:0;letter-spacing:-.2px}
  .pill{font-size:10.5px;font-weight:800;color:#b45309;background:#fff4e5;border:1px solid #f6d3b5;border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:2px}
  .hd1 .rng{font-size:11px;color:var(--muted)}
  .hd1 .oldlink{margin-left:auto;font-size:11.5px;color:var(--blue);text-decoration:none;border:1px solid #c9d6f0;border-radius:999px;padding:4px 11px;background:#fff}
  .hd1 .oldlink:hover{background:var(--blue-soft)}
  .hd2{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap}
  .flabel{flex:none;font-size:11px;color:var(--muted);font-weight:700;margin-right:2px}
  .seg{display:inline-flex;align-items:center;gap:4px}
  .seg .opt{border:1px solid var(--line);background:#fff;color:var(--sub);padding:6px 13px;font-size:12.5px;font-weight:700;cursor:pointer;border-radius:999px;transition:.12s;white-space:nowrap}
  .seg .opt:hover{border-color:#c9d2e0;color:var(--ink)}
  .seg .opt.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .seg .opt:focus-visible,.tab:focus-visible,.chip:focus-visible,.pc-row:focus-visible,table.ct tr.prow:focus-visible,details.tv>summary:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .tabs{display:flex;gap:4px;background:var(--soft);border-radius:999px;padding:3px;margin-left:auto}
  .tab{border:0;background:transparent;color:var(--sub);border-radius:999px;padding:7px 16px;font-size:12.5px;font-weight:800;cursor:pointer;white-space:nowrap}
  .tab:hover{color:var(--ink)}
  .tab.on{background:#111827;color:#fff}
  .seg.period .opt{font-size:13px;padding:7px 17px}
  .hd2.tabsrow{margin-top:8px} .hd2.tabsrow .tabs{margin-left:0}
  .hd3{margin-top:7px;font-size:11px;line-height:1.55;color:var(--sub);background:var(--soft);border-radius:8px;padding:6px 10px}
  .hd3 b{color:var(--ink)}

  @media not all and (min-width:1100px) and (min-height:800px){ .hd{position:static} }   /* 작은 화면에서는 위 조작줄을 고정하지 않는다(화면을 가린다) */
@media (min-width:1100px) and (min-height:800px){ html{scroll-padding-top:var(--hdh,160px)} }   /* 고정된 조작줄 뒤로 키보드 포커스가 숨지 않게 */
  main.wide{max-width:none}
  body.allwide .hdin{max-width:none}
  main{padding:14px 18px 30px;max-width:1500px;margin:0 auto}
  .headline{background:#fff;border:1px solid var(--line);border-left:4px solid var(--c26);border-radius:12px;padding:11px 16px;font-size:13.5px;line-height:1.8;box-shadow:0 1px 3px rgba(16,24,40,.06)}
  .headline b{font-weight:800}
  .headline.warn{border-left-color:#f59e0b;background:#fffbeb}
  .headline .tg1{white-space:nowrap;font-size:10.5px;font-weight:800;color:#fff;background:var(--c26);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:2px}
  .headline .tg1.off{background:#6b7280}
  .headline .alt{margin-top:2px;font-size:12px;color:var(--sub);line-height:1.7}
  .headline .story{margin-top:1px;font-size:13px;color:var(--ink)}
  .hcn{font-size:11px;font-weight:500;color:var(--muted);align-self:center}
  .headline .warnt{font-size:11.5px;font-weight:700;color:#b45309}
  .hcs{display:inline-flex;gap:6px;flex-wrap:wrap;margin-left:10px;vertical-align:middle}
  .hc{font-size:11.5px;font-weight:800;border-radius:999px;padding:1px 9px;background:#f6f8fa;border:1px solid var(--line)}
  .hc.up{color:var(--red);border-color:#f6c9d3;background:#fff5f7} .hc.down{color:var(--blue);border-color:#c7d6f6;background:#f3f7ff}
  .sec{margin:0 0 14px}
  .sec>h2{font-size:13.5px;margin:0 0 8px;letter-spacing:-.2px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .sec>h2 small{font-size:11px;font-weight:500;color:var(--muted)}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px 14px;box-shadow:0 1px 3px rgba(16,24,40,.06)}
  .card h3{margin:0 0 2px;font-size:13.5px;letter-spacing:-.2px}
  .card .sub{font-size:11px;color:var(--muted);margin-bottom:10px;line-height:1.5}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(440px,1fr));gap:14px;align-items:start}
  .chips{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 10px;align-items:center}
  .chip{border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:999px;padding:4px 11px;font-size:11.5px;cursor:pointer;white-space:nowrap}
  .chip:hover{border-color:#c9d2e0;color:var(--ink)}
  .chip.on{background:#111827;border-color:#111827;color:#fff;font-weight:700}
  .chips .flabel{margin-right:2px}

  /* ---------- KPI 타일 ---------- */
  .kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  @media (min-width:700px){ .kpis{grid-template-columns:repeat(3,minmax(0,1fr))} }
  @media (min-width:1240px){ .kpis{grid-template-columns:repeat(4,minmax(0,1fr))} }
  .kpi.hero{grid-column:span 2;border-left:4px solid var(--c26);background:linear-gradient(180deg,#fbfdff,#fff)}
  .kpi.hero .kv{font-size:34px}
  .kpi .cs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;border-top:1px dashed var(--line);margin-top:6px;padding-top:6px}
  .kpi .cs span{display:block;font-size:11px;color:var(--muted)} .kpi .cs b{display:block;font-size:14px;font-weight:800;letter-spacing:-.3px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px;box-shadow:0 1px 3px rgba(16,24,40,.06)}
  .kpi .kl{font-size:11.5px;color:var(--sub);font-weight:700;word-break:keep-all}
  .kpi .kv{font-size:27px;font-weight:800;letter-spacing:-.8px;margin:3px 0 2px;line-height:1.15}
  .kpi .kv small{font-size:12px;font-weight:600;color:var(--muted);margin-left:3px;letter-spacing:0}
  .kpi .kd{display:flex;flex-wrap:wrap;justify-content:space-between;gap:0 8px;font-size:11.5px;line-height:1.7;color:var(--muted);border-top:1px solid #f1f3f7;padding-top:3px;margin-top:3px}
  .kpi .kd.main{color:var(--ink);font-weight:700;border-top:1px solid var(--line)}
  .kpi .kd.alt{color:var(--sub);font-weight:600;border-top:1px dashed var(--line)}
  .kpi .kd.alt b{color:var(--ink)}
  .kpi .kd.alt .nm{white-space:normal}
  .kpi .kd .dv{white-space:nowrap;margin-left:auto}
  .kpi .kd .nm{white-space:nowrap}
  .kpi .kd.main .nm{white-space:normal}
  .kpi .kd .nm,.st-cap,table.ct th.nm,.pc-name{word-break:keep-all}                            /* 숫자와 단위·한글 낱말이 줄 중간에서 갈라지지 않게 */                      /* 신상품만 값 · 전년 값이 한 줄에 길어지면 줄바꿈 */
  .up{color:var(--red)} .down{color:var(--blue)} .flat{color:var(--muted)}

  /* ---------- 막대 비교 (이번 vs 비교) ---------- */
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--sub);margin:0 0 8px}
  .legend i{display:inline-block;width:12px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
  .pc-row{display:grid;grid-template-columns:96px minmax(0,1fr) 104px;gap:10px;align-items:center;padding:6px 6px;border-radius:8px}
  .pc-row:hover{background:#f7f9fc}
  .pc-row+.pc-row{border-top:1px solid #f4f5f8}
  .pc-name{font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.3;word-break:keep-all;overflow-wrap:anywhere}
  .pc-name small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
  .pc-bars{display:grid;gap:3px;min-width:0}
  .pc-bar{display:flex;align-items:center;gap:7px;min-width:0}
  .pc-bar i{display:block;height:14px;border-radius:0 4px 4px 0;min-width:2px;flex:none}
  .pc-bar.cur i{background:var(--c26)}
  .pc-bar.cmp i{background:var(--c25)}
  .pc-bar b{font-size:12.5px;font-weight:800;white-space:nowrap}
  .pc-bar span{font-size:11.5px;color:var(--sub);white-space:nowrap}
  .pc.nocmp .pc-row{grid-template-columns:96px minmax(0,1fr)} .pc.nocmp .pc-d{display:none}
  .flag{font-size:11px;font-weight:700;color:var(--muted);background:#f3f4f6;border-radius:6px;padding:1px 6px}
  .dimd{font-weight:600}
  .pc-d{text-align:right;font-size:12.5px;font-weight:800;white-space:nowrap;line-height:1.3}
  .pc-d small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
  .pc-row.ttl{background:#fbfcfe}
  .pc-row.ttl .pc-name{font-weight:800}
  details.tv{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
  details.tv>summary{cursor:pointer;font-size:11px;color:var(--muted);list-style:none;user-select:none;padding:6px 0}
  details.tv>summary::-webkit-details-marker{display:none}
  details.tv>summary::before{content:'▸ ';}
  details.tv[open]>summary::before{content:'▾ ';}
  .tvw{overflow-x:auto}
  table.tvt{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:6px}
  table.tvt th,table.tvt td{padding:4px 8px;text-align:right;border-bottom:1px solid #f1f3f7;white-space:nowrap}
  table.tvt th:first-child,table.tvt td:first-child{text-align:left}
  table.tvt th{color:var(--muted);font-weight:600}
  .empty{color:var(--muted);font-size:12px;padding:18px 6px}

  /* ---------- 성별 비중 (가로 100% 막대) ---------- */
  .st-row{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:center;padding:6px 6px}
  .st-row+.st-row{border-top:1px solid #f4f5f8}
  .st-name{font-size:12.5px;font-weight:700;word-break:keep-all}
  .st-bar{display:flex;gap:2px;height:22px}
  .st-bar span{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;min-width:0;overflow:hidden}
  .st-bar span:first-child{border-radius:4px 0 0 4px} .st-bar span:last-child{border-radius:0 4px 4px 0}
  .st-bar .ch-on,.ch-onb{background:#0e7490} .st-bar .ch-off,.ch-offb{background:#6d4aa5} .st-bar .ch-etc,.ch-etcb{background:#6b7280}
  .st-bar .sp5,.sp5b{background:#6d4aa5}
  .st-bar .sp1,.sp1b{background:#2f7d54} .st-bar .sp2,.sp2b{background:#9a6700} .st-bar .sp3,.sp3b{background:#c2410c} .st-bar .sp4,.sp4b{background:#3b5b92}
  .st-bar .g1{background:var(--g1)} .st-bar .g2{background:var(--g2)} .st-bar .c26{background:var(--c26)} .st-bar .c25{background:var(--c25);color:#1f2937}
  .st-cap{grid-column:2;font-size:11px;color:var(--sub);margin-top:-2px}

  /* ---------- 복종 × 시즌 히트맵 ---------- */
  table.hm{width:100%;border-collapse:separate;border-spacing:3px;font-size:12px}
  table.hm th{font-size:11px;color:var(--muted);font-weight:700;padding:2px 4px}
  table.hm th.rl{text-align:left;color:var(--ink);font-size:12.5px}
  table.hm td{text-align:center;border-radius:8px;padding:9px 4px;font-weight:800;font-size:15px;line-height:1.2}
  table.hm td small{display:block;font-size:11px;font-weight:600;color:#1f2937;margin-top:2px}
  table.hm td.na{background:#f7f8fa;color:#5f6672;font-weight:400}

  /* ---------- 요약 비교표 (한 번에 3지표) ---------- */
  .tw{overflow-x:auto}
  table.ct{width:100%;border-collapse:collapse;font-size:12px;min-width:760px}
  table.ct th,table.ct td{padding:7px 8px;border-bottom:1px solid #f1f3f7;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
  table.ct thead th{background:#fff;color:var(--muted);font-weight:700;font-size:11px;position:sticky;top:0}
  table.ct thead th.mh{text-align:center;color:var(--ink);font-size:12px;border-bottom:1px solid var(--line);background:#f6f8fa}
  table.ct th.nm,table.ct td.nm{text-align:left;font-weight:700;color:var(--ink);position:sticky;left:0;background:#fff;z-index:1}
  table.ct thead th.nm{z-index:3}
  .swipe{display:none;font-size:11px;color:var(--muted);margin:0 0 4px}      /* 표가 실제로 넘칠 때만 스크립트가 보여준다 */
  table.ct.nocmp{min-width:480px;max-width:720px}
  table.ct td.cmp{color:var(--muted);font-weight:400}
  table.ct td.cur{font-weight:800}
  table.ct td.dl{font-weight:800;border-right:1px solid #e6e9ef}
  table.ct.ac{min-width:880px} table.ct.ac th small.sb,table.ct.ac th.nm small.sb{display:block;font-size:10px;font-weight:500;color:var(--muted)}
  table.ct.ac tr.gr th,table.ct.ac tr.gr td{background:#f4f6fb;font-weight:800} table.ct.ac tr.tt th,table.ct.ac tr.tt td{background:#eef2fa;font-weight:800;border-top:1px solid var(--line)}
  table.ct tr.prow{cursor:pointer}
  table.ct tr.prow:hover td,table.ct tr.prow:hover th{background:#fafbfd}
  table.ct tr.prow:focus-visible{outline:none}                       /* 행 전체를 칸마다 안쪽 선으로 그려 이름 칸에도 링이 보이게 */
  table.ct tr.prow:focus-visible>th,table.ct tr.prow:focus-visible>td{box-shadow:inset 0 2px 0 var(--blue),inset 0 -2px 0 var(--blue);background:#f3f7ff}
  table.ct tr.prow:focus-visible>:first-child{box-shadow:inset 2px 2px 0 var(--blue),inset 0 -2px 0 var(--blue)}
  table.ct tr.prow:focus-visible>:last-child{box-shadow:inset -2px 2px 0 var(--blue),inset 0 -2px 0 var(--blue)}
  #legacyPanels tr[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
  table.ct tr.prow .tg{display:inline-block;width:14px;color:var(--muted);transition:transform .15s}
  table.ct tr.prow.open .tg{transform:rotate(90deg)}
  table.ct tr.prow .tg.none{visibility:hidden}
  table.ct tr.cr td,table.ct tr.cr th{background:#fcfdfe}
  table.ct tr.cr th.nm{padding-left:30px;font-weight:500;color:var(--sub)}
  table.ct tr.lv2 th.nm{padding-left:52px}
  table.ct tr.gr th,table.ct tr.gr td{background:#f4f6fb;font-weight:800}
  table.ct tr.tt td,table.ct tr.tt th{background:#f4f6fb;border-top:1px solid var(--line)}
  .cnt{margin-left:6px;font-size:9.5px;font-weight:700;color:var(--muted);background:var(--soft);border-radius:8px;padding:1px 6px}
  .note{font-size:11px;color:var(--muted);line-height:1.6;margin-top:8px}
  .headline,.note,.hd3,.card .sub,table.hm th{word-break:keep-all;overflow-wrap:break-word}      /* 한글이 단어 중간에서 꺾이지 않게 */
  #tip{position:fixed;z-index:99;display:none;max-width:280px;background:#111827;color:#fff;border-radius:8px;padding:8px 10px;font-size:11.5px;line-height:1.55;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.25)}
  #tip b{font-weight:800}
  #tip .tl{display:flex;justify-content:space-between;gap:12px}
  #tip i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:3px}

  @media (max-width:760px){
    .pc-bar i{max-width:55%}
    .seg .opt{padding:8px 13px} .chip{padding:7px 12px} .tab{padding:8px 12px}      /* 손가락으로 누르기 좋게 조금 키운다 */
    table.tvt th:first-child,table.tvt td:first-child{white-space:normal;min-width:84px}
    .hd{padding:8px 12px 6px}
    .tabs{margin-left:0;width:100%;flex-wrap:wrap;border-radius:16px}
    .grid2{grid-template-columns:minmax(0,1fr)}
    .card{min-width:0}
    table.ct th.nm,table.ct td.nm{max-width:112px;white-space:normal;line-height:1.3}
    table.ct tr.cr th.nm{padding-left:18px} table.ct tr.lv2 th.nm{padding-left:28px}
    main{padding:12px}
    .pc-row{grid-template-columns:74px minmax(0,1fr) 84px;gap:6px}
    .st-row{grid-template-columns:74px minmax(0,1fr)}
  }
  @media (max-width:360px){
    .pc-row{grid-template-columns:62px minmax(0,1fr) 72px;gap:4px}
    .pc-bar i{max-width:38%}
    .pc-bar b{font-size:12px}
  }
  .card,.kpi{min-width:0}

  /* ---------- 인쇄(PDF 저장) — 조작 버튼은 빼고 카드가 쪽 경계에서 잘리지 않게 ---------- */
  @media print{
    @page{size:A4 landscape;margin:10mm}
    body{background:#fff}
    .hd{position:static;box-shadow:none;padding:0 0 6px}
    #segPeriod,#segBasis,#segRun,#tabs,.tabsrow,.oldlink,.chips,.swipe,details.tv,.hd1 .rng{display:none!important}
    main{max-width:none;padding:0}
    .card,.kpi,.headline,.sec>.card,.panel{break-inside:avoid;box-shadow:none}
    .tw{overflow:visible}
    table.ct{min-width:0!important;font-size:9px}
    table.sum{min-width:1700px!important;zoom:.58}                 /* 넓은 표는 줄여서 한 쪽 폭에 맞춘다 */
    table.sum:not(.yr){min-width:1820px!important;zoom:.54}
    table.ct th.nm,table.ct td.nm{position:static}
    .grid2{grid-template-columns:1fr 1fr}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}      /* 인쇄 대화상자에서 ‘배경 그래픽’을 켜지 않아도 막대·색이 나오게 */
    .stkbtn,[data-fixrun]{display:none!important}                    /* 화면에서만 쓰는 전환 버튼 */
    .sec>h2{break-after:avoid}
    .panel{break-inside:auto}
    body.allwide main::before{content:'※ 전체 표는 폭이 넓어 인쇄하면 글자가 작습니다 — 화면에서 보거나 PDF 를 확대해서 보세요.';display:block;font-size:11px;color:#555;margin:0 0 6px}
  }

  /* ===== 기존 집계표(표 6종) CSS — 전체 표 탭 ===== */
  /* 집계 표 */
  .tw{overflow-x:auto}
  table.sum{width:100%;border-collapse:collapse;font-size:12px;
    table-layout:fixed;min-width:1960px}   /* 좁은 화면에선 표 영역만 가로 스크롤 (원가·택가·마크업 4열 추가분 포함) */
  table.sum th,table.sum td{padding:6px 8px;white-space:nowrap;border-bottom:1px solid #f1f3f7}
  /* 금액 칸: 값 + 증감 꼬리표가 한 줄에 안 들어가면 꼬리표만 다음 줄로 */
  table.sum td.num{white-space:normal}

    const cols = `<colgroup><col style="width:8.4%">${COLS.map(c=>`<col style="width:${colwWk(c)}">`).join('')}</colgroup>`;
    return `<div class="tw"><table class="sum">${cols}
      <thead><tr><th class="nm">구분</th>${COLS.map(c=>`<th class="num${c.sep?' sep':''}">${c.label}</th>`).join('')}</tr></thead>
      <tbody>${rows}</tbody></table></div>`;
  }
  const block = () => COLS.map(c=>`<col style="width:${(YRW[c.k]||4.3)}%">`).join('');
  const labels = p => COLS.map((c,i)=>
    `<th class="num lb${p?' p25':''}${p&&i===0?' bsep':''}">${c.label}</th>`).join('');
  return `<div class="tw"><table class="sum yr">
    <colgroup><col style="width:6.6%">${block()}${block()}</colgroup>
    <thead>
      <tr><th class="nm" rowspan="2">구분</th>
        <th class="gh cur" colspan="${COLS.length}">26FW<span class="rng">${RNG_CUR}</span></th>
        <th class="gh prv bsep" colspan="${COLS.length}">25FW<span class="rng">${RNG_PREV}</span></th></tr>
      <tr>${labels(false)}${labels(true)}</tr>
    </thead>
    <tbody>${rows}</tbody></table></div>`;
}
function panel(title, sub, body){
  return `<div class="panel"><h3>${title}</h3>${sub ? `<div class="sub">${sub}</div>` : ''}${body}</div>`;
}

/* 여러 행의 합계 — 수량·금액은 합, 비율은 합계값으로 재계산 */
function sumRows(list){
  const t = {};
  ['plan','qtyIn','sales','salesTag','salesAmt','salesCost','styles','sku','inM','inSku','wkQty','wkAmt','stock',
   'cost','planCost','tag'].forEach(k=>{
    const vs = list.map(d=>d && d[k]).filter(v=>v!=null);
    t[k] = vs.length ? vs.reduce((a,b)=>a+b,0) : null;
  });
  t.inRate   = t.plan ? (t.qtyIn||0)/t.plan : null;
  t.sellRate = t.qtyIn ? (t.sales||0)/t.qtyIn : null;
  t.disc     = t.salesTag ? 1-(t.salesAmt||0)/t.salesTag : null;
  // 원가(원천)는 VAT 미포함 — 표시용 costV 만 x1.1, 마크업 = 택가 / 원가(VAT 포함)
  t.costV    = t.cost!=null ? Math.round(t.cost*1.1) : null;
  t.planCostV  = t.planCost!=null ? Math.round(t.planCost*1.1) : null;
  t.salesCostV = t.salesCost!=null ? Math.round(t.salesCost*1.1) : null;
  t.mu       = t.cost ? (t.tag||0)/t.cost/1.1 : null;
  t.muPlan   = t.planCost ? (t.tag||0)/t.planCost/1.1 : null;
  t.muReal   = t.salesCost ? (t.salesAmt||0)/t.salesCost/1.1 : null;
  return t;
}

/* ---------- 접이식 행 (복종 클릭 -> 하위 카테고리) ---------- */
const matchItem = (a,b) => a===b || a.startsWith(b) || b.startsWith(a);   // ACC <-> ACCESSORY
function parentRow(name, o, cmp, gid, subCount, cls, parent, base){
  const tg = subCount ? `<span class="tg">▸</span>` : `<span class="tg none"></span>`;
  const nest = parent ? ` data-p="${parent}" style="display:none"` : '';
  return `<tr class="prow${subCount?' has':''} ${cls||''}${parent?' lv2':''}" data-g="${gid}"${nest}>
    <th class="nm">${tg}${name}${subCount?`<span class="cnt">${subCount}</span>`:''}</th>${cellsOf(o,cmp,base)}</tr>`;
}
function subRow(name, o, cmp, gid, base){
  return `<tr class="srow" data-p="${gid}" style="display:none">
    <th class="nm sub">${name}</th>${cellsOf(o,cmp,base)}</tr>`;
}

function seasonCatTable(season){
  const parents = SUM.block1.filter(d=>d.mode==='new' && d.season===season && d.item!=='TTL');
  const ttl = SUM.block1.find(d=>d.mode==='new' && d.season===season && d.item==='TTL');
  const rows = parents.map(d=>{
    const subs = SUM.seasonCat.filter(x=>x.season===season && matchItem(x.item, d.item));
    const gid = season+'-'+d.item;
    return parentRow(d.item, d.cur, cmpOf(d), gid, subs.length)
      + subs.map(x=>subRow(x.cat, x, cmpOf(x), gid)).join('');
  }).join('');
  return rows + (ttl ? dataRow(season+' TTL', ttl.cur, 'ttl grand', cmpOf(ttl)) : '');
}

/* 성별(여성/유니맨) 카테고리 — 한 표 안에 성별 묶음 두 개, 시즌 블록과 같은 접이식. 25FW 짝이 없어 전년 모드에서는 오른쪽이 비고,
   기획 ST수·SKU·기획량은 시즌 요약과 같은 종합 시트 기준이다 */
const GENDER_LABEL = {'여성': '여성', '남성': '유니맨'};   // 화면 표기 (남성 블록 = 남성+공용 = 유니맨)
/* 성별 카테고리: 성별 TTL 행만 보이고, 클릭하면 복종(OUTER·TOP·BOTTOM·ACC), 복종을 또 클릭하면 하위 카테고리.
   기획량·입고량·주간판매량·주간판매금액·누계판매량·원가 옆에는 전체(여성+유니맨) 대비 비중을 붙인다. */
function genderCatTable(){
  const base = sumRows(SUM.genderItem.filter(d=>d.item==='TOTAL'));   // 여성+유니맨 = 신상품 전체 (비율은 다시 계산)
  return ['여성', '남성'].map(g=>{
    const label = GENDER_LABEL[g] || g;
    const parents = SUM.genderItem.filter(d=>d.gender===g && d.item!=='TOTAL');
    const ttl = SUM.genderItem.find(d=>d.gender===g && d.item==='TOTAL');
    if(!ttl) return '';
    const gid0 = 'g-'+g;
    const rows = parents.map(d=>{
      const subs = SUM.genderCat.filter(x=>x.gender===g && matchItem(x.item, d.item));
      const gid = gid0+'-'+d.item;
      return parentRow(d.item, d, cmpOf(d), gid, subs.length, '', gid0, base)
        + subs.map(x=>subRow(x.cat, x, cmpOf(x), gid, base)).join('');
    }).join('');
    return parentRow(label+' TTL', ttl, cmpOf(ttl), gid0, parents.length, 'ttl gttl', null, base) + rows;
  }).join('') + dataRow('신상품 전체', base, 'ttl grand', null, base);
}

function runCatTable(){
  const parents = SUM.runItem.filter(d=>d.item!=='TOTAL');
  const ttl = SUM.runItem.find(d=>d.item==='TOTAL');
  const rows = parents.map(d=>{
    const subs = SUM.runCat.filter(x=>matchItem(x.item, d.item));
    const gid = 'run-'+d.item;
    return parentRow(d.item, withStk(d), cmpRun(d), gid, subs.length)
      + subs.map(x=>subRow(x.cat, withStk(x), cmpRun(x), gid)).join('');
  }).join('');
  return rows + (ttl ? dataRow('러닝 TTL', withStk(ttl), 'ttl grand runrow', cmpRun(ttl)) : '');
}

/* ---------- 렌더 ---------- */
/* 합계 행의 비교 상대. 한쪽 구성요소에 값이 없는 지표(예: 전년 러닝의 기획량)를
   그냥 더하면 26FW 합계(신상품+러닝) 와 범위가 어긋난 값이 나오므로, 모든 구성요소에
   값이 있는 지표만 남기고 나머지는 비워 증감을 매기지 않는다. */
function cmpSum(rows){
  const cs = rows.map(cmpOf);
  if(!cs.every(c=>c)) return null;
  const t = sumRows(cs);
  // 어느 한쪽에 값이 없으면 합계도 비운다
  Object.keys(t).forEach(k=>{
    if(cs.some(c=>c[k]==null)) t[k] = null;
  });
  if(t.plan==null || t.qtyIn==null) t.inRate = null;
  if(t.qtyIn==null || t.sales==null) t.sellRate = null;
  if(t.salesTag==null || t.salesAmt==null) t.disc = null;
  if(t.cost==null) t.costV = null;
  if(t.cost==null || t.tag==null) t.mu = null;
  if(t.planCost==null || t.tag==null) t.muPlan = null;
  if(t.salesCost==null || t.salesAmt==null) t.muReal = null;
  return t;
}

/* =====================================================================
   기간 — 연간(SS+FW) / 26SS / 26FW. 한눈에 보기·시즌·복종·성별·러닝은 선택한 기간을 그대로 따라간다.
   · 26FW 는 기존 SUM 그대로. 26SS · 연간은 같은 모양의 자료(SUM_SS · SUM_AN)를 만들어 SUM 자리에 끼워 같은 화면 코드가 쓴다.
   · 전주 대비(전주 스냅샷) · 러닝 시점재고 합산 · 전체 표(기존 표) · 채널별(온·오프) 판매는 26FW 에만 있다.
   · 연간 러닝은 SS·FW 기준이 달라 합치지 않는다(합계는 신상품만).
   ===================================================================== */
let SUM_SS = null, SUM_AN = null, FWSAVE = null;
const SEASON_BY = {};                                              // 기간별로 마지막에 보던 시즌·복종 범위
const SEASON_NAMES = ['봄', '여름', '가을', '겨울'];
const isSeasonName = x => SEASON_NAMES.includes(x);
const P_ITEMS = ['OUTER', 'TOP', 'BOTTOM', 'ACC'];
const grpOf = it => String(it || '').startsWith('ACC') ? 'ACC' : String(it || '');
function withSUM(o, fn){ const keep = SUM; SUM = o; try{ return fn(); } finally{ SUM = keep; } }
function seasonsMap(){
  return PERIOD === 'fw' ? {'가을':'가을', '겨울':'겨울', '신상':'신상품 전체'}
    : PERIOD === 'ss' ? {'봄':'봄', '여름':'여름', '신상':'26SS 신상품 전체'}
    : Object.assign(hasRunY() ? {'전체':'신상품+러닝(시즌 기준)'} : {}, {'신상':'연간 신상품 전체'}, hasRunY() ? {'러닝':'러닝(시즌 기준)'} : {}, {'봄':'봄', '여름':'여름', '가을':'가을', '겨울':'겨울'});
}
let SCOPE_LAB = null;                                              // 시즌·복종 탭에서 고른 시즌에 맞춘 이름표(봄·여름 = 26SS/25SS, 가을·겨울 = 26FW/25FW)
const PL = () => SCOPE_LAB ? Object.assign(PL0(), SCOPE_LAB) : PL0();
function scopeLab(sc){
  if(PERIOD === 'fw') return null;
  if(sc === '봄' || sc === '여름') return {cur:'26SS', prev:'25SS', yr:'25SS 동시점', newer:'신상품(봄+여름)', rngCur: SS_END() ? `~ ${SS_END()}` : '', rngPrev: SS_PREV_END() ? `~ ${SS_PREV_END()}` : ''};
  if(sc === '가을' || sc === '겨울') return {cur:'26FW', prev:'25FW', yr:TERMS.yr, newer:TERMS.newer, rngCur:RNG_CUR, rngPrev:RNG_PREV};
  if(sc === '러닝') return {cur:'러닝(시즌 기준)', rngCur:''};
  return null;
}
function PL0(){                                                    // 기간별 이름표 — 화면 문구가 이걸 쓴다
  if(PERIOD === 'ss') return {cur:'26SS', prev:'25SS', yr:'25SS 동시점', newer:'신상품(봄+여름)', rngCur: SS_END() ? `~ ${SS_END()}` : '', rngPrev: SS_PREV_END() ? `~ ${SS_PREV_END()}` : ''};
  if(PERIOD === 'annual'){
    const same = SS_END() === (RNG_CUR || '').replace('~ ', '');
    return {cur:'26SS+26FW', prev:'25SS+25FW', yr:'25SS+25FW 동시점', newer:'신상품(봄·여름·가을·겨울)', rngCur: same ? RNG_CUR : `SS ~ ${SS_END()} · FW ${RNG_CUR}`, rngPrev: `SS ~ ${SS_PREV_END()} · FW ${RNG_PREV}`};
  }
  return {cur:'26FW', prev:'25FW', yr:TERMS.yr, newer:TERMS.newer, rngCur:RNG_CUR, rngPrev:RNG_PREV};
}
const flat = (meta, cur, py) => Object.assign({}, meta, cur, {py: py || null});      // 26FW 의 SUM 행처럼 지표를 맨 위에 둔 행
function mkNewItems(b1){
  const out = P_ITEMS.map(it => {
    const rows = b1.filter(d => d.mode === 'new' && d.kind === '항목' && d.item === it);
    return rows.length ? flat({item: it}, sumRows(rows.map(d => d.cur)), cmpSumK(rows, 'py')) : null;
  }).filter(Boolean);
  const t = b1.find(d => d.kind === '신상품 TTL');
  if(t) out.push(flat({item: 'TOTAL'}, t.cur, t.py));
  return out;
}
function mkRunItems(b1){
  const rows = b1.filter(d => d.mode === 'run');
  const out = rows.filter(d => d.kind === '항목').map(d => flat({item: d.item}, d.cur, d.py));
  const t = rows.find(d => d.kind === '러닝 TTL');
  if(t) out.push(flat({item: 'TOTAL'}, t.cur, t.py));
  return out;
}
function mergeRecs(parts, keyOf, metaOf){            // 같은 (복종·카테고리 등) 행끼리 이번 값은 합하고, 전년은 둘 다 있을 때만 합한다
  const map = new Map(), order = {OUTER:0, TOP:1, BOTTOM:2, ACC:3};
  parts.forEach(r => { const k = keyOf(r); if(!map.has(k)) map.set(k, []); map.get(k).push(r); });
  const out = [];

const noSsView = () => `<div class="sec"><div class="headline warn">26SS 스타일맵 자료를 읽지 못해 이 기간은 표시할 수 없습니다 — 빌드 PC 에서 NAS(4.26SS/04. 스타일맵 (주별 판매))가 열리는지 확인하세요. <button class="chip" data-period="fw">26FW 로 보기</button></div></div>`;

const own = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
const esc2 = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mv = (o, k) => o == null ? null : (k === 'inRate' ? inRateOf(o) : (k === 'disc' && !o.salesAmt && (o.sales || 0) > 0) ? null : get(o, k));      // 판매는 있는데 금액이 0 이면(원천 이상) 할인율을 100% 로 만들지 않는다

/* 한 행의 ‘이번’과 ‘비교’ — 기존 표의 cmpOf/cmpRun/withStk 규칙과 같다 */
function nrm(d, run){

  if(run && RUNSTK && BASIS === 'wk') cmp = null;      // 시점재고를 합치면 전주 스냅샷과 정의가 달라 증감이 성립하지 않는다

/* 합계(신상품+러닝)의 비교 상대 — 한쪽 구성요소에 값이 없는 지표는 비운다(기존 cmpSum 과 같은 규칙) */
function cmpSumK(rows, k){
  const cs = rows.map(d => d && d[k]);
  if(!cs.every(c => c)) return null;
  const t = sumRows(cs);
  Object.keys(t).forEach(key => { if(cs.some(c => c[key] == null)) t[key] = null; });
  if(t.plan == null || t.qtyIn == null) t.inRate = null;
  if(t.qtyIn == null || t.sales == null) t.sellRate = null;
  if(t.salesTag == null || t.salesAmt == null) t.disc = null;
  if(t.cost == null) t.costV = null;
  if(t.planCost == null) t.planCostV = null;
  if(t.salesCost == null) t.salesCostV = null;
  if(t.cost == null || t.tag == null) t.mu = null;
  if(t.planCost == null || t.tag == null) t.muPlan = null;
  if(t.salesCost == null || t.salesAmt == null) t.muReal = null;

}
const rowNewTtl = () => SUM.block1.find(d => d.kind === '신상품 TTL');
const rowRunTtl = () => SUM.runItem.find(d => d.item === 'TOTAL');
const rowSeasonTtl = s => SUM.block1.find(d => d.mode === 'new' && d.season === s && d.item === 'TTL');
/* 시점재고 합산 on/off 를 잠깐 바꿔 계산 (기존 withStk 가 전역 RUNSTK 를 읽는다) */
function withStkF(o, on){ const keep = RUNSTK; RUNSTK = on; try{ return withStk(o); } finally{ RUNSTK = keep; } }
function totalsFor(on){

/* ---------- 비교 가능성 — 25FW 러닝은 기획량 + 이월재고 기준이라 일부 지표는 같은 잣대가 아니다 ---------- */

function flagMode(key, kind, forceYr){            // forceYr = 전주 보기에서도 25FW 줄(KPI)은 전년 규칙으로 판단

/* 증감 — 수량·금액은 %, 비율은 %p, 마크업은 배 */
function dlt(key, a, b){
  if(a == null || b == null) return null;
  const m = MET[key];
  if(m.rate) return {t:'pp', v:(a - b) * 100};
  if(m.ratio) return {t:'x', v:a - b};
  if(!b) return a ? {t:'new', v:null, abs:a} : {t:'rel', v:0, abs:0};

    return `<div class="st-row"><div class="st-name">${esc2(it.name)}</div><div class="st-bar">${segs}</div><div class="st-cap">${cap}</div></div>`;
  }).join('');
}
const gRow = g => SUM.genderItem.find(d => d.gender === g && d.item === 'TOTAL');
function genderStacks(metrics){

/* ---------- 복종 × 시즌 히트맵 ---------- */
function heatCard(){
  const seasons = ['가을', '겨울', '러닝'];
  const items = ['OUTER', 'TOP', 'BOTTOM', 'ACC'];
  const get1 = (season, item) => {
    if(season === '러닝'){ const d = SUM.runItem.find(x => x.item === item); return d ? nrm(d, true) : null; }
    const d = SUM.block1.find(x => x.mode === 'new' && x.season === season && x.item === item);
    return d ? nrm(d) : null;
  };
  const cells = items.map(it => seasons.map(s => { const n = get1(s, it); return n && n.cur && ((mv(n.cur, 'plan') || 0) > 0 || (mv(n.cur, 'qtyIn') || 0) > 0) ? {it, s, n, v: mv(n.cur, HM)} : null; }));
  const all = cells.flat().filter(c => c && c.v != null).map(c => c.v);
  const mx = Math.max(1e-9, ...all);
  const ramp = t => { const a = [232, 241, 253], b = [110, 160, 220]; return a.map((x, i) => Math.round(x + (b[i] - x) * t)); };      // 글자(짙은색)가 항상 읽히도록 가장 짙은 칸도 중간 파랑까지만
  let flagged = false;
  const body = items.map((it, i) => `<tr><th class="rl">${it}</th>${cells[i].map(c => {
    if(!c || c.v == null) return '<td class="na">-</td>';
    const t = c.v / mx, rgb = ramp(Math.min(1, t));
    const b = c.n.cmp ? mv(c.n.cmp, HM) : null, fm = flagMode(HM, c.s === '러닝' ? 'run' : null);
    if(fm) flagged = true;
    const dp = dParts(dlt(HM, c.v, b), fm);
    return `<td style="background:rgb(${rgb});color:#111827">${fmtMV(HM, c.v)}<small>${b == null ? cmpShort() + ' -' : `${cmpShort()} ${fmtMV(HM, b)} · <span style="white-space:nowrap">${dp.txt}</span>`}</small></td>`;
  }).join('')}</tr>`).join('');
  return `<div class="card"><h3>복종 × 시즌·러닝 ${MET[HM].label}</h3><div class="sub">짙을수록 높음 · 칸 아래는 ${cmpName()} 값과 증감(%p 차이)</div>
    <div class="chips">${chipB(HM === 'sellRate', 'data-hm', 'sellRate', '판매율')}${chipB(HM === 'inRate', 'data-hm', 'inRate', '입고율')}</div>
    <table class="hm"><thead><tr><th></th><th>가을</th><th>겨울</th><th>러닝${RUNSTK ? ' (시점재고 포함)' : ''}</th></tr></thead><tbody>${body}</tbody></table>${flagged ? `<div class="note">${flagNote()}</div>` : ''}</div>`;
}

/* ---------- 비교표 (한 번에 3지표, 복종 → 카테고리 펼침) ---------- */
function ctTable(spec){
  const keys = TG[TGROUP].keys;
  // 비교 자료가 하나도 없으면 25FW·증감 열을 숨긴다(예: 성별 전년)
  const any = [];
  const collect = n => { any.push(nrm(n.d, n.run).cmp); (n.kids || []).forEach(collect); };
  spec.nodes.forEach(collect);
  const hasCmp = any.some(Boolean);
  const span = hasCmp ? 3 : 1;
  const head1 = `<tr><th class="nm" rowspan="2">구분</th>${keys.map(k => `<th class="mh" colspan="${span}">${MET[k].label}</th>`).join('')}</tr>`;
  const head2 = `<tr>${keys.map(() => hasCmp ? `<th>이번</th><th>${cmpShort()}</th><th>증감</th>` : '<th>이번</th>').join('')}</tr>`;
  let uid = 0, flagged = false;
  const rows = [];
  const cellsOf = node => {
    const n = nrm(node.d, node.run);
    return keys.map(k => {
      const a = mv(n.cur, k), b = n.cmp ? mv(n.cmp, k) : null, fm = flagMode(k, node.run ? 'run' : null);
      if(fm && b != null) flagged = true;
      const cur = `<td class="cur">${fmtMV(k, a)}</td>`;
      return hasCmp ? `${cur}<td class="cmp">${fmtMV(k, b)}</td><td class="dl">${dHtml(dltR(k, a, b, n.cmp), b == null ? null : fm)}</td>` : cur;
    }).join('');
  };
  const walk = (node, lv, parent) => {
    const id = 'n' + (uid++);
    const kids = node.kids || [];
    const cls = ['prow' + (kids.length ? ' has' : ''), lv === 0 && node.group ? 'gr' : '', lv ? 'cr lv' + lv : ''].join(' ');
    const a11y = kids.length ? ` tabindex="0" role="button" aria-expanded="false"` : '';
    rows.push(`<tr class="${cls}" data-id="${id}"${parent ? ` data-p="${parent}" style="display:none"` : ''}${a11y}><th class="nm"><span class="tg${kids.length ? '' : ' none'}">▸</span>${esc2(node.name)}${kids.length ? `<span class="cnt">${kids.length}</span>` : ''}</th>${cellsOf(node)}</tr>`);
    kids.forEach(k => walk(k, lv + 1, id));
  };
  spec.nodes.forEach(n => walk(n, 0, null));
  if(spec.total) rows.push(`<tr class="tt"><th class="nm">${esc2(spec.total.name)}</th>${cellsOf(spec.total)}</tr>`);
  const grpChips = `<div class="chips"><span class="flabel">표 지표</span>${Object.keys(TG).map(g => chipB(TGROUP === g, 'data-tg', g, TG[g].label)).join('')}
    <button class="chip" data-expand="1" style="margin-left:auto">전부 펼치기</button><button class="chip" data-expand="0">전부 접기</button></div>`;
  const priceNote = TGROUP === 'price' && RUNSTK && spec.nodes.some(x => x.run) ? '<div class="note">시점재고 합산 중 러닝의 할인율은 이월 판매를 더한 값이고, 마크업(실판)은 이월분의 원가가 없어 26FW 신품번 값입니다 — 두 기준이 한 줄에 섞여 있으니 참고용으로 보세요.</div>' : '';
  const sellNote = keys.includes('sellRate') && RUNSTK && spec.nodes.some(x => x.run) ? `<div class="note">${SELL_NOTE_S}</div>` : '';
  return `${grpChips}${priceNote}<div class="tw"><div class="swipe">좌우로 밀어서 보세요 →</div><table class="ct${hasCmp ? '' : ' nocmp'}"><thead>${head1}${head2}</thead><tbody>${rows.join('')}</tbody></table></div>
    <div class="note">행을 누르면 하위 카테고리가 펼쳐집니다 · 증감 색: 빨강 ▲ = 늘어남, 파랑 ▼ = 줄어듦(기존 집계표와 같은 색)${hasCmp ? '' : ` · ${PERIOD !== 'fw' ? '전년 동시점에 이 구분의 자료가 없어 이번 값만 보입니다' : BASIS === 'yr' ? '25FW에는 이 구분의 자료가 없어 이번 값만 보입니다(전주 대비로 바꾸면 비교가 나옵니다)' : (RUNSTK && spec.nodes.some(x => x.run) ? `시점재고 합산 중에는 전주 대비를 계산하지 않습니다 ${FIXRUN_BTN}` : '지난주 스냅샷에 이 구분의 자료가 없습니다')}`}</div>${flagged ? `<div class="note">${flagNote()}</div>` : ''}${sellNote}`;
}
function seasonSpec(scope){
  if(annRunScope(scope)){
    const rows = annScopeRows(scope), tot = rowTotalOf(scope);
    return {nodes: rows.map(r => ({name: r.name, d: r, kids: []})), total: {name: tot.name, d: tot}};
  }
  if(isSeasonName(scope)){
    const parents = SUM.block1.filter(d => d.mode === 'new' && d.season === scope && d.item !== 'TTL');
    return {nodes: parents.map(d => ({name:d.item, d, kids: SUM.seasonCat.filter(x => x.season === scope && matchItem(x.item, d.item)).map(x => ({name:x.cat, d:x}))})),
            total: {name: scope + ' TTL', d: rowSeasonTtl(scope)}};
  }
  const parents = SUM.newItem.filter(d => d.item !== 'TOTAL');
  return {nodes: parents.map(d => ({name:d.item, d, kids: SUM.newCat.filter(x => matchItem(x.item, d.item)).map(x => ({name:x.cat, d:x}))})),
          total: {name:'신상품 TTL', d: rowNewTtl()}};
}
function runSpec(){
  const parents = SUM.runItem.filter(d => d.item !== 'TOTAL');
  return {nodes: parents.map(d => ({name:d.item, d, run:true, kids: SUM.runCat.filter(x => matchItem(x.item, d.item)).map(x => ({name:x.cat, d:x, run:true}))})),
          total: {name:'러닝 TTL', d: rowRunTtl(), run:true}};
}
function genderSpec(){
  const nodes = ['여성', '남성'].map(g => {
    const ttl = gRow(g); if(!ttl) return null;
    const parents = SUM.genderItem.filter(d => d.gender === g && d.item !== 'TOTAL');
    return {name: GENDER_LABEL[g] || g, d: ttl, group:true, kids: parents.map(d => ({name:d.item, d, kids: SUM.genderCat.filter(x => x.gender === g && matchItem(x.item, d.item)).map(x => ({name:x.cat, d:x}))}))};
  }).filter(Boolean);
  const both = ['여성', '남성'].map(gRow).filter(Boolean);
  const tot = sumRows(both);
  tot.was = both.every(d => d.was) ? sumRows(both.map(d => d.was)) : null;      // 성별 합계의 지난주 값도 합쳐서 비교한다
  return {nodes, total: {name:'신상품 전체', d: tot}};
}

  }

  const a = BASIS === 'yr'
    ? `<b>${TERMS.yr} 대비</b> — 26FW(${RNG_CUR})를 25FW(${RNG_PREV}, 같은 요일로 맞춘 전년 같은 시점)와 비교합니다.`
    : `<b>전주 대비</b> — 직전 스타일맵(${TERMS.wk} 스냅샷)보다 이번 주에 늘어난 만큼을 봅니다.`;

  if(RUNSTK && hasRunY()) b += ` <b>⚠</b> 품번 기준 합산입니다 — 시즌 기준으로는 구품번이 26SS 몫(‘26FW 신품번만’이 26FW 시즌 값)이고, 구품번 이월 중 ${RUNY.checks.overlapN + RUNY.checks.overlapNewN}개는 26SS 쪽에도 들어 있어 26SS 화면과 더하면 두 번 셉니다(‘연간’ 기간은 구품번을 한 번만 셉니다).`;
  return a + ' &nbsp;·&nbsp; ' + b;
}

  const runOnBtn = document.querySelector('#segRun .opt[data-run="1"]'); if(runOnBtn) runOnBtn.title = runAnn ? '러닝을 시즌 기준(구품번은 26SS, 신품번만 26FW)으로 세어 신상품에 더합니다' : BASIS === 'wk' ? '전주 대비는 신품번만으로 계산합니다 — 누르면 전년 동시점 대비(시점재고 합산)로 바뀝니다' : '25FW 러닝(이월재고 포함)과 같은 기준';

  document.getElementById('segRun').style.display = (fwP ? !(TAB === 'season' || TAB === 'gender' || TAB === 'onoff') : (PERIOD === 'annual' && TAB === 'overview' && hasRunY())) ? '' : 'none';   // 러닝이 안 나오는 화면에서는 숨긴다(연간은 한눈에 보기에서만 러닝 포함 선택)
  document.getElementById('segBasis').style.display = (!fwP || TAB === 'onoff') ? 'none' : '';                                       // 26SS·연간은 전년 동시점만(전주 스냅샷이 없다)
  document.getElementById('ttlt').textContent = PERIOD === 'fw' ? '26FW 시즌 집계표' : PERIOD === 'ss' ? '26SS 시즌 집계표' : '26 시즌 집계표 · 연간(SS+FW)';
  document.title = (PERIOD === 'fw' ? '26FW 시즌 집계표' : PERIOD === 'ss' ? '26SS 시즌 집계표' : '26 시즌 집계표 · 연간') + ' · 제안안';
  document.getElementById('tabs').innerHTML = TABS.map(([k, l]) => `<button class="tab${TAB === k ? ' on' : ''}" aria-pressed="${TAB === k}" data-tab="${k}">${l}</button>`).join('');
  document.getElementById('rng').textContent = (TAB === 'onoff' && PERIOD !== 'ss') ? `26FW ${RNG_CUR} · MARK ${ymdS(CHN.at) || '-'} · 기준 업데이트 ${UPDATED}` : PERIOD === 'annual' ? `26SS ${SS_END() ? '~ ' + SS_END() : ''} · 26FW ${RNG_CUR} · 전년 동시점 · 기준 업데이트 ${UPDATED}` : PERIOD === 'ss' ? `26SS ${PL().rngCur} · 25SS ${PL().rngPrev} · 기준 업데이트 ${UPDATED}` : `26FW ${RNG_CUR} · 25FW ${RNG_PREV} · 기준 업데이트 ${UPDATED}`;

      tr.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); tr.click(); if(tr.classList.contains('has')) tr.setAttribute('aria-expanded', tr.classList.contains('open')); } });

    document.querySelectorAll('#legacyPanels th.nm').forEach(th => {                                     // 말줄임된 이름은 마우스를 올리면 전체가 보인다(접힘 기호·개수 배지는 뺀 이름만)
      const tr = th.closest('tr'), nm = [...th.childNodes].filter(n => n.nodeType === 3).map(n => n.textContent).join('').trim() || th.textContent.trim();

  else if(legSel && legIdx >= 0){ const el = document.querySelectorAll('.' + legSel)[legIdx]; if(el) el.focus({preventScroll:true}); }

/* 화면 크기에 따라 달라지는 보조 요소 — ‘밀어서 보기’ 안내(표가 실제로 넘칠 때만) · 고정 조작줄에 가려지는 만큼 스크롤 여백 */

function bindView(){

  v.querySelectorAll('[data-period]').forEach(b => b.addEventListener('click', () => { setPeriod(b.dataset.period); renderAll(); }));
  v.querySelectorAll('[data-ametric]').forEach(b => b.addEventListener('click', () => { AMET = b.dataset.ametric; renderAll(); }));
  v.querySelectorAll('[data-ahm]').forEach(b => b.addEventListener('click', () => { AHM = b.dataset.ahm; renderAll(); }));
  v.querySelectorAll('[data-season]').forEach(b => b.addEventListener('click', () => { SEASON = b.dataset.season; DRILL = ''; renderAll(); }));
  v.querySelectorAll('[data-tg]').forEach(b => b.addEventListener('click', () => { TGROUP = b.dataset.tg; renderAll(); }));

  v.querySelectorAll('[data-drill]').forEach(b => b.addEventListener('click', () => { DRILL = DRILL === b.dataset.drill ? '' : b.dataset.drill; renderAll(); }));
  v.querySelectorAll('[data-fixrun]').forEach(b => b.addEventListener('click', () => { RUN_TOUCHED = true; RUNSTK = b.dataset.fixrun === '1'; renderAll(); const f = document.querySelector('#segRun .opt.on'); if(f) f.focus({preventScroll: getComputedStyle(document.querySelector('header.hd')).position === 'sticky'}); }));
  const collapse = id => v.querySelectorAll(`tr[data-p="${id}"]`).forEach(x => { x.style.display = 'none'; x.classList.remove('open'); x.setAttribute('aria-expanded', 'false'); collapse(x.dataset.id); });

    const open = tr.classList.toggle('open'); tr.setAttribute('aria-expanded', open);
    if(open) v.querySelectorAll(`tr[data-p="${tr.dataset.id}"]`).forEach(x => x.style.display = '');

  };

const tipEl = document.getElementById('tip');
let TIP_MODE = '', TOUCH0 = null;                       // 'hover' | 'touch' | 'focus' — 키보드 포커스 툴팁만 스크롤해도 남긴다
const hideTip = () => { tipEl.style.display = 'none'; TIP_MODE = ''; };
function showTip(row, x, y, below, rect){
  const r = TIPREG[+row.dataset.reg]; if(!r) return;
  const m = MET[r.key], p = dParts(r.d, r.fm);
  tipEl.textContent = '';
  const h = document.createElement('div'); const hb = document.createElement('b'); hb.textContent = `${r.name} · ${m.label}`; h.appendChild(hb); tipEl.appendChild(h);
  const line = (color, label, val) => { const d = document.createElement('div'); d.className = 'tl'; const l = document.createElement('span'); const i = document.createElement('i'); i.style.background = color; l.appendChild(i); l.appendChild(document.createTextNode(label)); const v = document.createElement('b'); v.textContent = val; d.appendChild(l); d.appendChild(v); tipEl.appendChild(d); };
  line('#2570cc', r.curLabel || '이번', r.a == null ? '-' : m.fmt(r.a) + (m.unit || ''));
  line('#b9bfc9', r.cmpLabel || cmpName(), r.b == null ? '-' : m.fmt(r.b) + (m.unit || ''));
  const d = document.createElement('div'); d.className = 'tl'; const l = document.createElement('span'); l.textContent = '증감'; const v = document.createElement('b'); const ab = r.fm === 'hide' ? '' : absTxt(r.key, r.d); v.textContent = p.txt + (ab ? ` (${ab})` : ''); d.appendChild(l); d.appendChild(v); tipEl.appendChild(d);
  tipEl.style.display = 'block';
  const w = tipEl.offsetWidth, hh = tipEl.offsetHeight;
  tipEl.style.left = Math.max(8, Math.min(innerWidth - w - 8, x + 14)) + 'px';
  let top = y + 14;
  if(below && rect){ top = rect.bottom + 4; if(top + hh > innerHeight - 8) top = rect.top - hh - 4; }      // 아래 공간이 모자라면 행 위쪽에 띄워 행을 덮지 않는다
  tipEl.style.top = Math.max(8, Math.min(innerHeight - hh - 8, top)) + 'px';
}

document.addEventListener('focusin', e => { const r = e.target.closest && e.target.closest('.pc-row[data-reg]'); if(r){ const b = r.getBoundingClientRect(); showTip(r, b.left + 12, b.bottom + 4, true, b); TIP_MODE = 'focus'; } else hideTip(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') hideTip(); });

/* ---------- 화면 상태를 주소 끝(#…)에 적어 둔다 — 같은 주소를 보내면 같은 화면이 열린다 ---------- */
function readHash(){
  const h = new URLSearchParams(location.hash.replace(/^#/, ''));
  let np = PERIODS.some(x => x[0] === h.get('period')) ? h.get('period') : PERIOD;
  if(h.get('tab') === 'annual'){ np = {'26SS':'ss', '26FW':'fw'}[h.get('ascope')] || 'annual'; TAB = 'overview'; }      // 예전 주소(연간 탭) 호환
  else if(TABS.some(t => t[0] === h.get('tab'))) TAB = h.get('tab');
  if(h.get('basis') === 'wk' || h.get('basis') === 'yr') BASIS = h.get('basis');
  if(h.get('run') === '0' || h.get('run') === '1') RUNSTK = h.get('run') === '1';
  else if(BASIS === 'wk') RUNSTK = false;
  RUN_TOUCHED = h.get('rt') === '1';
  if(h.get('incrun') === '0' || h.get('incrun') === '1') INCRUN = h.get('incrun') === '1';                      // 사람이 러닝 버튼을 직접 눌렀을 때만 기록 — 아니면 비교 기준에 맞춰 자동 연동 유지
  if(SEASON_KEYS.includes(h.get('season'))) SEASON = h.get('season');
  if(CHART_METRICS.includes(h.get('metric'))) METRIC = h.get('metric');
  if(own(TG, h.get('tg') || '')) TGROUP = h.get('tg');
  if(['전체', '신상', '가을', '겨울', '러닝'].includes(h.get('scope'))) ITEMSCOPE = h.get('scope');
  if(['OUTER', 'TOP', 'BOTTOM', 'ACC'].includes(h.get('drill'))) DRILL = h.get('drill');
  if(O_SCOPES.includes(h.get('oscope'))) OSCOPE = h.get('oscope');
  if(O_METRICS.some(x => x[0] === h.get('ometric'))) OMET = h.get('ometric');
  if(CHART_METRICS.includes(h.get('ametric'))) AMET = h.get('ametric');
  if(A_HEAT.some(x => x[0] === h.get('aheat'))) AHM = h.get('aheat');
  const dh = h.get('drill');
  setPeriod(np, true);
  DRILL = ['OUTER', 'TOP', 'BOTTOM', 'ACC'].includes(dh) ? dh : '';      // 카테고리 내려가기는 주소 값만 쓴다(없으면 비움)
}
function writeHash(){
  const p = {period:PERIOD, tab:TAB, season:SEASON, metric:METRIC, tg:TGROUP, scope:ITEMSCOPE};
  if(PERIOD === 'fw'){ p.basis = BASIS; p.run = RUNSTK ? '1' : '0'; if(RUN_TOUCHED) p.rt = '1'; }
  if(PERIOD === 'annual') p.incrun = INCRUN ? '1' : '0';
  if(DRILL) p.drill = DRILL;
  if(TAB === 'overview' && PERIOD !== 'fw'){ p.ametric = AMET; p.aheat = AHM; }
  if(TAB === 'onoff'){ p.oscope = OSCOPE; p.ometric = OMET; }
  try{ history.replaceState(null, '', '#' + new URLSearchParams(p).toString()); }catch(e){}
}
window.addEventListener('hashchange', () => { readHash(); renderAll(); });      // 같은 탭에서 주소 끝(#…)만 바꿔도 화면이 따라온다
function normCost(o){
  if(!o || typeof o !== 'object') return;
  if(o.cost != null) o.costV = Math.round(o.cost * 1.1);
  if(o.planCost != null) o.planCostV = Math.round(o.planCost * 1.1);
  if(o.salesCost != null) o.salesCostV = Math.round(o.salesCost * 1.1);
}
function normAll(){
  [SUM_FW, SS].forEach(src => Object.keys(src || {}).forEach(key => { const arr = src[key]; if(!Array.isArray(arr)) return;
    arr.forEach(d => { if(!d || typeof d !== 'object') return;
      [d.py].forEach(py => { if(!py || typeof py !== 'object') return;
        if((py.qtyIn || 0) > 0 && !py.cost) py.cost = null;
        if((py.plan || 0) > 0 && !py.planCost) py.planCost = null;
        if((py.sales || 0) > 0 && !py.salesCost) py.salesCost = null; });
      normCost(d); ['cur', 'py', 'was', 'stk', 'prev'].forEach(f => normCost(d[f]));
      ['py'].forEach(f => { const o = d[f]; if(o && typeof o === 'object'){ if(o.cost == null) o.costV = null; if(o.planCost == null) o.planCostV = null; if(o.salesCost == null) o.salesCostV = null; } }); }); }));
}
normAll();
buildPeriods();
RUNSTK = DEFAULTS.runStk;       // 전년 동시점 대비가 기본 → 러닝도 25FW 와 같은 기준(시점재고 합산)으로 시작
readHash();
if(location.protocol === 'file:'){ const ol = document.querySelector('.oldlink'); if(ol) ol.style.display = 'none'; }   // 저장해서 연 파일에서는 ‘기존 집계표’ 링크가 안 열린다
renderAll();
</script>
</body>
