<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>26FW 시즌 집계표</title>
<style>

  :root{
    --bg:#eef1f5; --card:#fff; --line:#e6e9ef; --soft:#f6f8fa;
    --ink:#111827; --muted:#8b93a1; --sub:#5b6472;
    --blue:#2563eb; --blue-soft:#eaf0fe; --red:#e0294a; --green:#0f9d58;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:"Pretendard","Malgun Gothic","맑은 고딕",-apple-system,Segoe UI,sans-serif;font-size:13px}

  /* ---------- 상단 필터 ---------- */
  header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);
         padding:12px 18px 10px;box-shadow:0 2px 10px rgba(16,24,40,.05)}
  .top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .top h1{font-size:16px;margin:0;letter-spacing:-.2px}
  .tabs{display:flex;gap:4px;background:var(--soft);border-radius:999px;padding:3px}
  .tab{border:0;background:transparent;color:var(--sub);border-radius:999px;
       padding:6px 16px;font-size:12.5px;font-weight:700;cursor:pointer}
  .tab.on{background:var(--blue);color:#fff}
  #sum{padding:16px;display:none}
  #sum.on{display:block}
  #sum .note{background:#fff;border:1px dashed var(--line);border-radius:12px;
             padding:40px 20px;text-align:center;color:var(--muted);line-height:1.8}
  .mrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 14px;
        position:sticky;top:0;z-index:8;background:var(--bg);padding:10px 0 8px}
  .mrow .flabel{margin-right:4px}
  .panels{margin:0}
  /* 집계 표 */
  .tw{overflow-x:auto}
  table.sum{width:100%;border-collapse:collapse;font-size:12px;
    table-layout:fixed;min-width:1840px}   /* 좁은 화면에선 표 영역만 가로 스크롤 (원가·택가·마크업 4열 추가분 포함) */
  table.sum th,table.sum td{padding:6px 10px;white-space:nowrap;border-bottom:1px solid #f1f3f7}
  table.sum thead th{position:sticky;top:0;background:#fff;color:var(--muted);font-weight:700;
    font-size:11px;border-bottom:1px solid var(--line);z-index:2}
  table.sum th.nm{text-align:left;font-weight:600;color:var(--sub);
    overflow:hidden;text-overflow:ellipsis}   /* 긴 카테고리명은 말줄임 */
  table.sum td.num,table.sum thead th.num{text-align:right;font-variant-numeric:tabular-nums}
  table.sum td.num{font-weight:700}
  table.sum td.dim{color:#c3c9d2;font-weight:400}
  table.sum .dt{margin-left:4px;font-size:10px;font-weight:700}
  table.sum .dt.up{color:var(--red)}
  table.sum .dt.down{color:var(--blue)}
  table.sum tr.grprow th{background:var(--soft);color:var(--sub);font-size:11px;font-weight:800;
    text-align:left;border-bottom:1px solid var(--line)}
  table.sum tr.ttl td,table.sum tr.ttl th{background:#fbfcfe;font-weight:800;color:var(--ink)}
  table.sum tr.grand td,table.sum tr.grand th{background:#f4f6fb;border-top:1px solid var(--line)}
  table.sum tbody tr:hover td{background:#fafbfd}
  /* 러닝 행 — 누르면 시점재고 합산 보기로 전환 */
  table.sum tr.runrow{cursor:pointer}
  table.sum tr.runrow th.nm::after{content:'＋';margin-left:6px;font-size:10px;color:var(--muted)}
  table.sum tr.runrow:hover th.nm::after{color:var(--blue)}
  .stkbtn{border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:999px;
    padding:2px 9px;font-size:10.5px;font-weight:700;cursor:pointer;margin:0 2px;
    vertical-align:middle;white-space:nowrap}
  .stkbtn:hover{border-color:#c9d2e0;color:var(--ink)}
  .stkbtn.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .mrow.sm{margin:2px 0 10px;position:static;padding:0;background:none}
  .chip.sm{padding:3px 10px;font-size:11px}
  .panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px 16px;
         box-shadow:0 1px 3px rgba(16,24,40,.06);
         break-inside:avoid;-webkit-column-break-inside:avoid;display:flow-root;margin:0 0 14px}
  .panel h3{margin:0 0 2px;font-size:13.5px;letter-spacing:-.2px}
  .panel .sub{font-size:11px;color:var(--muted);margin-bottom:12px}
  .grp{font-size:11px;font-weight:800;color:var(--sub);background:var(--soft);
       border-radius:6px;padding:3px 8px;display:inline-block;margin:10px 0 6px}
  .brow{display:grid;grid-template-columns:112px 1fr 96px;align-items:center;gap:8px;
        padding:3px 0;font-size:11.5px}
  .brow .nm{color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brow .tr{height:14px;background:var(--soft);border-radius:4px;overflow:hidden}
  .brow .tr i{display:block;height:100%;background:var(--blue);border-radius:4px;
              transition:width .25s}
  .brow .vl{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
  .brow .vl .sl{color:#c3c9d2;font-weight:400;margin:0 2px}
  .wideval .brow{grid-template-columns:104px 1fr 196px}
  .brow.ttl{border-top:1px solid var(--line);margin-top:6px;padding-top:6px}
  .brow.ttl .nm,.brow.ttl .vl{color:var(--ink);font-weight:800}
  .brow.ttl .tr i{background:#111827}
  /* 전년 대비 모드 — 26FW 지표 11개를 통째로 왼쪽, 25FW 지표 11개를 통째로 오른쪽 블록에 둔다 */
  table.sum.yr th,table.sum.yr td{padding:6px 4px;font-size:11px}
  table.sum.yr td.num,table.sum.yr thead th.num{text-align:center}
  /* 블록 머리 — 26FW / 25FW 를 통째로 덮는 줄 (채도를 낮춘 청색·회색) */
  table.sum.yr thead th.gh{text-align:center;font-size:12px;font-weight:800;letter-spacing:.3px;
    border-bottom:0;padding:8px 4px}
  /* 블록 머리 오른쪽 끝의 데이터 기준 기간 */
  table.sum.yr thead th.gh .rng{position:absolute;right:12px;top:50%;transform:translateY(-50%);
    font-size:10.5px;font-weight:600;letter-spacing:0;opacity:.92}
  /* 상단 캡슐 줄 오른쪽의 데이터 검증 근거 */
  .mrow .basis{flex:1;min-width:280px;margin-left:12px;padding:6px 12px;border-radius:10px;
    background:#fff;border:1px solid var(--line);font-size:11px;line-height:1.55;color:var(--muted)}
  .mrow .basis b{color:var(--sub)}
  .panel h3 .stkbtn{margin-left:8px;vertical-align:1px}
  /* 시점재고 버튼 오른쪽 — 지금 보고 있는 러닝 데이터 기준 */
  .panel h3 .stknote{margin-left:8px;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:0}
  table.sum.yr thead th.gh.cur{color:#fff;background:#5b73a6}
  table.sum.yr thead th.gh.prv{color:#fff;background:#9aa2ae}
  /* 아래 줄(지표명)의 sticky top 은 윗줄 실제 높이에 맞춰 렌더 후 JS 가 채운다 */
  table.sum.yr thead th.lb{font-size:9.5px;font-weight:700;padding:3px 4px 7px;
    background:#eff2f8;color:#5f6e8c}
  table.sum.yr thead th.lb.p25{background:#f2f3f6;color:#78818f}
  /* 두 블록 경계 — 굵은 세로선 (머리줄에서는 흰 선으로 두 색을 갈라 준다) */
  table.sum.yr .bsep{border-left:2px solid #cfd6e4}
  table.sum.yr thead th.gh.bsep,table.sum.yr thead th.lb.bsep{border-left:2px solid #fff}
  table.sum.yr td.p25{color:#6b7480}                      /* 26FW 와 같은 굵기, 색만 한 단계 낮춤 */
  table.sum.yr td.p25.dim{color:#c3c9d2;font-weight:400}
  table.sum.yr tr.ttl td.p25{color:#5b6472}
  table.sum.yr .ar{margin-left:2px;font-size:8.5px;font-weight:700}
  table.sum.yr .ar.up{color:var(--red)} table.sum.yr .ar.down{color:var(--blue)}
  .search{margin-left:auto;display:flex;align-items:center;gap:8px}
  input#q{border:1px solid var(--line);background:var(--soft);border-radius:999px;
          padding:8px 14px;font-size:12.5px;width:230px;outline:none;color:var(--ink)}
  input#q:focus{border-color:var(--blue);background:#fff}
  .meta-right{text-align:right;line-height:1.45;white-space:nowrap}
  .meta-right .upd{font-size:11px;color:var(--muted)}
  .meta-right .upd b{color:var(--ink)}
  .meta-right #count{font-size:11px;color:var(--muted)}
  .frow{display:flex;align-items:center;gap:14px;padding:3px 0;flex-wrap:wrap}
  .fgroup{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .fgroup+.fgroup{border-left:1px solid var(--line);padding-left:14px}
  .flabel{flex:none;font-size:11px;color:var(--muted);font-weight:700;margin-right:2px}
  .chip{border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:999px;
        padding:5px 12px;font-size:12px;cursor:pointer;transition:.12s;white-space:nowrap}
  .chip:hover{border-color:#c9d2e0;color:var(--ink)}
  .chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
  #reset{border:1px solid var(--line);background:var(--soft);border-radius:999px;
         padding:8px 14px;font-size:12px;cursor:pointer;color:var(--sub)}
  #reset:hover{background:#eceff4}

  /* ---------- 카드 ---------- */
  main{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;
       align-items:start}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
        box-shadow:0 1px 3px rgba(16,24,40,.06);
        /* 화면 밖 카드는 렌더링을 건너뛰고, 레이아웃 영향도 카드 안으로 가둠 */
        content-visibility:auto;contain-intrinsic-size:auto 620px;contain:layout paint style}
  .chead{display:flex;align-items:center;gap:6px;padding:9px 12px 0}
  .chead .code{font-size:11px;color:var(--muted);letter-spacing:.4px}
  .tags{margin-left:auto;display:flex;gap:4px}
  .tag{font-size:10.5px;border-radius:5px;padding:2px 7px;font-weight:700}
  .tag.b{background:var(--blue);color:#fff}
  .tag.g{background:var(--soft);color:var(--sub);border:1px solid var(--line)}
  .cname{font-size:15.5px;font-weight:800;letter-spacing:-.3px;padding:3px 12px 8px}

  .thumb{position:relative;background:var(--soft);height:250px;display:flex;
         align-items:center;justify-content:center}
  .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--soft)}
  .thumb .noimg{font-size:11px;color:#c3c9d2;letter-spacing:1px}

  .prices{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--line);
          border-bottom:1px solid var(--line);background:#fff}
  .prices div{padding:8px 6px;text-align:center;border-right:1px solid var(--line)}
  .prices div:last-child{border-right:0}
  .prices b{display:block;font-size:14px;font-weight:800}
  .prices span{display:block;font-size:10.5px;color:var(--muted);margin-top:2px}
  .prices .r b{color:var(--red)}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);padding:9px 4px 7px}
  .stats div{text-align:center}
  .stats b{display:block;font-size:17px;font-weight:800;letter-spacing:-.5px}
  .stats span{display:block;font-size:10.5px;color:var(--muted);margin-top:3px}
  .stats .hl b{color:var(--blue)}

  .prog{margin:0 12px 9px;background:var(--soft);border:1px solid var(--line);border-radius:8px;
        padding:7px 10px}
  .prog .lb{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-bottom:5px}
  .prog .lb b{color:var(--blue)}
  .bar{height:6px;border-radius:99px;background:#e3e8ef;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px;background:var(--blue)}

  table{width:100%;border-collapse:collapse;table-layout:fixed}
  th,td{font-size:11.5px;padding:3px 6px;text-align:right;white-space:nowrap;
        overflow:hidden;text-overflow:ellipsis;line-height:1.25}
  th{color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);background:#fff}
  td.c{text-align:left}
  tbody tr+tr td{border-top:1px solid #f1f3f7}
  .cl{color:var(--blue);font-weight:700;font-size:11.5px;line-height:1.15}
  .cl small{display:block;color:var(--muted);font-weight:400;font-size:9.5px;line-height:1.15}
  table.sum .sh{display:block;font-size:9.5px;font-weight:600;color:var(--muted);line-height:1.1;margin-top:1px}
  table.sum tr.prow.lv2 th.nm{padding-left:22px;font-weight:600}
  table.sum tr.prow.lv2+tr.srow th.nm.sub,table.sum tr.srow[data-p^="g-"] th.nm.sub{padding-left:44px}
  table.sum tr.gttl th.nm{font-weight:800;color:var(--ink)}
  tr.ttl td{border-top:1px solid var(--line);font-weight:800;background:#fbfcfe}
  .dim{color:#c3c9d2}

  details.det{border-top:1px solid var(--line);background:#fcfdfe}
  details.det>summary{list-style:none;cursor:pointer;padding:6px 12px;font-size:11px;
        color:var(--muted);display:flex;align-items:center;gap:5px;user-select:none}
  details.det>summary::-webkit-details-marker{display:none}
  details.det>summary::after{content:'▾';margin-left:auto;font-size:10px;transition:.15s}
  details.det[open]>summary::after{transform:rotate(180deg)}
  details.det>summary:hover{color:var(--sub);background:var(--soft)}
  .meta{padding:2px 12px 8px;display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}
  .meta div{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);
        line-height:1.5}
  .meta div span{color:var(--muted)}
  .foot{border-top:1px solid var(--line);padding:6px 12px;display:flex;gap:6px;flex-wrap:wrap}
  .foot em{font-style:normal;font-size:10.5px;background:var(--blue-soft);color:var(--blue);
           border-radius:5px;padding:3px 8px;font-weight:700}
  .foot em.n{background:var(--soft);color:var(--sub)}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:70px 0}
  .chead .code b{color:var(--blue);font-weight:800}
  .card.has-sub{cursor:pointer}
  .card.has-sub:hover{box-shadow:0 4px 14px rgba(16,24,40,.12);border-color:#c9d6f0}
  .foot em.click{background:#fff;border:1px dashed #c9d6f0;color:var(--blue)}

  /* ---------- 모달 ---------- */
  #modal{position:fixed;inset:0;z-index:50;background:rgba(17,24,39,.45);
         display:none;align-items:flex-start;justify-content:center;padding:24px;overflow:auto}
  #modal.on{display:flex}
  #modal .box{width:380px;max-width:100%}
  #modal .mhead{display:flex;align-items:center;gap:8px;margin-bottom:8px;color:#fff}
  #modal .mhead b{font-size:13px}
  #modal .mhead span{font-size:11px;opacity:.75}
  #modal .x{margin-left:auto;background:rgba(255,255,255,.15);border:0;color:#fff;
            width:26px;height:26px;border-radius:50%;font-size:14px;cursor:pointer}
  #modal .card{cursor:default}

  #sum{display:block}
  /* 열 그룹 구분선 (주간판매·누계판매 시작 열 왼쪽) */
  table.sum td.sep,table.sum th.sep{border-left:1px solid var(--line)}
  /* 접이식 행 — 복종(prow) 클릭 시 하위 카테고리(srow) 펼침 */
  table.sum tr.prow.has{cursor:pointer}
  table.sum tr.prow.has:hover th.nm{color:var(--blue)}
  table.sum tr.prow th.nm{font-weight:700;color:var(--ink)}
  table.sum .tg{display:inline-block;width:14px;color:var(--muted);transition:transform .15s}
  table.sum tr.prow.open .tg{transform:rotate(90deg)}
  table.sum .cnt{margin-left:6px;font-size:9.5px;font-weight:700;color:var(--muted);
    background:var(--soft);border-radius:8px;padding:1px 6px}
  table.sum tr.srow th.nm.sub{padding-left:30px;font-weight:400;color:var(--sub)}
  table.sum tr.srow td,table.sum tr.srow th{background:#fafbfd}
</style>
</head>
<body>
<section id="sum">
  <div class="mrow" id="metrics">
    <span class="flabel">비교</span>
    <button class="chip on" data-mode="wk">전주 대비 비교 DATA</button>
    <button class="chip" data-mode="yr">전년 대비 비교 DATA</button>
    <span class="basis" id="basis"></span>
  </div>
  <div class="panels" id="panels"></div>
</section>

/* 데이터 기준 기간 — 스타일맵 파일 날짜(월요일)의 전날 일요일까지가 26FW,

const UPDATED = '2026-09-28';
// 빌드가 주간판매 시트 W1 라벨에서 읽은 실제 마지막 날. 못 읽었으면 비어 있고, 그때는 파일 날짜 전날로 잡는다
const DATAEND = '2026-09-27';
const _ymd = d => `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
const _end26 = (()=>{
  if(/^\d{4}-\d{2}-\d{2}$/.test(DATAEND)) return new Date(DATAEND + 'T00:00:00');
  const d = new Date(UPDATED + 'T00:00:00'); d.setDate(d.getDate()-1); return d;
})();

const RNG_CUR  = isNaN(_end26) ? '' : `~ ${_ymd(_end26)}`;
// 시작은 끝날짜 직전의 8/1 — 해를 넘긴 1~2월 판이면 전년도 8월이다
const RNG_PREV = isNaN(_end25) ? ''
  : `${_end25.getMonth() < 7 ? _end25.getFullYear()-1 : _end25.getFullYear()}.08.01 ~ ${_ymd(_end25)}`;

   ② 가을 카테고리  ③ 겨울 카테고리 — 복종 행을 클릭하면 하위 카테고리가 펼쳐진다
   ④ 러닝 카테고리 — 같은 방식

   전년 대비 = 종합 시트의 25FW 시즌 블록(py) 과 대조하고, 각 행 아래에 25FW 실적을 한 줄 더 깐다 */

const COLS_ALL = [

const fmtN = v => (v==null ? '-' : Math.round(v).toLocaleString('ko-KR'));
const fmtW = v => v==null ? '-'
  : Math.abs(v)>=1e8 ? (v/1e8).toFixed(1)+'억'
  : Math.abs(v)>=1e4 ? Math.round(v/1e4).toLocaleString('ko-KR')+'만' : fmtN(v);
const fmtP = v => v==null ? '-' : (v*100).toFixed(2)+'%';
const fmtP1 = v => v==null ? '-' : (v*100).toFixed(1)+'%';
const fmtP0 = v => v==null ? '-' : Math.round(v*100)+'%';

const fmtX2 = v => v==null ? '-' : v.toFixed(2);
const FMT = {n:fmtN, w:fmtW, p:fmtP, p1:fmtP1, p0:fmtP0, m:fmtM, x2:fmtX2};

function withStk(o){

  });
  t.sellRate = t.qtyIn ? (t.sales||0)/t.qtyIn : null;
  t.disc     = t.salesTag ? 1-(t.salesAmt||0)/t.salesTag : null;
  t.inRate   = inRateOf(o);          // 입고율은 기획분 기준 유지
  return t;
}

/* 직전 스타일맵 대비 증감. 증가 = 빨강 ▲, 감소 = 파랑 ▼ */
function deltaHtml(v, was, col){
  if(v==null || was==null) return '';
  const d = v - was;
  if(!d) return '';
  let txt;
  if(col.f[0]==='p'){
    const dec = col.f==='p0' ? 0 : 1;
    const val = +(Math.abs(d)*100).toFixed(dec);
    if(!val) return '';
    txt = val.toFixed(dec)+'%';
  }else if(col.f==='m' && Math.abs(d)>=1e5){
    txt = (Math.abs(d)/1e6).toFixed(1)+'백만';
  }else{
    const val = Math.round(Math.abs(d));
    if(!val) return '';
    txt = fmtN(val);
  }
  return `<span class="dt ${d>0?'up':'down'}">${d>0?'▲':'▼'}${txt}</span>`;
}

const valOf = (o,c) => c.k==='inRate' ? inRateOf(o) : get(o,c.k);

// 성별 카테고리: 이 지표들은 값 옆에 전체(여성+유니맨) 대비 비중을 작게 붙인다
const SHARE_KEYS = ['plan', 'qtyIn', 'wkQty', 'wkAmt', 'sales', 'costV'];
function shareHtml(v, col, base){
  if(!base || !SHARE_KEYS.includes(col.k) || v==null) return '';
  const b = valOf(base, col);
  return b ? `<span class="sh">${(v / b * 100).toFixed(1)}%</span>` : '';
}
function cell(v, col, was, base){
  const txt = FMT[col.f](v) + deltaHtml(v, was, col) + shareHtml(v, col, base);
  return `<td class="num${v==null?' dim':''}${col.sep?' sep':''}">${txt}</td>`;
}

/* 전년 대비 모드는 26FW 지표 11개를 통째로 왼쪽, 25FW 지표 11개를 통째로 오른쪽에 둔다.
   왼쪽 값의 ▲▼ 는 방향만 알려 주고, 크기는 오른쪽 블록의 같은 자리 숫자를 읽으면 된다. */
function cellsOfYr(o, cmp, base){
  const left = COLS.map(c=>{
    const a = valOf(o,c), b = valOf(cmp,c);
    const ar = (a!=null && b!=null && a!==b)
      ? `<span class="ar ${a>b?'up':'down'}">${a>b?'▲':'▼'}</span>` : '';
    return `<td class="num${a==null?' dim':''}">${FMT[c.f](a)}${ar}${shareHtml(a, c, base)}</td>`;
  }).join('');
  const right = COLS.map((c,i)=>{
    const b = valOf(cmp,c);
    return `<td class="num p25${i===0?' bsep':''}${b==null?' dim':''}">${FMT[c.f](b)}</td>`;
  }).join('');
  return left + right;
}

function cellsOf(o, cmp, base){
  return MODE==='yr' ? cellsOfYr(o, cmp, base)
                     : COLS.map(c=>cell(valOf(o,c), c, valOf(cmp,c), base)).join('');
}
function dataRow(name, o, cls, cmp, base){
  return `<tr class="${cls||''}"><th class="nm">${name}</th>${cellsOf(o,cmp,base)}</tr>`;
}

const colwWk = c => c.k==='styles' ? '5.9%' : c.k==='sku' ? '5.7%'
  : c.k==='inM' ? '6.4%' : c.k==='inSku' ? '5.9%'
  : c.f==='x2' ? '6.4%'
  : c.f[0]==='p' ? '7.8%' : c.f==='m' ? '10.8%' : '8.5%';
// 지표 하나가 차지하는 폭 — 26FW 블록과 25FW 블록에 같은 값을 쓴다
// 실판매금액은 시점재고 합산 시 10억을 넘어('1172.6백만▲') 가장 넓게 둔다
const YRW = {styles:3.9, plan:4.5, inM:3.9, qtyIn:4.5, inRate:3.4,
             wkQty:4.2, wkAmt:5.2, sales:4.7, sellRate:4.2, salesAmt:5.6, disc:3.6,
             costV:5.6, tag:5.6, mu:3.4, muReal:3.4};

function table(rows){
  if(MODE!=='yr'){
    const cols = `<colgroup><col style="width:7.4%">${COLS.map(c=>`<col style="width:${colwWk(c)}">`).join('')}</colgroup>`;
    return `<div class="tw"><table class="sum">${cols}
      <thead><tr><th class="nm">구분</th>${COLS.map(c=>`<th class="num${c.sep?' sep':''}">${c.label}</th>`).join('')}</tr></thead>
      <tbody>${rows}</tbody></table></div>`;
  }
  const block = () => COLS.map(c=>`<col style="width:${(YRW[c.k]||4.3)}%">`).join('');
  const labels = p => COLS.map((c,i)=>
    `<th class="num lb${p?' p25':''}${p&&i===0?' bsep':''}">${c.label}</th>`).join('');
  return `<div class="tw"><table class="sum yr">
    <colgroup><col style="width:6.6%">${block()}${block()}</colgroup>
    <thead>
      <tr><th class="nm" rowspan="2">구분</th>
        <th class="gh cur" colspan="${COLS.length}">26FW<span class="rng">${RNG_CUR}</span></th>
        <th class="gh prv bsep" colspan="${COLS.length}">25FW<span class="rng">${RNG_PREV}</span></th></tr>
      <tr>${labels(false)}${labels(true)}</tr>
    </thead>
    <tbody>${rows}</tbody></table></div>`;
}
function panel(title, sub, body){
  return `<div class="panel"><h3>${title}</h3>${sub ? `<div class="sub">${sub}</div>` : ''}${body}</div>`;
}

/* 여러 행의 합계 — 수량·금액은 합, 비율은 합계값으로 재계산 */
function sumRows(list){
  const t = {};
  ['plan','qtyIn','sales','salesTag','salesAmt','salesCost','styles','sku','inM','inSku','wkQty','wkAmt','stock',
   'cost','planCost','tag'].forEach(k=>{
    const vs = list.map(d=>d && d[k]).filter(v=>v!=null);
    t[k] = vs.length ? vs.reduce((a,b)=>a+b,0) : null;
  });
  t.inRate   = t.plan ? (t.qtyIn||0)/t.plan : null;
  t.sellRate = t.qtyIn ? (t.sales||0)/t.qtyIn : null;
  t.disc     = t.salesTag ? 1-(t.salesAmt||0)/t.salesTag : null;
  // 원가(원천)는 VAT 미포함 — 표시용 costV 만 x1.1, 마크업 = 택가 / 원가(VAT 포함)
  t.costV    = t.cost!=null ? Math.round(t.cost*1.1) : null;
  t.mu       = t.cost ? (t.tag||0)/t.cost/1.1 : null;
  t.muPlan   = t.planCost ? (t.tag||0)/t.planCost/1.1 : null;
  t.muReal   = t.salesCost ? (t.salesAmt||0)/t.salesCost/1.1 : null;
  return t;
}

/* ---------- 접이식 행 (복종 클릭 -> 하위 카테고리) ---------- */
const matchItem = (a,b) => a===b || a.startsWith(b) || b.startsWith(a);   // ACC <-> ACCESSORY
function parentRow(name, o, cmp, gid, subCount, cls, parent, base){
  const tg = subCount ? `<span class="tg">▸</span>` : `<span class="tg none"></span>`;
  const nest = parent ? ` data-p="${parent}" style="display:none"` : '';
  return `<tr class="prow${subCount?' has':''} ${cls||''}${parent?' lv2':''}" data-g="${gid}"${nest}>
    <th class="nm">${tg}${name}${subCount?`<span class="cnt">${subCount}</span>`:''}</th>${cellsOf(o,cmp,base)}</tr>`;
}
function subRow(name, o, cmp, gid, base){
  return `<tr class="srow" data-p="${gid}" style="display:none">
    <th class="nm sub">${name}</th>${cellsOf(o,cmp,base)}</tr>`;
}

function seasonCatTable(season){
  const parents = SUM.block1.filter(d=>d.mode==='new' && d.season===season && d.item!=='TTL');
  const ttl = SUM.block1.find(d=>d.mode==='new' && d.season===season && d.item==='TTL');
  const rows = parents.map(d=>{
    const subs = SUM.seasonCat.filter(x=>x.season===season && matchItem(x.item, d.item));
    const gid = season+'-'+d.item;
    return parentRow(d.item, d.cur, cmpOf(d), gid, subs.length)
      + subs.map(x=>subRow(x.cat, x, cmpOf(x), gid)).join('');
  }).join('');
  return rows + (ttl ? dataRow(season+' TTL', ttl.cur, 'ttl grand', cmpOf(ttl)) : '');
}

/* 성별(여성/유니맨) 카테고리 — 한 표 안에 성별 묶음 두 개, 시즌 블록과 같은 접이식. 25FW 짝이 없어 전년 모드에서는 오른쪽이 비고,
   기획 ST수·SKU·기획량은 종합 시트(ERP) 값이라 시즌 요약(MDP 기준)과 정의가 다르다 */
const GENDER_LABEL = {'여성': '여성', '남성': '유니맨'};   // 화면 표기 (남성 블록 = 남성+공용 = 유니맨)
/* 성별 카테고리: 성별 TTL 행만 보이고, 클릭하면 복종(OUTER·TOP·BOTTOM·ACC), 복종을 또 클릭하면 하위 카테고리.
   기획량·입고량·주간판매량·주간판매금액·누계판매량·원가 옆에는 전체(여성+유니맨) 대비 비중을 붙인다. */
function genderCatTable(){
  const base = sumRows(SUM.genderItem.filter(d=>d.item==='TOTAL'));   // 여성+유니맨 = 신상품 전체 (비율은 다시 계산)
  return ['여성', '남성'].map(g=>{
    const label = GENDER_LABEL[g] || g;
    const parents = SUM.genderItem.filter(d=>d.gender===g && d.item!=='TOTAL');
    const ttl = SUM.genderItem.find(d=>d.gender===g && d.item==='TOTAL');
    if(!ttl) return '';
    const gid0 = 'g-'+g;
    const rows = parents.map(d=>{
      const subs = SUM.genderCat.filter(x=>x.gender===g && matchItem(x.item, d.item));
      const gid = gid0+'-'+d.item;
      return parentRow(d.item, d, cmpOf(d), gid, subs.length, '', gid0, base)
        + subs.map(x=>subRow(x.cat, x, cmpOf(x), gid, base)).join('');
    }).join('');
    return parentRow(label+' TTL', ttl, cmpOf(ttl), gid0, parents.length, 'ttl gttl', null, base) + rows;
  }).join('') + dataRow('신상품 전체', base, 'ttl grand', null, base);
}

function runCatTable(){
  const parents = SUM.runItem.filter(d=>d.item!=='TOTAL');
  const ttl = SUM.runItem.find(d=>d.item==='TOTAL');
  const rows = parents.map(d=>{
    const subs = SUM.runCat.filter(x=>matchItem(x.item, d.item));
    const gid = 'run-'+d.item;
    return parentRow(d.item, withStk(d), cmpRun(d), gid, subs.length)
      + subs.map(x=>subRow(x.cat, withStk(x), cmpRun(x), gid)).join('');
  }).join('');
  return rows + (ttl ? dataRow('러닝 TTL', withStk(ttl), 'ttl grand runrow', cmpRun(ttl)) : '');
}

/* ---------- 렌더 ---------- */
/* 합계 행의 비교 상대. 한쪽 구성요소에 값이 없는 지표(예: 전년 러닝의 기획량)를
   그냥 더하면 26FW 합계(신상품+러닝) 와 범위가 어긋난 값이 나오므로, 모든 구성요소에
   값이 있는 지표만 남기고 나머지는 비워 증감을 매기지 않는다. */
function cmpSum(rows){
  const cs = rows.map(cmpOf);
  if(!cs.every(c=>c)) return null;
  const t = sumRows(cs);
  // 어느 한쪽에 값이 없으면 합계도 비운다
  Object.keys(t).forEach(k=>{
    if(cs.some(c=>c[k]==null)) t[k] = null;
  });
  if(t.plan==null || t.qtyIn==null) t.inRate = null;
  if(t.qtyIn==null || t.sales==null) t.sellRate = null;
  if(t.salesTag==null || t.salesAmt==null) t.disc = null;
  if(t.cost==null) t.costV = null;
  if(t.cost==null || t.tag==null) t.mu = null;
  if(t.planCost==null || t.tag==null) t.muPlan = null;
  if(t.salesCost==null || t.salesAmt==null) t.muReal = null;
  return t;
}

/* 러닝 보기 전환 — 설명줄의 칩과 러닝 행 클릭, 둘 다 같은 토글이다 */
const runChip = () =>
  `<button class="stkbtn${RUNSTK?' on':''}">${RUNSTK?'기획 + 시점재고':'＋ 시점재고 합산'}</button>`
  + `<span class="stknote">${RUNSTK ? '26FW 러닝 신품번 + 구품번 이월(26.07.31 시점재고) 데이터 포함'
                                    : '26FW 러닝 신품번 기준 데이터'}</span>`;

function renderSum(){
  const yr = MODE==='yr';
  const note = yr
    ? '왼쪽 블록이 <b>26FW</b>, 오른쪽 블록이 <b>25FW</b> 동시점 실적 · 26FW 값의 ▲▼ 는 전년 대비 증감 방향'
    : '값 오른쪽 ▲▼ 는 직전 스타일맵 대비 증감';

  const fall = SUM.block1.find(d=>d.mode==='new' && d.season==='가을' && d.item==='TTL');
  const wint = SUM.block1.find(d=>d.mode==='new' && d.season==='겨울' && d.item==='TTL');
  const newTtl = SUM.block1.find(d=>d.kind==='신상품 TTL');
  const runTtl = SUM.runItem.find(d=>d.item==='TOTAL');

  const run1 = withStk(runTtl);
  const t1 = table(
    (fall ? dataRow('가을', fall.cur, '', cmpOf(fall)) : '') +
    (wint ? dataRow('겨울', wint.cur, '', cmpOf(wint)) : '') +
    (runTtl ? dataRow('러닝', run1, 'runrow', cmpRun(runTtl)) : '') +
    dataRow('합계', sumRows([newTtl && newTtl.cur, run1]), 'ttl grand',
            (RUNSTK && MODE==='wk') ? null : cmpSum([newTtl, runTtl])));

  const grand = table(
    (newTtl ? dataRow('신상품 TTL', newTtl.cur, '', cmpOf(newTtl)) : '') +
    (runTtl ? dataRow('러닝 TTL', run1, 'runrow', cmpRun(runTtl)) : '') +
    dataRow('전체 합계', sumRows([newTtl && newTtl.cur, run1]), 'ttl grand',
            (RUNSTK && MODE==='wk') ? null : cmpSum([newTtl, runTtl])));

  const planNote = (yr
    ? ' · 26FW 기획 ST수·기획량은 MDP 확정 기준'
    : '') + ' · 성별(여성·유니맨) = 신상품을 성별로 나눈 것(기획 ST수·SKU·기획량은 종합 시트 기준' + (yr ? ', 25FW 없음' : '') + ')';
  // 데이터 검증 근거 — 상단 캡슐 줄 오른쪽에 둔다 (모드에 따라 문구가 바뀐다)
  document.getElementById('basis').innerHTML =
    '가을 · 겨울 = 신상품, 러닝 = 26FW 신규 러닝 품번 · ' + note + planNote;

  document.getElementById('panels').innerHTML = [
    panel('① 시즌 요약' + runChip(), '', t1),
    panel('② 가을 카테고리', '', table(seasonCatTable('가을'))),
    panel('③ 겨울 카테고리', '', table(seasonCatTable('겨울'))),
    panel('④ 성별 카테고리', '', table(genderCatTable())),
    panel('⑤ 러닝 카테고리' + runChip(), '', table(runCatTable())),
    panel('⑥ 합계', '', grand),
  ].join('');

  const toggleRun = e => { e.stopPropagation(); RUNSTK = !RUNSTK; renderSum(); };
  document.querySelectorAll('.stkbtn').forEach(b=>b.addEventListener('click', toggleRun));
  document.querySelectorAll('tr.runrow').forEach(tr=>{
    tr.title = RUNSTK ? '누르면 26FW 기획분만 봅니다'
                      : '누르면 26.07.31 시점재고까지 합산해 봅니다';
    tr.addEventListener('click', toggleRun);
  });

  // 2단 헤더의 아랫줄은 윗줄 높이만큼 내려서 고정해야 스크롤 때 틈이 안 생긴다
  document.querySelectorAll('table.sum.yr thead').forEach(th=>{
    const h = th.rows[0].getBoundingClientRect().height;
    [...th.rows[1].cells].forEach(c=>c.style.top = h + 'px');
  });

  const collapse = gid => document.querySelectorAll(`tr[data-p="${CSS.escape(gid)}"]`).forEach(x=>{
    x.style.display = 'none';
    if(x.classList.contains('prow')){ x.classList.remove('open'); collapse(x.dataset.g); }   // 하위 단계까지 접기
  });
  document.querySelectorAll('tr.prow.has').forEach(tr=>tr.addEventListener('click',()=>{
    const open = tr.classList.toggle('open');
    if(open) document.querySelectorAll(`tr[data-p="${CSS.escape(tr.dataset.g)}"]`).forEach(x=>x.style.display = '');
    else collapse(tr.dataset.g);
  }));
}

document.querySelectorAll('#metrics .chip').forEach(b=>b.addEventListener('click',()=>{
  if(b.classList.contains('on')) return;
  document.querySelectorAll('#metrics .chip').forEach(x=>x.classList.toggle('on', x===b));
  MODE = b.dataset.mode;
  COLS = MODE==='yr' ? COLS_YR : COLS_ALL;
  renderSum();
}));

renderSum();
</script>
</body>
</html>
