<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>26FW 시즌 집계표</title>
<style>

  :root{
    --bg:#eef1f5; --card:#fff; --line:#e6e9ef; --soft:#f6f8fa;
    --ink:#111827; --muted:#8b93a1; --sub:#5b6472;
    --blue:#2563eb; --blue-soft:#eaf0fe; --red:#e0294a; --green:#0f9d58;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:"Pretendard","Malgun Gothic","맑은 고딕",-apple-system,Segoe UI,sans-serif;font-size:13px}

  /* ---------- 상단 필터 ---------- */
  header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);
         padding:12px 18px 10px;box-shadow:0 2px 10px rgba(16,24,40,.05)}
  .top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .top h1{font-size:16px;margin:0;letter-spacing:-.2px}
  .tabs{display:flex;gap:4px;background:var(--soft);border-radius:999px;padding:3px}
  .tab{border:0;background:transparent;color:var(--sub);border-radius:999px;
       padding:6px 16px;font-size:12.5px;font-weight:700;cursor:pointer}
  .tab.on{background:var(--blue);color:#fff}
  #sum{padding:16px;display:none}
  #sum.on{display:block}
  #sum .note{background:#fff;border:1px dashed var(--line);border-radius:12px;
             padding:40px 20px;text-align:center;color:var(--muted);line-height:1.8}
  .mrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 14px;
        position:sticky;top:0;z-index:8;background:var(--bg);padding:10px 0 8px}
  .mrow .flabel{margin-right:4px}
  .panels{margin:0}
  /* 집계 표 */
  .tw{overflow-x:auto}
  table.sum{width:100%;border-collapse:collapse;font-size:12px;
    table-layout:fixed;min-width:1960px}   /* 좁은 화면에선 표 영역만 가로 스크롤 (원가·택가·마크업 4열 추가분 포함) */
  table.sum th,table.sum td{padding:6px 8px;white-space:nowrap;border-bottom:1px solid #f1f3f7}
  /* 금액 칸: 값 + 증감 꼬리표가 한 줄에 안 들어가면 꼬리표만 다음 줄로 */
  table.sum td.num{white-space:normal}
  table.sum td.num .dt{display:inline-block;white-space:nowrap}
  table.sum thead th{position:sticky;top:0;background:#fff;color:var(--muted);font-weight:700;
    font-size:11px;border-bottom:1px solid var(--line);z-index:2}
  table.sum th.nm{text-align:left;font-weight:600;color:var(--sub);
    overflow:hidden;text-overflow:ellipsis}   /* 긴 카테고리명은 말줄임 */
  table.sum td.num,table.sum thead th.num{text-align:right;font-variant-numeric:tabular-nums}
  table.sum td.num{font-weight:700}
  table.sum td.dim{color:#c3c9d2;font-weight:400}
  table.sum .dt{margin-left:4px;font-size:10px;font-weight:700}
  table.sum .dt.up{color:var(--red)}
  table.sum .dt.down{color:var(--blue)}
  table.sum tr.grprow th{background:var(--soft);color:var(--sub);font-size:11px;font-weight:800;
    text-align:left;border-bottom:1px solid var(--line)}
  table.sum tr.ttl td,table.sum tr.ttl th{background:#fbfcfe;font-weight:800;color:var(--ink)}
  table.sum tr.grand td,table.sum tr.grand th{background:#f4f6fb;border-top:1px solid var(--line)}
  table.sum tbody tr:hover td{background:#fafbfd}
  /* 러닝 행 — 누르면 시점재고 합산 보기로 전환 */
  table.sum tr.runrow{cursor:pointer}
  table.sum tr.runrow th.nm::after{content:'＋';margin-left:6px;font-size:10px;color:var(--muted)}
  table.sum tr.runrow:hover th.nm::after{color:var(--blue)}
  .stkbtn{border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:999px;
    padding:2px 9px;font-size:10.5px;font-weight:700;cursor:pointer;margin:0 2px;
    vertical-align:middle;white-space:nowrap}
  .stkbtn:hover{border-color:#c9d2e0;color:var(--ink)}
  .stkbtn.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .mrow.sm{margin:2px 0 10px;position:static;padding:0;background:none}
  .chip.sm{padding:3px 10px;font-size:11px}
  .panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px 16px;
         box-shadow:0 1px 3px rgba(16,24,40,.06);
         break-inside:avoid;-webkit-column-break-inside:avoid;display:flow-root;margin:0 0 14px}
  .panel h3{margin:0 0 2px;font-size:13.5px;letter-spacing:-.2px}
  .panel .sub{font-size:11px;color:var(--muted);margin-bottom:12px}
  .grp{font-size:11px;font-weight:800;color:var(--sub);background:var(--soft);
       border-radius:6px;padding:3px 8px;display:inline-block;margin:10px 0 6px}
  .brow{display:grid;grid-template-columns:112px 1fr 96px;align-items:center;gap:8px;
        padding:3px 0;font-size:11.5px}
  .brow .nm{color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brow .tr{height:14px;background:var(--soft);border-radius:4px;overflow:hidden}
  .brow .tr i{display:block;height:100%;background:var(--blue);border-radius:4px;
              transition:width .25s}
  .brow .vl{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
  .brow .vl .sl{color:#c3c9d2;font-weight:400;margin:0 2px}
  .wideval .brow{grid-template-columns:104px 1fr 196px}
  .brow.ttl{border-top:1px solid var(--line);margin-top:6px;padding-top:6px}
  .brow.ttl .nm,.brow.ttl .vl{color:var(--ink);font-weight:800}
  .brow.ttl .tr i{background:#111827}
  /* 전년 대비 모드 — 26FW 지표 11개를 통째로 왼쪽, 25FW 지표 11개를 통째로 오른쪽 블록에 둔다 */
  table.sum.yr th,table.sum.yr td{padding:6px 4px;font-size:11px}
  table.sum.yr td.num,table.sum.yr thead th.num{text-align:center}
  /* 블록 머리 — 26FW / 25FW 를 통째로 덮는 줄 (채도를 낮춘 청색·회색) */
  table.sum.yr thead th.gh{text-align:center;font-size:12px;font-weight:800;letter-spacing:.3px;
    border-bottom:0;padding:8px 4px}
  /* 블록 머리 오른쪽 끝의 데이터 기준 기간 */
  table.sum.yr thead th.gh .rng{position:absolute;right:12px;top:50%;transform:translateY(-50%);
    font-size:10.5px;font-weight:600;letter-spacing:0;opacity:.92}
  /* 상단 캡슐 줄 오른쪽의 데이터 검증 근거 */
  .mrow .basis{flex:1;min-width:280px;margin-left:12px;padding:6px 12px;border-radius:10px;
    background:#fff;border:1px solid var(--line);font-size:11px;line-height:1.55;color:var(--muted)}
  .mrow .basis b{color:var(--sub)}
  .panel h3 .stkbtn{margin-left:8px;vertical-align:1px}
  /* 시점재고 버튼 오른쪽 — 지금 보고 있는 러닝 데이터 기준 */
  .panel h3 .stknote{margin-left:8px;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:0}
  .panel h3 .stkbtn.gift{margin-left:14px}
  .panel h3 .stkbtn.reo{margin-left:14px}
  tr.reorow.off td,tr.reorow.off th{color:var(--muted)}
  tr.reorow .gx{font-size:10px;font-weight:500;color:var(--muted);margin-left:4px}
  /* 사은품(기타) 하위행 — 꺼져 있으면 흐리게 */
  tr.srow.gift.off td,tr.srow.gift.off th{color:var(--muted)}
  tr.srow.gift .gx{font-size:10px;font-weight:500;color:var(--muted);margin-left:4px}
  table.sum.yr thead th.gh.cur{color:#fff;background:#5b73a6}
  table.sum.yr thead th.gh.prv{color:#fff;background:#9aa2ae}
  /* 아래 줄(지표명)의 sticky top 은 윗줄 실제 높이에 맞춰 렌더 후 JS 가 채운다 */
  table.sum.yr thead th.lb{font-size:9.5px;font-weight:700;padding:3px 4px 7px;
    background:#eff2f8;color:#5f6e8c}
  table.sum.yr thead th.lb.p25{background:#f2f3f6;color:#78818f}
  /* 두 블록 경계 — 굵은 세로선 (머리줄에서는 흰 선으로 두 색을 갈라 준다) */
  table.sum.yr .bsep{border-left:2px solid #cfd6e4}
  table.sum.yr thead th.gh.bsep,table.sum.yr thead th.lb.bsep{border-left:2px solid #fff}
  table.sum.yr td.p25{color:#6b7480}                      /* 26FW 와 같은 굵기, 색만 한 단계 낮춤 */
  table.sum.yr td.p25.dim{color:#c3c9d2;font-weight:400}
  table.sum.yr tr.ttl td.p25{color:#5b6472}
  table.sum.yr .ar{margin-left:2px;font-size:8.5px;font-weight:700}
  table.sum.yr .ar.up{color:var(--red)} table.sum.yr .ar.down{color:var(--blue)}
  .search{margin-left:auto;display:flex;align-items:center;gap:8px}
  input#q{border:1px solid var(--line);background:var(--soft);border-radius:999px;
          padding:8px 14px;font-size:12.5px;width:230px;outline:none;color:var(--ink)}
  input#q:focus{border-color:var(--blue);background:#fff}
  .meta-right{text-align:right;line-height:1.45;white-space:nowrap}
  .meta-right .upd{font-size:11px;color:var(--muted)}
  .meta-right .upd b{color:var(--ink)}
  .meta-right #count{font-size:11px;color:var(--muted)}
  .frow{display:flex;align-items:center;gap:14px;padding:3px 0;flex-wrap:wrap}
  .fgroup{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .fgroup+.fgroup{border-left:1px solid var(--line);padding-left:14px}
  .flabel{flex:none;font-size:11px;color:var(--muted);font-weight:700;margin-right:2px}
  .chip{border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:999px;
        padding:5px 12px;font-size:12px;cursor:pointer;transition:.12s;white-space:nowrap}
  .chip:hover{border-color:#c9d2e0;color:var(--ink)}
  .chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
  #reset{border:1px solid var(--line);background:var(--soft);border-radius:999px;
         padding:8px 14px;font-size:12px;cursor:pointer;color:var(--sub)}
  #reset:hover{background:#eceff4}

  /* ---------- 카드 ---------- */
  main{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;
       align-items:start}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
        box-shadow:0 1px 3px rgba(16,24,40,.06);
        /* 화면 밖 카드는 렌더링을 건너뛰고, 레이아웃 영향도 카드 안으로 가둠 */
        content-visibility:auto;contain-intrinsic-size:auto 620px;contain:layout paint style}
  .chead{display:flex;align-items:center;gap:6px;padding:9px 12px 0}
  .chead .code{font-size:11px;color:var(--muted);letter-spacing:.4px}
  .tags{margin-left:auto;display:flex;gap:4px}
  .tag{font-size:10.5px;border-radius:5px;padding:2px 7px;font-weight:700}
  .tag.b{background:var(--blue);color:#fff}
  .tag.g{background:var(--soft);color:var(--sub);border:1px solid var(--line)}
  .cname{font-size:15.5px;font-weight:800;letter-spacing:-.3px;padding:3px 12px 8px}

  .thumb{position:relative;background:var(--soft);height:250px;display:flex;
         align-items:center;justify-content:center}
  .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--soft)}
  .thumb .noimg{font-size:11px;color:#c3c9d2;letter-spacing:1px}

  .prices{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--line);
          border-bottom:1px solid var(--line);background:#fff}
  .prices div{padding:8px 6px;text-align:center;border-right:1px solid var(--line)}
  .prices div:last-child{border-right:0}
  .prices b{display:block;font-size:14px;font-weight:800}
  .prices span{display:block;font-size:10.5px;color:var(--muted);margin-top:2px}
  .prices .r b{color:var(--red)}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);padding:9px 4px 7px}
  .stats div{text-align:center}
  .stats b{display:block;font-size:17px;font-weight:800;letter-spacing:-.5px}
  .stats span{display:block;font-size:10.5px;color:var(--muted);margin-top:3px}
  .stats .hl b{color:var(--blue)}

  .prog{margin:0 12px 9px;background:var(--soft);border:1px solid var(--line);border-radius:8px;
        padding:7px 10px}
  .prog .lb{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-bottom:5px}
  .prog .lb b{color:var(--blue)}
  .bar{height:6px;border-radius:99px;background:#e3e8ef;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px;background:var(--blue)}

  table{width:100%;border-collapse:collapse;table-layout:fixed}
  th,td{font-size:11.5px;padding:3px 6px;text-align:right;white-space:nowrap;
        overflow:hidden;text-overflow:ellipsis;line-height:1.25}
  th{color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);background:#fff}
  td.c{text-align:left}
  tbody tr+tr td{border-top:1px solid #f1f3f7}
  .cl{color:var(--blue);font-weight:700;font-size:11.5px;line-height:1.15}
  .cl small{display:block;color:var(--muted);font-weight:400;font-size:9.5px;line-height:1.15}
  table.sum .sh{display:block;font-size:9.5px;font-weight:600;color:var(--muted);line-height:1.1;margin-top:1px}
  table.sum tr.prow.lv2 th.nm{padding-left:22px;font-weight:600}
  table.sum tr.prow.lv2+tr.srow th.nm.sub,table.sum tr.srow[data-p^="g-"] th.nm.sub{padding-left:44px}
  table.sum tr.gttl th.nm{font-weight:800;color:var(--ink)}
  tr.ttl td{border-top:1px solid var(--line);font-weight:800;background:#fbfcfe}
  .dim{color:#c3c9d2}

  details.det{border-top:1px solid var(--line);background:#fcfdfe}
  details.det>summary{list-style:none;cursor:pointer;padding:6px 12px;font-size:11px;
        color:var(--muted);display:flex;align-items:center;gap:5px;user-select:none}
  details.det>summary::-webkit-details-marker{display:none}
  details.det>summary::after{content:'▾';margin-left:auto;font-size:10px;transition:.15s}
  details.det[open]>summary::after{transform:rotate(180deg)}
  details.det>summary:hover{color:var(--sub);background:var(--soft)}
  .meta{padding:2px 12px 8px;display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}
  .meta div{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);
        line-height:1.5}
  .meta div span{color:var(--muted)}
  .foot{border-top:1px solid var(--line);padding:6px 12px;display:flex;gap:6px;flex-wrap:wrap}
  .foot em{font-style:normal;font-size:10.5px;background:var(--blue-soft);color:var(--blue);
           border-radius:5px;padding:3px 8px;font-weight:700}
  .foot em.n{background:var(--soft);color:var(--sub)}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:70px 0}
  .chead .code b{color:var(--blue);font-weight:800}
  .card.has-sub{cursor:pointer}
  .card.has-sub:hover{box-shadow:0 4px 14px rgba(16,24,40,.12);border-color:#c9d6f0}
  .foot em.click{background:#fff;border:1px dashed #c9d6f0;color:var(--blue)}

  /* ---------- 모달 ---------- */
  #modal{position:fixed;inset:0;z-index:50;background:rgba(17,24,39,.45);
         display:none;align-items:flex-start;justify-content:center;padding:24px;overflow:auto}
  #modal.on{display:flex}
  #modal .box{width:380px;max-width:100%}
  #modal .mhead{display:flex;align-items:center;gap:8px;margin-bottom:8px;color:#fff}
  #modal .mhead b{font-size:13px}
  #modal .mhead span{font-size:11px;opacity:.75}
  #modal .x{margin-left:auto;background:rgba(255,255,255,.15);border:0;color:#fff;
            width:26px;height:26px;border-radius:50%;font-size:14px;cursor:pointer}
  #modal .card{cursor:default}

  #sum{display:block}
  /* 열 그룹 구분선 (주간판매·누계판매 시작 열 왼쪽) */
  table.sum td.sep,table.sum th.sep{border-left:1px solid var(--line)}
  /* 접이식 행 — 복종(prow) 클릭 시 하위 카테고리(srow) 펼침 */
  table.sum tr.prow.has{cursor:pointer}
  table.sum tr.prow.has:hover th.nm{color:var(--blue)}
  table.sum tr.prow th.nm{font-weight:700;color:var(--ink)}
  table.sum .tg{display:inline-block;width:14px;color:var(--muted);transition:transform .15s}
  table.sum tr.prow.open .tg{transform:rotate(90deg)}
  table.sum .cnt{margin-left:6px;font-size:9.5px;font-weight:700;color:var(--muted);
    background:var(--soft);border-radius:8px;padding:1px 6px}
  table.sum tr.srow th.nm.sub{padding-left:30px;font-weight:400;color:var(--sub)}
  table.sum tr.srow td,table.sum tr.srow th{background:#fafbfd}

  /* ---------- 그래프로 보기 (전년 대비) ---------- */
  #gview{margin:0}
  #gview .gvbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 14px;
    position:sticky;top:0;z-index:8;background:var(--bg);padding:10px 0 8px}
  #gview .gvt{font-size:13px;font-weight:800;margin-right:6px}
  #gview .gvlg{margin-left:auto;display:flex;gap:14px;align-items:center;font-size:11px;color:var(--sub);flex-wrap:wrap}
  #gview .gvlg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
  #gview .gvlg .rg{color:var(--muted)}
  #gview .gvtwo{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:760px){#gview .gvtwo{grid-template-columns:1fr}}
  #gview .gvcap{font-size:11px;font-weight:800;color:var(--sub);background:var(--soft);
    border-radius:6px;padding:3px 8px;display:inline-block;margin:0 0 6px}
  #gview .gvdl{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:11.5px;color:var(--sub);margin-top:4px}
  #gview .gvdl b{color:var(--ink);font-weight:700}
  #gview .gvdl .dt{margin-left:3px;font-size:10.5px;font-weight:700}
  #gview .gvdl .dt.up{color:var(--red)} #gview .gvdl .dt.down{color:var(--blue)}
  #gview .gvna,#gview .gvz{color:#b4bbc7;margin-left:3px;font-size:10.5px}
  #gview .gvsum ol{margin:0;padding:0;list-style:none}
  #gview .gvsum li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:13px;line-height:1.6;
    border-top:1px solid #f1f3f7}
  #gview .gvsum li:first-child{border-top:0}
  #gview .gvsum .no{flex:none;width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;
    font-size:11px;font-weight:800;text-align:center;line-height:20px;margin-top:2px}
  #gview .gvsum b{font-weight:800}
  #gview .gvsum .dt{font-weight:800}
  #gview .gvsum .dt.up{color:var(--red)} #gview .gvsum .dt.down{color:var(--blue)}
  #gview .gvsum .sb{color:var(--muted);font-size:11.5px}
  #gview .gvsum .gvna,#gview .gvsum .gvz{color:var(--muted);margin-left:2px}
  #gview .gvnote{font-size:11px;color:var(--muted);margin:2px 2px 16px;line-height:1.6}
  #gview svg{display:block;overflow:visible}
  #gview .gvhit:hover{fill:rgba(91,115,166,.09)}
  #gvtip{position:fixed;z-index:60;pointer-events:none;display:none;background:#111827;color:#fff;
    border-radius:8px;padding:8px 10px;font-size:11.5px;line-height:1.6;white-space:nowrap;
    box-shadow:0 6px 18px rgba(16,24,40,.25)}
  #gvtip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
  #gvtip .tn{font-weight:800;margin-bottom:2px}
  #gvtip b{font-weight:700}

/* 데이터 기준 기간 — 스타일맵 파일 날짜(월요일)의 전날 일요일까지가 26FW,
   25FW 는 같은 요일로 맞춘 작년 동시점(364일 전)까지, 러닝 판매 집계 시작일인 8/1 부터 */
const UPDATED = '2026-11-23';
// 빌드가 주간판매 시트 W1 라벨에서 읽은 실제 마지막 날. 못 읽었으면 비어 있고, 그때는 파일 날짜 전날로 잡는다
const DATAEND = '2026-11-22';
const _ymd = d => `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
const _end26 = (()=>{
  if(/^\d{4}-\d{2}-\d{2}$/.test(DATAEND)) return new Date(DATAEND + 'T00:00:00');
  const d = new Date(UPDATED + 'T00:00:00'); d.setDate(d.getDate()-1); return d;
})();
const _end25 = new Date(_end26.getTime() - 364*86400000);
const RNG_CUR  = isNaN(_end26) ? '' : `~ ${_ymd(_end26)}`;
// 시작은 끝날짜 직전의 8/1 — 해를 넘긴 1~2월 판이면 전년도 8월이다
const RNG_PREV = isNaN(_end25) ? ''
  : `${_end25.getMonth() < 7 ? _end25.getFullYear()-1 : _end25.getFullYear()}.08.01 ~ ${_ymd(_end25)}`;

  {k:'sku',      label:'기획 SKU',    f:'n'},
  {k:'plan',     label:'기획량',      f:'n'},
  {k:'inM',      label:'입고 ST수',   f:'n', sep:true},   // 종합 시트 입고현황 M
  {k:'inSku',    label:'입고 SKU',    f:'n'},              // 종합 시트 입고현황 SKU
  {k:'qtyIn',    label:'입고량',      f:'n'},
  {k:'inRate',   label:'입고율',      f:'p0'},
  {k:'wkQty',    label:'주간판매량',  f:'n', sep:true},   // 왼쪽에 얇은 세로 구분선
  {k:'wkAmt',    label:'주간판매금액', f:'m'},
  {k:'sales',    label:'누계판매량',  f:'n'},
  {k:'sellRate', label:'누계판매율',  f:'p1'},
  {k:'salesAmt', label:'실판매금액',  f:'m'},
  {k:'disc',     label:'할인율',      f:'p1'},
  // 원가(원천 O열)는 VAT 미포함 — 표시는 costV(x1.1) · 마크업은 택가 / 원가(VAT 포함) 직접 계산
  {k:'costV',    label:'원가(VAT 포함)', f:'m', sep:true},
  {k:'tag',      label:'택가금액',     f:'m'},
  {k:'mu',       label:'마크업(택가)',  f:'x2'},
  {k:'muReal',   label:'마크업(실판)',  f:'x2'},
];
// 25FW 블록에는 SKU 집계가 없어 전년 대비에서는 두 열을 뺀다
// 원가·택가·마크업은 전년 대비 모드에서는 뺀다 — 26FW/25FW 두 블록이 나란히 깔려 30열이 된다.
// (25FW 블록(+26)에도 원가·TAG 는 들어 있으니, 보여줘야 하면 아래 PRICE_COLS 조건만 지우면 된다)
const PRICE_COLS = ['costV','tag','mu','muReal'];
const COLS_YR = COLS_ALL.filter(c => c.k!=='sku' && c.k!=='inSku' && !PRICE_COLS.includes(c.k));
let MODE = 'wk';            // 'wk' = 전주 대비 · 'yr' = 전년 대비
let COLS = COLS_ALL;

const fmtN = v => (v==null ? '-' : Math.round(v).toLocaleString('ko-KR'));
const fmtW = v => v==null ? '-'
  : Math.abs(v)>=1e8 ? (v/1e8).toFixed(1)+'억'
  : Math.abs(v)>=1e4 ? Math.round(v/1e4).toLocaleString('ko-KR')+'만' : fmtN(v);
const fmtP = v => v==null ? '-' : (v*100).toFixed(2)+'%';
const fmtP1 = v => v==null ? '-' : (v*100).toFixed(1)+'%';
const fmtP0 = v => v==null ? '-' : Math.round(v*100)+'%';
// 금액은 백만 단위 (8,400,000 -> 8.4백만). 백만 미만의 자잘한 값은 그대로 숫자로.
// 백만 앞자리가 4자리를 넘으면 쉼표로 끊는다 (2565.2백만 -> 2,565.2백만)
const fmtMil = v => (v/1e6).toLocaleString('ko-KR', {minimumFractionDigits:1, maximumFractionDigits:1})+'백만';
const fmtM = v => v==null ? '-' : v===0 ? '0'
  : Math.abs(v)>=1e5 ? fmtMil(v) : fmtN(v);
// 마크업(배수)은 소수 둘째 자리까지
const fmtX2 = v => v==null ? '-' : v.toFixed(2);
const FMT = {n:fmtN, w:fmtW, p:fmtP, p1:fmtP1, p0:fmtP0, m:fmtM, x2:fmtX2};
const get = (o,k) => (o && o[k]!=null) ? o[k] : null;
// 현재 모드에서 이 행이 대조할 상대 — 전주 스냅샷(was) 또는 25FW(py)
const cmpOf = d => !d ? null : (MODE==='wk' ? d.was : d.py);
/* 시점재고를 합치면 전주 스냅샷(기획 기준)과 정의가 달라져 증감이 성립하지 않는다 —
   전주 대비 모드에서만 숨긴다. 전년 대비의 25FW 러닝은 이미 기획량+이월재고가
   합쳐진 값이라, 오히려 합산 모드일 때 기준이 맞으므로 항상 그대로 보여준다. */
const cmpRun = d => (RUNSTK && MODE==='wk') ? null : cmpOf(d);
const inRateOf = o => o==null ? null
  : (o.inRate!=null ? o.inRate : (o.plan ? (o.qtyIn||0)/o.plan : null));

/* 러닝 보기 기준.
   기본(false) = 26FW 기획분만. 켜면(true) 26.07.31 시점재고 물량을 기획량에, 실적을 판매에 얹는다.
   스타일수·SKU·기획량은 기획 항목이라 그대로 두고, 물량과 실적만 합친다.
   입고율도 기획 대비 입고라 건드리지 않는다. */
let RUNSTK = false;
/* 2026-10-07: 시점재고(구품번 이월 물량)는 기획량에 얹는다(사용자 지시).
   2026-11-02: 입고량에도 같은 이월 물량을 얹는다(사용자 지시 '입고량에 시점재고 같이 더해지게').
   → 기획 = 신품번 최초기획 + 이월, 입고 = 신품번 기획입고 + 이월, 판매 = 구+신 합산.
   입고율 = 입고 ÷ 기획, 판매율 = 판매 ÷ 입고 — 분자·분모가 같은 기준(이월 포함)이 된다. */
function withStk(o){
  if(!RUNSTK || !o || !o.stk) return o;
  const s = o.stk, t = Object.assign({}, o);
  if(s.qtyIn!=null){ t.plan = (o.plan||0) + s.qtyIn; t.qtyIn = (o.qtyIn||0) + s.qtyIn; }
  ['sales','salesTag','salesAmt','wkQty','wkAmt'].forEach(k=>{
    if(s[k]!=null) t[k] = (o[k]||0) + s[k];
  });
  t.sellRate = t.qtyIn ? (t.sales||0)/t.qtyIn : null;
  t.disc     = t.salesTag ? 1-(t.salesAmt||0)/t.salesTag : null;
  t.inRate   = t.plan ? (t.qtyIn||0)/t.plan : null;
  return t;
}

/* 직전 스타일맵 대비 증감. 증가 = 빨강 ▲, 감소 = 파랑 ▼ */
// 2026-11-04 사용자 지시: 이번 주차(기준일 2026-11-02)만 기획량 옆 전주 대비 등락을 뺀다 — 다음 빌드부터 자동 복귀
const WK_DELTA_SKIP = UPDATED === '2026-11-02' ? ['plan'] : [];
function deltaHtml(v, was, col){
  if(v==null || was==null) return '';
  if(MODE==='wk' && WK_DELTA_SKIP.includes(col.k)) return '';
  const d = v - was;
  if(!d) return '';
  let txt;
  if(col.f[0]==='p'){
    const dec = col.f==='p0' ? 0 : 1;
    const val = +(Math.abs(d)*100).toFixed(dec);
    if(!val) return '';
    txt = val.toFixed(dec)+'%';
  }else if(col.f==='m' && Math.abs(d)>=1e5){
    txt = fmtMil(Math.abs(d));
  }else{
    const val = Math.round(Math.abs(d));
    if(!val) return '';
    txt = fmtN(val);
  }
  return `<span class="dt ${d>0?'up':'down'}">${d>0?'▲':'▼'}${txt}</span>`;
}

const valOf = (o,c) => c.k==='inRate' ? inRateOf(o) : get(o,c.k);

// 성별 카테고리: 이 지표들은 값 옆에 전체(여성+유니맨) 대비 비중을 작게 붙인다
const SHARE_KEYS = ['plan', 'qtyIn', 'wkQty', 'wkAmt', 'sales', 'costV'];
function shareHtml(v, col, base){
  if(!base || !SHARE_KEYS.includes(col.k) || v==null) return '';
  const b = valOf(base, col);
  return b ? `<span class="sh">${(v / b * 100).toFixed(1)}%</span>` : '';
}
function cell(v, col, was, base){
  const txt = FMT[col.f](v) + deltaHtml(v, was, col) + shareHtml(v, col, base);
  return `<td class="num${v==null?' dim':''}${col.sep?' sep':''}">${txt}</td>`;
}

/* 전년 대비 모드는 26FW 지표 11개를 통째로 왼쪽, 25FW 지표 11개를 통째로 오른쪽에 둔다.
   왼쪽 값의 ▲▼ 는 방향만 알려 주고, 크기는 오른쪽 블록의 같은 자리 숫자를 읽으면 된다. */
function cellsOfYr(o, cmp, base){
  const left = COLS.map(c=>{
    const a = valOf(o,c), b = valOf(cmp,c);
    const ar = (a!=null && b!=null && a!==b)
      ? `<span class="ar ${a>b?'up':'down'}">${a>b?'▲':'▼'}</span>` : '';
    return `<td class="num${a==null?' dim':''}">${FMT[c.f](a)}${ar}${shareHtml(a, c, base)}</td>`;
  }).join('');
  const right = COLS.map((c,i)=>{
    const b = valOf(cmp,c);
    return `<td class="num p25${i===0?' bsep':''}${b==null?' dim':''}">${FMT[c.f](b)}</td>`;
  }).join('');
  return left + right;
}

function cellsOf(o, cmp, base){
  return MODE==='yr' ? cellsOfYr(o, cmp, base)
                     : COLS.map(c=>cell(valOf(o,c), c, valOf(cmp,c), base)).join('');
}
function dataRow(name, o, cls, cmp, base){
  return `<tr class="${cls||''}"><th class="nm">${name}</th>${cellsOf(o,cmp,base)}</tr>`;
}

const colwWk = c => c.k==='styles' ? '5.9%' : c.k==='sku' ? '5.7%'
  : c.k==='inM' ? '6.4%' : c.k==='inSku' ? '5.9%'
  : c.f==='x2' ? '6.4%'
  : c.f[0]==='p' ? '7.4%' : c.f==='m' ? '11.6%' : '8.1%';
// 지표 하나가 차지하는 폭 — 26FW 블록과 25FW 블록에 같은 값을 쓴다
// 실판매금액은 시점재고 합산 시 10억을 넘어('1172.6백만▲') 가장 넓게 둔다
const YRW = {styles:3.9, plan:4.5, inM:3.9, qtyIn:4.5, inRate:3.4,
             wkQty:4.2, wkAmt:5.2, sales:4.7, sellRate:4.2, salesAmt:5.6, disc:3.6,
             costV:5.6, tag:5.6, mu:3.4, muReal:3.4};

function table(rows){
  if(MODE!=='yr'){
    const cols = `<colgroup><col style="width:8.4%">${COLS.map(c=>`<col style="width:${colwWk(c)}">`).join('')}</colgroup>`;
    return `<div class="tw"><table class="sum">${cols}
      <thead><tr><th class="nm">구분</th>${COLS.map(c=>`<th class="num${c.sep?' sep':''}">${c.label}</th>`).join('')}</tr></thead>
      <tbody>${rows}</tbody></table></div>`;
  }
  const block = () => COLS.map(c=>`<col style="width:${(YRW[c.k]||4.3)}%">`).join('');
  const labels = p => COLS.map((c,i)=>
    `<th class="num lb${p?' p25':''}${p&&i===0?' bsep':''}">${c.label}</th>`).join('');
  return `<div class="tw"><table class="sum yr">
    <colgroup><col style="width:6.6%">${block()}${block()}</colgroup>
    <thead>
      <tr><th class="nm" rowspan="2">구분</th>
        <th class="gh cur" colspan="${COLS.length}">26FW<span class="rng">${RNG_CUR}</span></th>
        <th class="gh prv bsep" colspan="${COLS.length}">25FW<span class="rng">${RNG_PREV}</span></th></tr>
      <tr>${labels(false)}${labels(true)}</tr>
    </thead>
    <tbody>${rows}</tbody></table></div>`;
}
function panel(title, sub, body){
  return `<div class="panel"><h3>${title}</h3>${sub ? `<div class="sub">${sub}</div>` : ''}${body}</div>`;
}

/* 여러 행의 합계 — 수량·금액은 합, 비율은 합계값으로 재계산 */
function sumRows(list){
  const t = {};
  ['plan','qtyIn','sales','salesTag','salesAmt','salesCost','styles','sku','inM','inSku','wkQty','wkAmt','stock',
   'cost','planCost','tag'].forEach(k=>{
    const vs = list.map(d=>d && d[k]).filter(v=>v!=null);
    t[k] = vs.length ? vs.reduce((a,b)=>a+b,0) : null;
  });
  t.inRate   = t.plan ? (t.qtyIn||0)/t.plan : null;
  t.sellRate = t.qtyIn ? (t.sales||0)/t.qtyIn : null;
  t.disc     = t.salesTag ? 1-(t.salesAmt||0)/t.salesTag : null;
  // 원가(원천)는 VAT 미포함 — 표시용 costV 만 x1.1, 마크업 = 택가 / 원가(VAT 포함)
  t.costV    = t.cost!=null ? Math.round(t.cost*1.1) : null;
  t.mu       = t.cost ? (t.tag||0)/t.cost/1.1 : null;
  t.muPlan   = t.planCost ? (t.tag||0)/t.planCost/1.1 : null;
  t.muReal   = t.salesCost ? (t.salesAmt||0)/t.salesCost/1.1 : null;
  return t;
}

/* ---------- 사은품('기타') ----------
   빌더는 종합 시트의 사은품 카테고리 행을 상위 합계(ACC·시즌 TTL·신상품 TTL·전체)에서 뺀 뒤 SUM.gift 로 따로 넘긴다.
   화면에서는 ACC 아래 '기타' 하위행으로 항상 보여 주고, '사은품 포함' 버튼을 켜면 상위 합계에 다시 더한다(끄면 제외). */
let GIFTON = false;
const GIFTS = SUM.gift || {seasonCat:[], newCat:[], genderCat:[]};
function giftOf(list, pred){
  const rs = (list||[]).filter(pred);
  if(!rs.length) return null;
  if(rs.length===1) return rs[0];
  const t = sumRows(rs);
  t.py  = rs.every(r=>r.py)  ? sumRows(rs.map(r=>r.py))  : null;
  t.was = rs.every(r=>r.was) ? sumRows(rs.map(r=>r.was)) : null;
  return t;
}
const giftSeason = se => giftOf(GIFTS.seasonCat, x=>x.season===se);
const giftGender = g  => giftOf(GIFTS.genderCat, x=>x.gender===g);
const giftAll    = () => giftOf(GIFTS.seasonCat, x=>true);          // 가을+겨울 = 신상품 전체 사은품
/* a 에 사은품 g 를 더한 값 — 켜져 있을 때만. sumRows 가 기본 키만 돌려주므로 stk 등 나머지 필드는 유지 */
const addG  = (a, g) => (GIFTON && a && g) ? Object.assign({}, a, sumRows([a, g])) : a;
// 비교 상대(py/was)는 사은품 쪽에도 값이 있을 때만 더한다 — 없으면 기준이 어긋나므로 증감을 비운다(첫 스냅샷 주)
const cmpG  = (a, g) => (a && g) ? addG(a, g) : null;
const rowG  = (d, g) => (!d || !GIFTON || !g) ? d : Object.assign({}, d, {cur: addG(d.cur, g), py: cmpG(d.py, g.py), was: cmpG(d.was, g.was)});   // cur/py/was 구조
const flatG = (d, g) => (!d || !GIFTON || !g) ? d : Object.assign({}, d, sumRows([d, g]), {py: cmpG(d.py, g.py), was: cmpG(d.was, g.was)});       // 값이 바로 들어 있는 행
const giftRowName = () => '기타' + (GIFTON ? '' : ' <small class="gx">사은품 · 합계 제외</small>');
const giftChip = () =>
  `<button class="stkbtn gift${GIFTON?' on':''}" title="종합 시트의 사은품 카테고리(ACC 아래 ‘기타’ 행)를 ACC·시즌·신상품·전체 합계에 넣거나 뺍니다">${GIFTON?'사은품 포함':'＋ 사은품 포함'}</button>`;

/* ---------- 26FW 리오더 ----------
   빌더가 CO 시트의 리오더기획(T)·리오더입고(X)를 26FW 신품번(신상 GF3/GF4 · 러닝 GF7/GF8)만 모아 SUM.reorder 로 넘긴다.
   ① 시즌 요약의 러닝 아래 '리오더' 행으로 항상 보여 주고, '리오더 수량 포함' 버튼을 켜면 기획량·입고량·원가·TAG 를
   가을·겨울·러닝·합계 행에 더한다. 판매는 차수로 나눌 수 없어 리오더 행에서는 비워 둔다(합계의 판매는 원래 전체 판매).
   스타일수·SKU 는 같은 스타일의 추가 기획이라 더하지 않는다. */
let REON = false;
const REO = SUM.reorder || [];
const reoOf = name => REO.find(d=>d.name===name) || null;
const REO_KEYS = ['plan','qtyIn','planCost','cost','tag'];
function addR(a, r){
  if(!REON || !a || !r) return a;
  const t = Object.assign({}, a);
  REO_KEYS.forEach(k=>{ if(a[k]!=null || r[k]!=null) t[k] = (a[k]||0) + (r[k]||0); });
  t.inRate   = t.plan ? (t.qtyIn||0)/t.plan : null;
  t.sellRate = t.qtyIn ? (t.sales||0)/t.qtyIn : null;
  t.costV    = t.cost!=null ? Math.round(t.cost*1.1) : null;
  t.mu       = t.cost ? (t.tag||0)/t.cost/1.1 : null;
  t.muPlan   = t.planCost ? (t.tag||0)/t.planCost/1.1 : null;
  return t;
}
// 전주 비교(was)는 리오더 쪽에도 스냅샷이 있을 때만 더한다 — 없으면 기준이 어긋나므로 증감을 비운다(첫 스냅샷 주).
// 전년(py, 25FW)은 ERP 전년비교 시트의 작지·생산 전체라 리오더가 항상 들어 있다 → 리오더 포함을 켜도 그대로 둔다(그때가 같은 기준) (사용자 2026-11-17)
const cmpR = (a, r) => (a && r) ? addR(a, r) : null;
const rowR = (d, r) => (!d || !REON || !r) ? d : Object.assign({}, d, {cur: addR(d.cur, r), py: d.py, was: cmpR(d.was, r.was)});
const reoRowName = () => '리오더' + (REON ? '' : ' <small class="gx">26FW 리오더 · 합계 제외</small>');
const reoRow = (name, cls) => {
  const r = reoOf('TTL');
  if(!r) return '';
  const tip = `26FW 리오더 ${r.styles}스타일 · ${r.sku}SKU — 가을 ${fmtN((reoOf('가을')||{}).plan)} · 겨울 ${fmtN((reoOf('겨울')||{}).plan)} · 러닝 ${fmtN((reoOf('러닝')||{}).plan)} · 판매는 차수로 나눌 수 없어 비움`;
  return `<tr class="${cls||''} reorow${REON?'':' off'}" title="${tip}"><th class="nm">${name}</th>${cellsOf(r, cmpOf(r))}</tr>`;
};
const reoChip = () =>
  `<button class="stkbtn reo${REON?' on':''}" title="26FW 신품번의 리오더 기획·입고(CO 시트 리오더기획·리오더입고)를 가을·겨울·러닝·합계 행의 기획량·입고량·원가·TAG 에 넣거나 뺍니다">${REON?'리오더 수량 포함':'＋ 리오더 수량 포함'}</button>`;

/* ---------- 접이식 행 (복종 클릭 -> 하위 카테고리) ---------- */
const matchItem = (a,b) => a===b || a.startsWith(b) || b.startsWith(a);   // ACC <-> ACCESSORY
const isAcc = it => matchItem(String(it||''), 'ACC');
function parentRow(name, o, cmp, gid, subCount, cls, parent, base){
  const tg = subCount ? `<span class="tg">▸</span>` : `<span class="tg none"></span>`;
  const nest = parent ? ` data-p="${parent}" style="display:none"` : '';
  return `<tr class="prow${subCount?' has':''} ${cls||''}${parent?' lv2':''}" data-g="${gid}"${nest}>
    <th class="nm">${tg}${name}${subCount?`<span class="cnt">${subCount}</span>`:''}</th>${cellsOf(o,cmp,base)}</tr>`;
}
function subRow(name, o, cmp, gid, base, cls){
  return `<tr class="srow${cls?' '+cls:''}" data-p="${gid}" style="display:none">
    <th class="nm sub">${name}</th>${cellsOf(o,cmp,base)}</tr>`;
}
// ACC 아래 '기타'(사은품) 하위행 — 꺼져 있으면 흐리게(합계 제외 표시)
const giftSubRow = (g, gid, base) => g ? subRow(giftRowName(), g, cmpOf(g), gid, base, 'gift' + (GIFTON ? '' : ' off')) : '';

function seasonCatTable(season){
  const parents = SUM.block1.filter(d=>d.mode==='new' && d.season===season && d.item!=='TTL');
  const ttl = SUM.block1.find(d=>d.mode==='new' && d.season===season && d.item==='TTL');
  const g = giftSeason(season);
  const rows = parents.map(d=>{
    const subs = SUM.seasonCat.filter(x=>x.season===season && matchItem(x.item, d.item));
    const gid = season+'-'+d.item;
    const acc = isAcc(d.item), dg = acc ? rowG(d, g) : d;
    return parentRow(d.item, dg.cur, cmpOf(dg), gid, subs.length + (acc && g ? 1 : 0))
      + subs.map(x=>subRow(x.cat, x, cmpOf(x), gid)).join('')
      + (acc ? giftSubRow(g, gid) : '');
  }).join('');
  const tg = rowG(ttl, g);
  return rows + (tg ? dataRow(season+' TTL', tg.cur, 'ttl grand', cmpOf(tg)) : '');
}

/* 성별(여성/유니맨) 카테고리 — 한 표 안에 성별 묶음 두 개, 시즌 블록과 같은 접이식. 25FW 짝이 없어 전년 모드에서는 오른쪽이 비고,
   기획 ST수·SKU·기획량은 시즌 요약과 같은 종합 시트 기준이다 */
const GENDER_LABEL = {'여성': '여성', '남성': '유니맨'};   // 화면 표기 (남성 블록 = 남성+공용 = 유니맨)
/* 성별 카테고리: 성별 TTL 행만 보이고, 클릭하면 복종(OUTER·TOP·BOTTOM·ACC), 복종을 또 클릭하면 하위 카테고리.
   기획량·입고량·주간판매량·주간판매금액·누계판매량·원가 옆에는 전체(여성+유니맨) 대비 비중을 붙인다. */
function genderCatTable(){
  const totals = SUM.genderItem.filter(d=>d.item==='TOTAL');
  const base = sumRows(GIFTON ? totals.concat(GIFTS.genderCat) : totals);   // 여성+유니맨 = 신상품 전체 (비율은 다시 계산) · 사은품 포함 시 더한다
  return ['여성', '남성'].map(g=>{
    const label = GENDER_LABEL[g] || g;
    const parents = SUM.genderItem.filter(d=>d.gender===g && d.item!=='TOTAL');
    const ttl = SUM.genderItem.find(d=>d.gender===g && d.item==='TOTAL');
    if(!ttl) return '';
    const gf = giftGender(g);
    const gid0 = 'g-'+g;
    const rows = parents.map(d=>{
      const subs = SUM.genderCat.filter(x=>x.gender===g && matchItem(x.item, d.item));
      const gid = gid0+'-'+d.item;
      const acc = isAcc(d.item), dg = acc ? flatG(d, gf) : d;
      return parentRow(d.item, dg, cmpOf(dg), gid, subs.length + (acc && gf ? 1 : 0), '', gid0, base)
        + subs.map(x=>subRow(x.cat, x, cmpOf(x), gid, base)).join('')
        + (acc ? giftSubRow(gf, gid, base) : '');
    }).join('');
    const tg = flatG(ttl, gf);
    return parentRow(label+' TTL', tg, cmpOf(tg), gid0, parents.length, 'ttl gttl', null, base) + rows;
  }).join('') + dataRow('신상품 전체', base, 'ttl grand', null, base);
}

function runCatTable(){
  const parents = SUM.runItem.filter(d=>d.item!=='TOTAL');
  const ttl = SUM.runItem.find(d=>d.item==='TOTAL');
  const rows = parents.map(d=>{
    const subs = SUM.runCat.filter(x=>matchItem(x.item, d.item));
    const gid = 'run-'+d.item;
    return parentRow(d.item, withStk(d), cmpRun(d), gid, subs.length)
      + subs.map(x=>subRow(x.cat, withStk(x), cmpRun(x), gid)).join('');
  }).join('');
  return rows + (ttl ? dataRow('러닝 TTL', withStk(ttl), 'ttl grand runrow', cmpRun(ttl)) : '');
}

/* ---------- 렌더 ---------- */
/* 합계 행의 비교 상대. 한쪽 구성요소에 값이 없는 지표(예: 전년 러닝의 기획량)를
   그냥 더하면 26FW 합계(신상품+러닝) 와 범위가 어긋난 값이 나오므로, 모든 구성요소에
   값이 있는 지표만 남기고 나머지는 비워 증감을 매기지 않는다. */
function cmpSum(rows){
  const cs = rows.map(cmpOf);
  if(!cs.every(c=>c)) return null;
  const t = sumRows(cs);
  // 어느 한쪽에 값이 없으면 합계도 비운다
  Object.keys(t).forEach(k=>{
    if(cs.some(c=>c[k]==null)) t[k] = null;
  });
  if(t.plan==null || t.qtyIn==null) t.inRate = null;
  if(t.qtyIn==null || t.sales==null) t.sellRate = null;
  if(t.salesTag==null || t.salesAmt==null) t.disc = null;
  if(t.cost==null) t.costV = null;
  if(t.cost==null || t.tag==null) t.mu = null;
  if(t.planCost==null || t.tag==null) t.muPlan = null;
  if(t.salesCost==null || t.salesAmt==null) t.muReal = null;
  return t;
}

/* 러닝 보기 전환 — 설명줄의 칩과 러닝 행 클릭, 둘 다 같은 토글이다 */
const runChip = () =>
  `<button class="stkbtn${RUNSTK?' on':''}" title="${RUNSTK ? '기획량·입고량 = 26FW 러닝 신품번 + 구품번 이월(26.07.31 시점재고) · 판매 = 구+신 합산' : '누르면 26.07.31 시점재고까지 합산해 봅니다'}">${RUNSTK?'기획 + 시점재고':'＋ 시점재고 합산'}</button>`;

function renderSum(){
  const yr = MODE==='yr';
  const note = yr
    ? '왼쪽 블록이 <b>26FW</b>, 오른쪽 블록이 <b>25FW</b> 동시점 실적 · 26FW 값의 ▲▼ 는 전년 대비 증감 방향'
    : '값 오른쪽 ▲▼ 는 직전 스타일맵 대비 증감';

  // 사은품 포함이 켜지면 시즌 TTL·신상품 TTL 에 사은품(기타) 행을 더한다
  // 리오더 수량 포함이 켜지면 가을·겨울·러닝·합계 행의 기획량·입고량·원가·TAG 에 26FW 리오더를 더한다
  const reoNew = REON ? (()=>{ const rs = ['가을','겨울'].map(reoOf).filter(Boolean); if(!rs.length) return null;
                               const t = sumRows(rs); t.py = null; t.was = rs.every(r=>r.was) ? sumRows(rs.map(r=>r.was)) : null; return t; })() : null;
  const fall = rowR(rowG(SUM.block1.find(d=>d.mode==='new' && d.season==='가을' && d.item==='TTL'), giftSeason('가을')), reoOf('가을'));
  const wint = rowR(rowG(SUM.block1.find(d=>d.mode==='new' && d.season==='겨울' && d.item==='TTL'), giftSeason('겨울')), reoOf('겨울'));
  const newTtl = rowR(rowG(SUM.block1.find(d=>d.kind==='신상품 TTL'), giftAll()), reoNew);
  const runTtl0 = SUM.runItem.find(d=>d.item==='TOTAL');
  const reoRun = reoOf('러닝');
  // 러닝은 값이 바로 들어 있는 행 — 시점재고(withStk) 위에 리오더를 얹고, 비교 상대도 같은 기준으로 맞춘다
  const runTtl = (REON && runTtl0 && reoRun)
    ? Object.assign({}, runTtl0, {py: runTtl0.py, was: cmpR(runTtl0.was, reoRun.was)}) : runTtl0;
  const run1 = addR(withStk(runTtl0), reoRun);
  const runCmp = (REON && reoRun && MODE==='wk') ? cmpR(cmpRun(runTtl0), reoRun.was) : cmpRun(runTtl0);   // 전년(25FW)은 리오더 포함 값 그대로
  const t1 = table(
    (fall ? dataRow('가을', fall.cur, '', cmpOf(fall)) : '') +
    (wint ? dataRow('겨울', wint.cur, '', cmpOf(wint)) : '') +
    (runTtl ? dataRow('러닝', run1, 'runrow', runCmp) : '') +
    reoRow('리오더') +
    dataRow('합계', sumRows([newTtl && newTtl.cur, run1]), 'ttl grand',
            (RUNSTK && MODE==='wk') ? null : cmpSum([newTtl, runTtl])));

  const grand = table(
    (newTtl ? dataRow('신상품 TTL', newTtl.cur, '', cmpOf(newTtl)) : '') +
    (runTtl ? dataRow('러닝 TTL', run1, 'runrow', runCmp) : '') +
    reoRow('리오더 TTL') +
    dataRow('전체 합계', sumRows([newTtl && newTtl.cur, run1]), 'ttl grand',
            (RUNSTK && MODE==='wk') ? null : cmpSum([newTtl, runTtl])));

  const planNote = ' · 기획 ST수·SKU·기획량은 스타일맵(종합 시트) 기준 · 성별(여성·유니맨) = 신상품을 성별로 나눈 것' + (yr ? '(25FW 없음)' : '')
    + (yr ? ' · <b>25FW 수치는 ERP 작지·생산 전체라 리오더가 항상 포함</b> — 같은 기준으로 보려면 \'리오더 수량 포함\'을 켜세요' : '');
  // 데이터 검증 근거 — 상단 캡슐 줄 오른쪽에 둔다 (모드에 따라 문구가 바뀐다)
  document.getElementById('basis').innerHTML =
    '가을 · 겨울 = 신상품, 러닝 = 26FW 신규 러닝 품번 · ' + note + planNote;

  document.getElementById('panels').innerHTML = [
    panel('① 시즌 요약' + runChip() + giftChip() + reoChip(), '', t1),
    panel('② 가을 카테고리', '', table(seasonCatTable('가을'))),
    panel('③ 겨울 카테고리', '', table(seasonCatTable('겨울'))),
    panel('④ 성별 카테고리', '', table(genderCatTable())),
    panel('⑤ 러닝 카테고리' + runChip(), '', table(runCatTable())),
    panel('⑥ 합계', '', grand),
  ].join('');

  const toggleRun = e => { e.stopPropagation(); RUNSTK = !RUNSTK; renderSum(); };
  const toggleGift = e => { e.stopPropagation(); GIFTON = !GIFTON; renderSum(); };
  const toggleReo = e => { e.stopPropagation(); REON = !REON; renderSum(); };
  document.querySelectorAll('.stkbtn:not(.gift):not(.reo)').forEach(b=>b.addEventListener('click', toggleRun));
  document.querySelectorAll('.stkbtn.gift').forEach(b=>b.addEventListener('click', toggleGift));
  document.querySelectorAll('.stkbtn.reo').forEach(b=>b.addEventListener('click', toggleReo));
  document.querySelectorAll('tr.runrow').forEach(tr=>{
    tr.title = RUNSTK ? '누르면 26FW 기획분만 봅니다'
                      : '누르면 26.07.31 시점재고까지 합산해 봅니다';
    tr.addEventListener('click', toggleRun);
  });

  // 2단 헤더의 아랫줄은 윗줄 높이만큼 내려서 고정해야 스크롤 때 틈이 안 생긴다
  document.querySelectorAll('table.sum.yr thead').forEach(th=>{
    const h = th.rows[0].getBoundingClientRect().height;
    [...th.rows[1].cells].forEach(c=>c.style.top = h + 'px');
  });

  const collapse = gid => document.querySelectorAll(`tr[data-p="${CSS.escape(gid)}"]`).forEach(x=>{
    x.style.display = 'none';
    if(x.classList.contains('prow')){ x.classList.remove('open'); collapse(x.dataset.g); }   // 하위 단계까지 접기
  });
  document.querySelectorAll('tr.prow.has').forEach(tr=>tr.addEventListener('click',()=>{
    const open = tr.classList.toggle('open');
    if(open) document.querySelectorAll(`tr[data-p="${CSS.escape(tr.dataset.g)}"]`).forEach(x=>x.style.display = '');
    else collapse(tr.dataset.g);
  }));
}

document.querySelectorAll('#metrics .chip').forEach(b=>b.addEventListener('click',()=>{
  if(b.classList.contains('on')) return;
  document.querySelectorAll('#metrics .chip').forEach(x=>x.classList.toggle('on', x===b));
  MODE = b.dataset.mode;
  COLS = MODE==='yr' ? COLS_YR : COLS_ALL;
  renderSum();
}));

renderSum();

/* ---------- 그래프로 보기 (전년 대비) ----------
   집계표와 같은 SUM 에서 바로 그린다 — 별도 데이터 없음, 표가 바뀌면 그래프도 같이 바뀐다.
   26FW 대 25FW 동시점 고정. 시즌별·복종별을 한 번에 깔고, 첫 막대는 합계.
   러닝 포함·시점재고 합산은 둘 다 켜진 채로 시작하고, 한 번 더 누르면 각각 제외한다(표의 시점재고 칩과는 별개 상태). */
const GV = {on:false, run:true, stk:true};
const GV_ITEMS = ['OUTER','TOP','BOTTOM','ACC'];
const GV_CUR = '#e0294a', GV_PRV = '#9aa2ae';
// 소진 구조 색 — 26FW 는 붉은 계열, 25FW 는 회색 계열 (진한 색 = 누계판매, 옅은 색 = 입고 재고, 가장 옅은 색 = 미입고)
const GV_PAL = [{sold:GV_CUR, stock:'#f7c3cd', un:'#eef0f4'}, {sold:'#9aa2ae', stock:'#d9dde4', un:'#eef0f4'}];
const GV_MET = [
  {k:'plan',    t:'기획량',       s:'막대 · 물량 크기 비교',               f:'n'},
  {k:'qtyIn',   t:'입고량',       s:'막대 · 물량 크기 비교',               f:'n'},
  {k:'inRate',  t:'입고율',       s:'점 연결 · 전년에서 올해로 이동',       f:'r'},
  {k:'sales',   t:'누계판매량',   s:'막대 · 물량 크기 비교',               f:'n'},
  {k:'sellRate',t:'누계판매율',   s:'점 연결 · 전년에서 올해로 이동',       f:'r'},
  {k:'salesAmt',t:'실판매금액',   s:'막대 · 금액 크기 비교 (단위 백만)',    f:'m'},
  {k:'wkAmt',   t:'주간판매금액', s:'막대 · 금액 크기 비교 (단위 백만)',    f:'m'},
];

/* 시즌별·복종별 행 — 각 행은 [이름, {c: 26FW 값 객체, p: 25FW 값 객체 또는 null}] */
function gvViews(){
  const yr = fn => { const m = MODE; MODE = 'yr'; try{ return fn(); } finally{ MODE = m; } };
  const b1 = (s,i) => SUM.block1.find(d=>d.mode==='new' && d.season===s && d.item===i);
  const newTtl = SUM.block1.find(d=>d.kind==='신상품 TTL');
  const runTtl = SUM.runItem.find(d=>d.item==='TOTAL');
  const runIt  = i => SUM.runItem.find(d=>d.item===i);
  // 25FW 값이 비율 비교에 못 쓰이는 행: 판매량이 입고량보다 크거나(판매율 100% 초과),
  // 시트의 판매율이 판매÷입고와 안 맞는 경우(분모에 이월분 등 다른 기준이 섞인 것). 이런 행은 입고율·판매율을 비교불가로 둔다.
  const bad = o => !!o && o.qtyIn!=null && o.sales!=null && (
    o.sales > o.qtyIn*1.0001 ||
    (o.sellRate!=null && o.qtyIn && Math.abs(o.sellRate - o.sales/o.qtyIn) > 0.005));
  const mkP = d => d && d.py ? Object.assign({}, d.py, {_bad: bad(d.py)}) : null;
  const pair    = d => d ? {c:d.cur, p:mkP(d)} : null;
  // 표의 RUNSTK 는 건드리지 않고, 이 계산 동안만 그래프 쪽 시점재고 설정으로 바꿔 withStk 를 쓴다
  const stkAs = fn => { const s = RUNSTK; RUNSTK = GV.stk; try{ return fn(); } finally{ RUNSTK = s; } };
  const runPair = d => d ? {c:stkAs(()=>withStk(d)), p:mkP(d)} : null;
  // 여러 행의 합 — 25FW 쪽은 구성요소 중 하나라도 값이 없으면 그 지표를 비운다(표의 합계 행과 같은 규칙)
  const add = list => {
    const ok = list.filter(Boolean);
    if(!ok.length) return null;
    const p = yr(()=>cmpSum(ok.map(x=>({py:x.p}))));
    if(p) p._bad = ok.some(x=>x.p && x.p._bad);
    return {c: sumRows(ok.map(x=>x.c)), p};
  };
  const run = GV.run;
  const total = run ? add([pair(newTtl), runPair(runTtl)]) : pair(newTtl);
  const bySeason = [['합계', total], ['가을', pair(b1('가을','TTL'))], ['겨울', pair(b1('겨울','TTL'))]];
  if(run) bySeason.push(['러닝', runPair(runTtl)]);
  const byItem = [['합계', total]].concat(GV_ITEMS.map(i=>{
    const n = add([pair(b1('가을',i)), pair(b1('겨울',i))]);
    return [i, run ? add([n, runPair(runIt(i))]) : n];
  }));
  return [{cap:'시즌별', rows:bySeason}, {cap:'복종별' + (run ? ' (러닝 포함)' : ' (신상품)'), rows:byItem}];
}

const gvVal = (o,m) => !o ? null : (m.f==='r' && o._bad) ? null : valOf(o,{k:m.k});
const gvFmt = (v,f) => v==null ? '-' : f==='r' ? fmtP1(v) : f==='m' ? fmtM(v) : fmtN(v);
function gvDelta(c,p,f){
  if(c==null || p==null) return '<span class="gvna">비교불가</span>';
  if(f==='r'){
    const d = (c-p)*100;
    return Math.abs(d)<0.05 ? '<span class="gvz">-</span>'
      : `<span class="dt ${d>0?'up':'down'}">${d>0?'▲':'▼'}${Math.abs(d).toFixed(1)}%p</span>`;
  }
  if(!p) return c ? '<span class="dt up">신규</span>' : '<span class="gvz">-</span>';
  const d = (c/p-1)*100;
  return Math.abs(d)<0.5 ? '<span class="gvz">-</span>'
    : `<span class="dt ${d>0?'up':'down'}">${d>0?'▲':'▼'}${Math.abs(d).toFixed(0)}%</span>`;
}
function gvNice(max){
  if(!(max>0)) return 1;
  const e = Math.pow(10, Math.floor(Math.log10(max))), n = max/e;
  return (n<=1 ? 1 : n<=2 ? 2 : n<=2.5 ? 2.5 : n<=5 ? 5 : 10) * e;
}
function gvTick(v,f){
  if(f==='r') return Math.round(v*100)+'%';
  if(f==='m'){ const x=v/1e6; return x>=10 ? String(Math.round(x)) : x.toFixed(1).replace(/\.0$/,''); }
  return v>=1e4 ? (v/1e4).toFixed(1).replace(/\.0$/,'')+'만' : fmtN(v);
}
const gvEsc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const gvAttr = s => String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function gvTip(name, c, p, m){
  const row = (col,l,v) => `<div><i style="background:${col}"></i>${l} <b>${gvFmt(v,m.f)}</b></div>`;
  return `<div class="tn">${gvEsc(name)} · ${m.t}</div>` + row(GV_CUR,'26FW',c) + row(GV_PRV,'25FW',p)
       + `<div class="td">전년 대비 ${gvDelta(c,p,m.f)}</div>`;
}

/* 막대(물량·금액) / 점 연결(비율) — 25FW 회색, 26FW 청색 */
/* 그래프 위에 직접 쓰는 전년 대비 증감 — 수량·금액은 %, 비율은 %p (하단 문장과 같은 규칙) */
function gvDeltaRaw(c,p,f){
  if(c==null || p==null) return null;
  if(f==='r'){
    const d = (c-p)*100;
    return Math.abs(d)<0.05 ? null : {up:d>0, t:`${d>0?'▲':'▼'}${Math.abs(d).toFixed(1)}%p`};
  }
  if(!p) return c ? {up:true, t:'신규'} : null;
  const d = (c/p-1)*100;
  return Math.abs(d)<0.5 ? null : {up:d>0, t:`${d>0?'▲':'▼'}${Math.abs(d).toFixed(0)}%`};
}

function gvChart(rows, m, W){
  const H=141, L=42, R=6, T=20, B=24, n=rows.length, gw=(W-L-R)/n;
  const cs = rows.map(r=>gvVal(r[1] && r[1].c, m)), ps = rows.map(r=>gvVal(r[1] && r[1].p, m));
  const vals = cs.concat(ps).filter(v=>v!=null);
  const max = Math.max(0, ...vals);
  const top = m.f==='r' ? gvNice(max*100)/100 : gvNice(max);
  const y = v => T + (H-T-B) * (1 - v/top);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${m.t} 26FW와 25FW 동시점 비교">`;
  for(let i=0;i<=4;i++){
    const v=top*i/4, yy=y(v);
    s += `<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="${i?'#eef0f4':'#d9dee7'}"/>`
       + `<text x="${L-6}" y="${yy+3.5}" text-anchor="end" font-size="10" fill="#8b93a1">${gvTick(v,m.f)}</text>`;
  }
  rows.forEach((r,i)=>{
    const cx = L + gw*(i+.5), c = cs[i], p = ps[i];
    if(m.f==='r'){
      if(c!=null && p!=null)
        s += `<line x1="${cx}" x2="${cx}" y1="${y(p)}" y2="${y(c)}" stroke="#cfd6e4" stroke-width="3" stroke-linecap="round"/>`;
      if(p!=null) s += `<circle cx="${cx}" cy="${y(p)}" r="5.5" fill="${GV_PRV}" stroke="#fff" stroke-width="2"/>`;
      if(c!=null) s += `<circle cx="${cx}" cy="${y(c)}" r="5.5" fill="${GV_CUR}" stroke="#fff" stroke-width="2"/>`;
    }else{
      const bw = Math.min(20, gw*0.3), gap = 3;
      [[p,GV_PRV,'25FW',-bw-gap/2],[c,GV_CUR,'26FW',gap/2]].forEach(([v,col,lb,dx])=>{
        if(v==null) return;
        const yy = y(v), h = Math.max(v>0?1:0, y(0)-yy);
        s += `<rect x="${cx+dx}" y="${y(0)-h}" width="${bw}" height="${h}" rx="3" fill="${col}"/>`;
      });
    }
    s += `<text x="${cx}" y="${H-7}" text-anchor="middle" font-size="11" font-weight="${i?500:800}" fill="${i?'#5b6472':'#111827'}">${gvEsc(r[0])}</text>`;
    const dv = gvDeltaRaw(c,p,m.f);
    if(dv) s += `<text x="${cx}" y="${y(Math.max(c,p)) - (m.f==='r' ? 10 : 5)}" text-anchor="middle" font-size="10.5" font-weight="800" fill="${dv.up?'#e0294a':'#2563eb'}">${dv.t}</text>`;
  });
  rows.forEach((r,i)=>{
    s += `<rect class="gvhit" x="${L+gw*i}" y="${T}" width="${gw}" height="${H-T}" fill="transparent" data-tip="${gvAttr(gvTip(r[0], cs[i], ps[i], m))}"/>`;
  });
  return s + '</svg>';
}

/* 기획량 대비 소진 구조 — 기획 100% 중 누계판매 / 입고 후 재고 / 미입고 (행마다 26FW, 25FW 두 줄) */
function gvStack(rows, W){
  const rh=15, gp=6, L=92, R=40, T=2, n=rows.length, H=T + n*(2*rh+gp) + 18, bw=W-L-R;
  const seg = ['sold','stock','un'];
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="기획량 대비 소진 구조">`;
  rows.forEach((r,i)=>{
    [['26FW', r[1] && r[1].c], ['25FW', r[1] && r[1].p]].forEach(([yr,o],j)=>{
      const yy = T + i*(2*rh+gp) + j*rh;
      s += `<text x="${L-8}" y="${yy+rh/2+3.5}" text-anchor="end" font-size="11" fill="${j?'#8b93a1':'#111827'}" font-weight="${j?400:700}">${gvEsc(r[0])} · ${yr}</text>`;
      const ok = o && o.plan>0 && o.qtyIn!=null && o.qtyIn<=o.plan*1.0001 && o.sales!=null && o.sales<=o.qtyIn*1.0001 && !o._bad;
      if(!ok){ s += `<text x="${L}" y="${yy+rh/2+3.5}" font-size="10.5" fill="#b4bbc7">비교불가</text>`; return; }
      const f = {sold:o.sales/o.plan, stock:(o.qtyIn-o.sales)/o.plan, un:(o.plan-o.qtyIn)/o.plan};
      let x = L;
      seg.forEach(k=>{
        const col = GV_PAL[j][k];
        const w = Math.max(0, bw*f[k]);
        if(w>0) s += `<rect x="${x}" y="${yy+2}" width="${w}" height="${rh-4}" fill="${col}"/>`;
        x += w;
      });
      s += `<text x="${L+bw+6}" y="${yy+rh/2+3.5}" font-size="10.5" font-weight="700" fill="#5b6472">${Math.round(f.sold*100)}%</text>`;
    });
  });
  rows.forEach((r,i)=>{
    const line = (yr,o,col) => {
      const ok = o && o.plan>0 && o.qtyIn!=null && o.qtyIn<=o.plan*1.0001 && o.sales!=null && o.sales<=o.qtyIn*1.0001 && !o._bad;
      if(!ok) return `<div><i style="background:${col}"></i>${yr} <span class="gvna">비교불가</span></div>`;
      const pc = x => (x/o.plan*100).toFixed(1)+'%';
      return `<div><i style="background:${col}"></i>${yr} 기획 <b>${fmtN(o.plan)}</b> · 입고 <b>${fmtN(o.qtyIn)}</b> · 판매 <b>${fmtN(o.sales)}</b></div>`
           + `<div style="padding-left:13px;color:#cbd2de">판매 ${pc(o.sales)} · 재고 ${pc(o.qtyIn-o.sales)} · 미입고 ${pc(o.plan-o.qtyIn)}</div>`;
    };
    const tip = `<div class="tn">${gvEsc(r[0])} · 소진 구조 (기획 대비)</div>` + line('26FW', r[1] && r[1].c, GV_CUR) + line('25FW', r[1] && r[1].p, GV_PRV);
    s += `<rect class="gvhit" x="0" y="${T + i*(2*rh+gp) - gp/2}" width="${W}" height="${2*rh+gp}" fill="transparent" data-tip="${gvAttr(tip)}"/>`;
  });
  const ay = H-14;
  for(let i=0;i<=2;i++){
    const x = L + bw*i/2;
    s += `<text x="${x}" y="${ay+11}" text-anchor="${i==0?'start':i==2?'end':'middle'}" font-size="10" fill="#8b93a1">${i*50}%</text>`;
  }
  return s + '</svg>';
}

function gvDeltaLine(rows, m){
  return '<div class="gvdl">' + rows.map(r=>{
    const c = gvVal(r[1] && r[1].c, m), p = gvVal(r[1] && r[1].p, m);
    return `<span>${gvEsc(r[0])} <b>${gvFmt(c,m.f)}</b>${gvDelta(c,p,m.f)}</span>`;
  }).join('') + '</div>';
}

/* 주간회의용 분석 5줄 (고정 형식: 긍정 2 · 부정 2 · 종합 1) — 집계표 데이터에서 자동 생성.
   ①② 긍정적인 부분 (전주 대비 / 전년 대비)  ③④ 부정적인 부분 (전주 대비 / 전년 대비)  ⑤ 종합 추세
   근거: 주간판매금액의 전주·전년 동주 대비, 누계 실판매금액의 전년 동시점 대비, 누계판매율의 전년 대비.
   시즌(가을·겨울·러닝)과 복종(OUTER·TOP·BOTTOM·ACC)을 모두 후보로 놓고 가장 두드러진 항목을 고른다.
   전주 값(was)에는 러닝 시점재고가 없어서 주간 비교의 러닝은 시점재고를 얹기 전 기획분 기준이다. */
function gvSummary(){
  const b1 = (s,i) => SUM.block1.find(d=>d.mode==='new' && d.season===s && d.item===i);
  const runTtl = SUM.runItem.find(d=>d.item==='TOTAL');
  const runIt  = i => SUM.runItem.find(d=>d.item===i);
  const wk = o => (o && o.wkAmt!=null) ? o.wkAmt : null;
  const trip = d => d ? {c:wk(d.cur||d), w:wk(d.was), p:wk(d.py)} : {c:null,w:null,p:null};
  const sum3 = list => {
    const r = {c:0,w:0,p:0};
    ['c','w','p'].forEach(k=>{ r[k] = list.every(x=>x[k]!=null) ? list.reduce((s,x)=>s+x[k],0) : null; });
    return r;
  };
  const mm = v => (v/1e6).toFixed(1) + '백만';
  const arrow = d => d>0 ? '▲' : '▼';
  const cls = d => d>0 ? 'up' : 'down';
  const pctV = (c,b) => (c==null || b==null || !b) ? null : (c/b-1)*100;
  const pctS = v => v==null ? '<span class="gvna">비교불가</span>'
    : Math.abs(v)<0.05 ? '<span class="gvz">-</span>'
    : `<span class="dt ${cls(v)}">${arrow(v)}${Math.abs(v).toFixed(1)}%</span>`;
  const ppS = v => v==null ? '<span class="gvna">비교불가</span>'
    : `<span class="dt ${cls(v)}">${arrow(v)}${Math.abs(v).toFixed(1)}%p</span>`;
  const amtS = d => `<span class="dt ${cls(d)}">${arrow(d)}${mm(Math.abs(d))}</span>`;

  const views = gvViews();
  const mAmt = GV_MET.find(m=>m.k==='salesAmt'), mRate = GV_MET.find(m=>m.k==='sellRate');
  const rowOf = (vi,n) => { const r = views[vi].rows.find(x=>x[0]===n); return r && r[1]; };

  // 후보: 시즌 + 복종
  const ents = [];
  const seasons = [['가을', trip(b1('가을','TTL'))], ['겨울', trip(b1('겨울','TTL'))]];
  if(GV.run) seasons.push(['러닝', trip(runTtl)]);
  seasons.forEach(([n,t])=>ents.push({n, t, kind:'s', row:rowOf(0,n)}));
  GV_ITEMS.forEach(i=>{
    const t = sum3([trip(b1('가을',i)), trip(b1('겨울',i))].concat(GV.run ? [trip(runIt(i))] : []));
    ents.push({n:i, t, kind:'i', row:rowOf(1,i)});
  });
  ents.forEach(e=>{
    const r = e.row, c = r && r.c, p = r && r.p;
    e.wkD   = (e.t.c!=null && e.t.w!=null && Math.max(e.t.c,e.t.w)>=5e6) ? e.t.c-e.t.w : null;     // 주간판매 전주 대비 증감액
    e.wkP   = e.wkD==null ? null : pctV(e.t.c, e.t.w);
    const ca = gvVal(c,mAmt), pa = gvVal(p,mAmt);
    e.ysP   = (ca!=null && pa!=null && pa>=5e7) ? pctV(ca,pa) : null;                                // 누계 실판매금액 전년 대비 %
    const cr = gvVal(c,mRate), pr = gvVal(p,mRate);
    const sold = Math.max((c&&c.sales)||0, (p&&p.sales)||0);
    e.rtD   = (cr!=null && pr!=null && sold>=1000) ? (cr-pr)*100 : null;                             // 누계판매율 전년 대비 %p
    e.cr = cr; e.pr = pr;
  });

  // 가장 두드러진 항목 고르기 (sign=+1 긍정, -1 부정). kind 로 시즌('s')·복종('i') 중 한쪽만 볼 수 있다.
  const best = (key, sign, min, kind) => ents.filter(e=>(!kind || e.kind===kind) && e[key]!=null && e[key]*sign>min)
    .reduce((a,e)=>(!a || e[key]*sign>a[key]*sign) ? e : a, null);
  const kn = e => e.kind==='s' ? `${e.n}(시즌)` : `${e.n}(복종)`;
  // 해당하는 항목이 하나도 없을 때: 방향은 반대지만 '상대적으로 가장 나은/가장 나쁜' 곳을 대신 보여 줘 줄이 비지 않게 한다
  const rel = (key, sign, kind) => ents.filter(e=>(!kind || e.kind===kind) && e[key]!=null)
    .reduce((a,e)=>(!a || e[key]*sign>a[key]*sign) ? e : a, null);
  const fbHead = (sign, what) => `<span class="sb">${what} ${sign>0?'늘어난':'줄어든'} 곳 없음 — ${sign>0?'감소폭이':'증가폭이'} 가장 작은 곳:</span> `;
  // 전주 대비 한 줄: 시즌 대표 + 복종 대표 / 전년 대비 한 줄: 판매금액 대표 + 판매율 대표
  const wkLine = sign => {
    const out = ['s','i'].map(k=>best('wkD', sign, 0, k)).filter(Boolean)
      .map(e=>`<b>${kn(e)}</b> 주간판매 ${pctS(e.wkP)}(${amtS(e.wkD)})`);
    if(out.length) return out.join(' · ');
    const f = ['s','i'].map(k=>rel('wkP', sign, k)).filter(Boolean).map(e=>`<b>${kn(e)}</b> 주간판매 ${pctS(e.wkP)}`);
    return f.length ? fbHead(sign,'전주보다') + f.join(' · ') : '';
  };
  const yoyLine = sign => {
    const out = [], y = best('ysP', sign, 0.5), r = best('rtD', sign, 0.5);
    if(y) out.push(`<b>${kn(y)}</b> 누계 판매금액 ${pctS(y.ysP)}`);
    if(r) out.push(`<b>${kn(r)}</b> 누계판매율 ${gvFmt(r.cr,'r')} (전년 ${gvFmt(r.pr,'r')}, ${ppS(r.rtD)})`);
    if(out.length) return out.join(' · ');
    const fy = rel('ysP', sign), fr = rel('rtD', sign), f = [];
    if(fy) f.push(`<b>${kn(fy)}</b> 누계 판매금액 ${pctS(fy.ysP)}`);
    if(fr) f.push(`<b>${kn(fr)}</b> 누계판매율 ${gvFmt(fr.cr,'r')} (전년 ${gvFmt(fr.pr,'r')}, ${ppS(fr.rtD)})`);
    return f.length ? fbHead(sign,'전년보다') + f.join(' · ') : '';
  };
  const mk = (tag, sub, txt, none) => `<b>${tag}</b> <span class="sb">${sub}</span> — ` + (txt || none);
  const l1 = mk('긍정적인 부분', '전주 대비', wkLine(+1), '전주보다 판매금액이 늘어난 시즌·복종이 없습니다');
  const l2 = mk('긍정적인 부분', '전년 대비', yoyLine(+1), '전년 동시점보다 판매금액·판매율이 오른 시즌·복종이 없습니다');
  const l3 = mk('부정적인 부분', '전주 대비', wkLine(-1), '전주보다 판매금액이 줄어든 시즌·복종이 없습니다');
  const l4 = mk('부정적인 부분', '전년 대비', yoyLine(-1), '전년 동시점보다 판매금액·판매율이 내린 시즌·복종이 없습니다');

  // ③ 종합 추세 — 전체(합계) 기준
  const tot = sum3(seasons.map(x=>x[1]));
  const trow = views[0].rows[0][1];
  const ca = gvVal(trow && trow.c, mAmt), pa = gvVal(trow && trow.p, mAmt);
  const cr = gvVal(trow && trow.c, mRate), pr = gvVal(trow && trow.p, mRate);
  const wow = pctV(tot.c, tot.w), wyoy = pctV(tot.c, tot.p), cyoy = pctV(ca, pa);
  let verdict = '판단 보류';
  if(wow!=null && cyoy!=null){
    verdict = cyoy < -10 ? (wow < 0 ? '전년 대비 부진 · 주간 판매도 둔화(하락 추세)' : '전년 대비 부진 · 주간은 반등')
                         : (wow < 0 ? '전년 수준 · 주간 판매는 둔화' : '전년 수준 이상 · 주간 판매 회복(상승 추세)');
  }
  const l5 = `<b>종합 추세</b> — <b>${verdict}</b>. 이번 주 판매 ${tot.c==null?'-':mm(tot.c)}, 전주 대비 ${pctS(wow)} · 전년 동주 대비 ${pctS(wyoy)} / `
    + `누계 판매금액 전년 동시점 대비 ${pctS(cyoy)} / 누계판매율 ${gvFmt(cr,'r')}`
    + (pr!=null ? ` (전년 ${gvFmt(pr,'r')}, ${ppS((cr-pr)*100)})` : ' <span class="sb">(전년 판매율은 비교불가)</span>')
    + (GV.run && GV.stk ? ' <span class="sb">· 주간 비교의 러닝은 시점재고 제외 기준</span>' : '');
  return [l1, l2, l3, l4, l5];
}

function gvRender(){
  const tp0 = document.getElementById('gvtip'); if(tp0) tp0.style.display = 'none';
  const views = gvViews();
  const lg = (col,t) => `<span><i style="background:${col}"></i>${t}</span>`;
  document.getElementById('gvhead').innerHTML =
    `<button class="chip" id="gvBack">← 집계표</button>`
    + `<span class="gvt">전년 대비 그래프</span>`
    + `<button class="chip${GV.run?' on':''}" id="gvRun">${GV.run?'✓ ':'＋ '}러닝 ${GV.run?'포함':'제외'}</button>`
    + (GV.run ? `<button class="stkbtn${GV.stk?' on':''}" id="gvStk">${GV.stk?'기획 + 시점재고':'＋ 시점재고 합산'}</button>` : '')
    + `<span class="gvlg">${lg(GV_CUR,'26FW <span class="rg">'+RNG_CUR+'</span>')}${lg(GV_PRV,'25FW 동시점 <span class="rg">'+RNG_PREV+'</span>')}`
    + `<span class="rg">증감: 수량·금액 %, 비율 %p</span></span>`;

  const panel = (t, s, inner) => `<div class="panel"><h3>${t}</h3><div class="sub">${s}</div>${inner}</div>`;
  const cols = (kind, m) => '<div class="gvtwo">' + views.map((v,i)=>
    `<div><span class="gvcap">${v.cap}</span><div class="gvcol" data-v="${i}" data-kind="${kind}" data-m="${m ? m.k : ''}"></div></div>`).join('') + '</div>';
  const sum = gvSummary();
  document.getElementById('gvbody').innerHTML =
    `<div class="panel gvsum"><h3>이번 주 분석</h3><div class="sub">긍정 2 · 부정 2 · 종합 추세 1 — 집계표 데이터에서 자동으로 만든 요약 · 주간회의용</div><ol>`
      + sum.map((s,i)=>`<li><span class="no">${i+1}</span><span>${s}</span></li>`).join('') + `</ol></div>`
    + GV_MET.map(m=>panel(m.t, m.s, cols('chart', m))).join('')
    + panel('기획량 대비 소진 구조', '누적 막대 · 기획 100% 중 누계판매 / 입고 후 재고 / 미입고 · 오른쪽 숫자 = 누계판매 비중',
        `<div class="gvlg" style="margin:0 0 8px;justify-content:flex-start">${lg(GV_PAL[0].sold,'26FW 누계판매')}${lg(GV_PAL[0].stock,'26FW 입고 재고')}${lg(GV_PAL[1].sold,'25FW 누계판매')}${lg(GV_PAL[1].stock,'25FW 입고 재고')}${lg(GV_PAL[0].un,'미입고')}</div>` + cols('stack'))
    + `<div class="gvnote">${GV.run
        ? '러닝 포함: 26FW 러닝 ' + (GV.stk ? '신품번 + 시점재고(26.07.31) 합산' : '신규 품번 기준') + ' 대 25FW 러닝(종합 시트 값 그대로). 25FW 러닝은 판매량이 입고량보다 커서(이월분이 판매에만 잡힘) 입고율·판매율은 전년과 비교할 수 없어 "비교불가"로 둡니다. 러닝이 들어간 합계도 같습니다.'
        : '러닝 제외: 신상품(가을+겨울)만 집계하고, 합계 = 가을 + 겨울입니다.'} 값은 위 집계표와 같은 데이터입니다.</div>`;

  document.querySelectorAll('#gview .gvcol').forEach(el=>{
    const v = views[+el.dataset.v], W = Math.max(240, Math.floor(el.clientWidth));
    if(el.dataset.kind==='stack'){ el.innerHTML = gvStack(v.rows, W); return; }
    const m = GV_MET.find(x=>x.k===el.dataset.m);
    el.innerHTML = gvChart(v.rows, m, W) + gvDeltaLine(v.rows, m);
  });

  document.getElementById('gvBack').onclick = () => gvSet(false);
  document.getElementById('gvRun').onclick  = () => { GV.run = !GV.run; gvRender(); };
  const stk = document.getElementById('gvStk');
  if(stk) stk.onclick = () => { GV.stk = !GV.stk; gvRender(); };
}

function gvSet(on){
  GV.on = on;
  document.getElementById('metrics').style.display = on ? 'none' : '';
  document.getElementById('panels').style.display  = on ? 'none' : '';
  document.getElementById('gview').style.display   = on ? '' : 'none';
  if(on) gvRender();
  window.scrollTo(0,0);
  if(window.parent!==window) window.parent.postMessage({type:'gv-state', on}, '*');
}

(function(){
  const gv = document.createElement('div');
  gv.id = 'gview'; gv.style.display = 'none';
  gv.innerHTML = '<div class="gvbar" id="gvhead"></div><div id="gvbody"></div>';
  document.getElementById('panels').after(gv);

  // 단독으로 열었을 때(새 창)는 표 위 캡슐 줄에 버튼을 둔다. 공유파일 화면 안에서는 상단 머리줄의 버튼이 이 일을 한다.
  if(window.parent===window){
    const b = document.createElement('button');
    b.className = 'chip gvgo'; b.textContent = '그래프로 보기';
    b.onclick = () => gvSet(true);
    document.querySelector('#metrics .chip[data-mode="yr"]').after(b);
  }else{
    // 공유파일 화면(index.html)의 '그래프로 보기' 버튼과 주고받는다
    window.addEventListener('message', e=>{
      if(e.source!==window.parent || !e.data) return;
      if(e.data.type==='gv-toggle') gvSet(!GV.on);
      if(e.data.type==='gv-ping')   window.parent.postMessage({type:'gv-ready'}, '*');
    });
    window.parent.postMessage({type:'gv-ready'}, '*');
  }
  // 그래프 위에 마우스를 올리면 값 말풍선 (그룹 단위로 26FW · 25FW · 증감)
  const tip = document.createElement('div');
  tip.id = 'gvtip'; document.body.appendChild(tip);
  const hide = () => { tip.style.display = 'none'; tip._src = null; };
  gv.addEventListener('mousemove', e=>{
    const t = e.target.closest && e.target.closest('[data-tip]');
    if(!t){ hide(); return; }
    if(tip._src!==t){ tip.innerHTML = t.getAttribute('data-tip'); tip._src = t; }
    tip.style.display = 'block';
    const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
    let x = e.clientX + pad, y = e.clientY + pad;
    if(x + w > window.innerWidth - 6)  x = e.clientX - w - pad;
    if(y + h > window.innerHeight - 6) y = e.clientY - h - pad;
    tip.style.left = Math.max(4, x) + 'px'; tip.style.top = Math.max(4, y) + 'px';
  });
  gv.addEventListener('mouseleave', hide);
  window.addEventListener('scroll', hide, true);
  let rt = 0;
  window.addEventListener('resize', ()=>{ clearTimeout(rt); rt = setTimeout(()=>{ if(GV.on) gvRender(); }, 150); });
  if(location.hash==='#graph') gvSet(true);
})();
</script>
