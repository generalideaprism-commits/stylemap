<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>26FW 시즌 집계표</title>
<style>

  :root{
    --bg:#eef1f5; --card:#fff; --line:#e6e9ef; --soft:#f6f8fa;
    --ink:#111827; --muted:#8b93a1; --sub:#5b6472;
    --blue:#2563eb; --blue-soft:#eaf0fe; --red:#e0294a; --green:#0f9d58;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:"Pretendard","Malgun Gothic","맑은 고딕",-apple-system,Segoe UI,sans-serif;font-size:13px}

  /* ---------- 상단 필터 ---------- */
  header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);
         padding:12px 18px 10px;box-shadow:0 2px 10px rgba(16,24,40,.05)}
  .top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .top h1{font-size:16px;margin:0;letter-spacing:-.2px}
  .tabs{display:flex;gap:4px;background:var(--soft);border-radius:999px;padding:3px}
  .tab{border:0;background:transparent;color:var(--sub);border-radius:999px;
       padding:6px 16px;font-size:12.5px;font-weight:700;cursor:pointer}
  .tab.on{background:var(--blue);color:#fff}
  #sum{padding:16px;display:none}
  #sum.on{display:block}
  #sum .note{background:#fff;border:1px dashed var(--line);border-radius:12px;
             padding:40px 20px;text-align:center;color:var(--muted);line-height:1.8}
  .mrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 14px;
        position:sticky;top:54px;z-index:8;background:var(--bg);padding:10px 0 8px}
  .mrow .flabel{margin-right:4px}
  .panels{margin:0}
  /* 집계 표 */
  .tw{overflow-x:auto}
  table.sum{width:100%;border-collapse:collapse;font-size:12px}
  table.sum th,table.sum td{padding:6px 10px;white-space:nowrap;border-bottom:1px solid #f1f3f7}
  table.sum thead th{position:sticky;top:0;background:#fff;color:var(--muted);font-weight:700;
    font-size:11px;border-bottom:1px solid var(--line);z-index:2}
  table.sum th.nm{text-align:left;font-weight:600;color:var(--sub)}
  table.sum td.num,table.sum thead th.num{text-align:right;font-variant-numeric:tabular-nums}
  table.sum td.num{font-weight:700}
  table.sum td.dim{color:#c3c9d2;font-weight:400}
  table.sum td.g{white-space:nowrap}
  table.sum .dt{margin-left:5px;font-size:10.5px;font-weight:700}
  table.sum .dt.up{color:var(--red)}
  table.sum .dt.down{color:var(--blue)}
  table.sum .gauge{display:inline-block;width:34px;height:5px;border-radius:3px;
    background:#e6eaf1;margin-right:6px;vertical-align:middle;overflow:hidden}
  table.sum .gauge i{display:block;height:100%;background:var(--blue);border-radius:3px}
  table.sum tr.grprow th{background:var(--soft);color:var(--sub);font-size:11px;font-weight:800;
    text-align:left;border-bottom:1px solid var(--line)}
  table.sum tr.ttl td,table.sum tr.ttl th{background:#fbfcfe;font-weight:800;color:var(--ink)}
  table.sum tr.grand td,table.sum tr.grand th{background:#f4f6fb;border-top:1px solid var(--line)}
  table.sum tbody tr:hover td{background:#fafbfd}
  .mrow.sm{margin:2px 0 10px;position:static;padding:0;background:none}
  .chip.sm{padding:3px 10px;font-size:11px}
  #cmp{margin-top:34px}   /* 멀티컬럼 마지막 표와 전년 비교 표 사이 간격 */
  .panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px 16px;
         box-shadow:0 1px 3px rgba(16,24,40,.06);
         break-inside:avoid;-webkit-column-break-inside:avoid;display:flow-root;margin:0 0 14px}
  .panel h3{margin:0 0 2px;font-size:13.5px;letter-spacing:-.2px}
  .panel .sub{font-size:11px;color:var(--muted);margin-bottom:12px}
  .grp{font-size:11px;font-weight:800;color:var(--sub);background:var(--soft);
       border-radius:6px;padding:3px 8px;display:inline-block;margin:10px 0 6px}
  .brow{display:grid;grid-template-columns:112px 1fr 96px;align-items:center;gap:8px;
        padding:3px 0;font-size:11.5px}
  .brow .nm{color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brow .tr{height:14px;background:var(--soft);border-radius:4px;overflow:hidden}
  .brow .tr i{display:block;height:100%;background:var(--blue);border-radius:4px;
              transition:width .25s}
  .brow .vl{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
  .brow .vl .sl{color:#c3c9d2;font-weight:400;margin:0 2px}
  .wideval .brow{grid-template-columns:104px 1fr 196px}
  .brow.ttl{border-top:1px solid var(--line);margin-top:6px;padding-top:6px}
  .brow.ttl .nm,.brow.ttl .vl{color:var(--ink);font-weight:800}
  .brow.ttl .tr i{background:#111827}
  /* 비교 */
  .crow{display:grid;grid-template-columns:112px 1fr 92px;align-items:center;gap:8px;
        padding:6px 0;border-bottom:1px solid #f1f3f7;font-size:11.5px}
  .crow .bars{display:grid;gap:3px}
  .cbar{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:6px;font-size:10.5px}
  .cbar span{color:var(--muted)}
  .cbar .tr{height:11px;background:var(--soft);border-radius:3px;overflow:hidden}
  .cbar .tr i{display:block;height:100%;border-radius:3px}
  .cbar.cur .tr i{background:var(--blue)}
  .cbar.prv .tr i{background:#c7cedb}
  .cbar b{font-variant-numeric:tabular-nums;min-width:60px;text-align:right}
  .delta{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
  .delta.up{color:var(--blue)} .delta.down{color:var(--red)} .delta.flat{color:var(--muted)}
  .legend{display:flex;gap:10px;font-size:10.5px;color:var(--muted);margin-bottom:8px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
  .search{margin-left:auto;display:flex;align-items:center;gap:8px}
  input#q{border:1px solid var(--line);background:var(--soft);border-radius:999px;
          padding:8px 14px;font-size:12.5px;width:230px;outline:none;color:var(--ink)}
  input#q:focus{border-color:var(--blue);background:#fff}
  .meta-right{text-align:right;line-height:1.45;white-space:nowrap}
  .meta-right .upd{font-size:11px;color:var(--muted)}
  .meta-right .upd b{color:var(--ink)}
  .meta-right #count{font-size:11px;color:var(--muted)}
  .frow{display:flex;align-items:center;gap:14px;padding:3px 0;flex-wrap:wrap}
  .fgroup{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .fgroup+.fgroup{border-left:1px solid var(--line);padding-left:14px}
  .flabel{flex:none;font-size:11px;color:var(--muted);font-weight:700;margin-right:2px}
  .chip{border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:999px;
        padding:5px 12px;font-size:12px;cursor:pointer;transition:.12s;white-space:nowrap}
  .chip:hover{border-color:#c9d2e0;color:var(--ink)}
  .chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
  #reset{border:1px solid var(--line);background:var(--soft);border-radius:999px;
         padding:8px 14px;font-size:12px;cursor:pointer;color:var(--sub)}
  #reset:hover{background:#eceff4}

  /* ---------- 카드 ---------- */
  main{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;
       align-items:start}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
        box-shadow:0 1px 3px rgba(16,24,40,.06);
        /* 화면 밖 카드는 렌더링을 건너뛰고, 레이아웃 영향도 카드 안으로 가둠 */
        content-visibility:auto;contain-intrinsic-size:auto 620px;contain:layout paint style}
  .chead{display:flex;align-items:center;gap:6px;padding:9px 12px 0}
  .chead .code{font-size:11px;color:var(--muted);letter-spacing:.4px}
  .tags{margin-left:auto;display:flex;gap:4px}
  .tag{font-size:10.5px;border-radius:5px;padding:2px 7px;font-weight:700}
  .tag.b{background:var(--blue);color:#fff}
  .tag.g{background:var(--soft);color:var(--sub);border:1px solid var(--line)}
  .cname{font-size:15.5px;font-weight:800;letter-spacing:-.3px;padding:3px 12px 8px}

  .thumb{position:relative;background:var(--soft);height:250px;display:flex;
         align-items:center;justify-content:center}
  .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--soft)}
  .thumb .noimg{font-size:11px;color:#c3c9d2;letter-spacing:1px}

  .prices{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--line);
          border-bottom:1px solid var(--line);background:#fff}
  .prices div{padding:8px 6px;text-align:center;border-right:1px solid var(--line)}
  .prices div:last-child{border-right:0}
  .prices b{display:block;font-size:14px;font-weight:800}
  .prices span{display:block;font-size:10.5px;color:var(--muted);margin-top:2px}
  .prices .r b{color:var(--red)}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);padding:9px 4px 7px}
  .stats div{text-align:center}
  .stats b{display:block;font-size:17px;font-weight:800;letter-spacing:-.5px}
  .stats span{display:block;font-size:10.5px;color:var(--muted);margin-top:3px}
  .stats .hl b{color:var(--blue)}

  .prog{margin:0 12px 9px;background:var(--soft);border:1px solid var(--line);border-radius:8px;
        padding:7px 10px}
  .prog .lb{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-bottom:5px}
  .prog .lb b{color:var(--blue)}
  .bar{height:6px;border-radius:99px;background:#e3e8ef;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px;background:var(--blue)}

  table{width:100%;border-collapse:collapse;table-layout:fixed}
  th,td{font-size:11.5px;padding:3px 6px;text-align:right;white-space:nowrap;
        overflow:hidden;text-overflow:ellipsis;line-height:1.25}
  th{color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);background:#fff}
  td.c{text-align:left}
  tbody tr+tr td{border-top:1px solid #f1f3f7}
  .cl{color:var(--blue);font-weight:700;font-size:11.5px;line-height:1.15}
  .cl small{display:block;color:var(--muted);font-weight:400;font-size:9.5px;line-height:1.15}
  tr.ttl td{border-top:1px solid var(--line);font-weight:800;background:#fbfcfe}
  .dim{color:#c3c9d2}

  details.det{border-top:1px solid var(--line);background:#fcfdfe}
  details.det>summary{list-style:none;cursor:pointer;padding:6px 12px;font-size:11px;
        color:var(--muted);display:flex;align-items:center;gap:5px;user-select:none}
  details.det>summary::-webkit-details-marker{display:none}
  details.det>summary::after{content:'▾';margin-left:auto;font-size:10px;transition:.15s}
  details.det[open]>summary::after{transform:rotate(180deg)}
  details.det>summary:hover{color:var(--sub);background:var(--soft)}
  .meta{padding:2px 12px 8px;display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}
  .meta div{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);
        line-height:1.5}
  .meta div span{color:var(--muted)}
  .foot{border-top:1px solid var(--line);padding:6px 12px;display:flex;gap:6px;flex-wrap:wrap}
  .foot em{font-style:normal;font-size:10.5px;background:var(--blue-soft);color:var(--blue);
           border-radius:5px;padding:3px 8px;font-weight:700}
  .foot em.n{background:var(--soft);color:var(--sub)}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:70px 0}
  .chead .code b{color:var(--blue);font-weight:800}
  .card.has-sub{cursor:pointer}
  .card.has-sub:hover{box-shadow:0 4px 14px rgba(16,24,40,.12);border-color:#c9d6f0}
  .foot em.click{background:#fff;border:1px dashed #c9d6f0;color:var(--blue)}

  /* ---------- 모달 ---------- */
  #modal{position:fixed;inset:0;z-index:50;background:rgba(17,24,39,.45);
         display:none;align-items:flex-start;justify-content:center;padding:24px;overflow:auto}
  #modal.on{display:flex}
  #modal .box{width:380px;max-width:100%}
  #modal .mhead{display:flex;align-items:center;gap:8px;margin-bottom:8px;color:#fff}
  #modal .mhead b{font-size:13px}
  #modal .mhead span{font-size:11px;opacity:.75}
  #modal .x{margin-left:auto;background:rgba(255,255,255,.15);border:0;color:#fff;
            width:26px;height:26px;border-radius:50%;font-size:14px;cursor:pointer}
  #modal .card{cursor:default}

  #sum{display:block}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>26FW 시즌 집계표</h1>
    <div class="search">
      <div class="meta-right"><div class="upd">업데이트 날짜 <b>2026-08-18</b></div></div>
    </div>
  </div>
</header>
<section id="sum">
  <div class="mrow" id="metrics"><span class="flabel">지표</span></div>
  <div class="panels" id="panels"></div>
  <div id="cmp"></div>
</section>

/* 화면 구성
   위쪽 캡슐 = 집계표 선택(4종). 고른 표 하나를 넓게 펴서 지표를 전부 한 줄에 보여준다.
   아래쪽 = 전년(25년) 동시점 비교. 비교 가능한 지표만 따로 고른다. */
const VIEWS = [
  {k:'season',  label:'26FW 시즌별 / 복종별',        sub:'신상품 기준 · 시즌 안에서 복종별'},
  {k:'newItem', label:'26FW 신상품 복종별',          sub:'복종 TOTAL 기준'},
  {k:'newCat',  label:'26FW 신상품 카테고리별',      sub:'값이 있는 카테고리만'},
  {k:'run',     label:'26FW 러닝 복종 / 카테고리별', sub:'26FW 신규 러닝 품번 기준 (구품번 실적은 포함하지 않음)'},
];
let VIEW = 'season';

/* 표의 열 = 기존 지표 전부. bar:true 인 열은 칸 안에 옅은 막대를 함께 그린다(0~100%). */
const COLS = [
  {k:'plan',     label:'기획량',      f:'n'},
  {k:'qtyIn',    label:'입고량',      f:'n'},
  {k:'inRate',   label:'입고율',      f:'p0', gauge:true},   // 값 왼쪽에 작은 가로 게이지
  {k:'sales',    label:'누계판매량',  f:'n'},
  {k:'sellRate', label:'수량판매율',  f:'p1'},
  {k:'salesTag', label:'누계판매TAG', f:'n'},
  {k:'salesAmt', label:'실판매금액',  f:'n'},
  {k:'disc',     label:'할인율',      f:'p1'},
];

const fmtN = v => (v==null ? '-' : Math.round(v).toLocaleString('ko-KR'));
const fmtW = v => v==null ? '-'
  : Math.abs(v)>=1e8 ? (v/1e8).toFixed(1)+'억'
  : Math.abs(v)>=1e4 ? Math.round(v/1e4).toLocaleString('ko-KR')+'만' : fmtN(v);
const fmtP = v => v==null ? '-' : (v*100).toFixed(2)+'%';
const fmtP1 = v => v==null ? '-' : (v*100).toFixed(1)+'%';
const fmtP0 = v => v==null ? '-' : Math.round(v*100)+'%';   // 입고율: 소수점 없이
const FMT = {n:fmtN, w:fmtW, p:fmtP, p1:fmtP1, p0:fmtP0};
const get = (o,k) => (o && o[k]!=null) ? o[k] : null;
const inRateOf = o => o==null ? null
  : (o.inRate!=null ? o.inRate : (o.plan ? (o.qtyIn||0)/o.plan : null));

/* ---------- 집계 표 ---------- */
/* 직전 스타일맵 대비 증감. 증가 = 빨강 ▲, 감소 = 파랑 ▼ (비율은 %p) */
function deltaHtml(v, was, col){
  if(v==null || was==null) return '';
  const d = v - was;
  if(!d) return '';
  let txt;
  if(col.f[0]==='p'){                       // 비율은 %p, 표기 자릿수로 반올림해 0 이면 생략
    const dec = col.f==='p0' ? 0 : 1;
    const val = +(Math.abs(d)*100).toFixed(dec);
    if(!val) return '';
    txt = val.toFixed(dec)+'%p';
  }else{
    const val = Math.round(Math.abs(d));
    if(!val) return '';
    txt = fmtN(val);
  }
  return `<span class="dt ${d>0?'up':'down'}">${d>0?'▲':'▼'}${txt}</span>`;
}
function cell(v, col, was){
  const txt = FMT[col.f](v) + deltaHtml(v, was, col);
  if(col.gauge && v!=null){
    const w = Math.max(0, Math.min(100, v*100));
    return `<td class="num g"><span class="gauge"><i style="width:${w}%"></i></span>${txt}</td>`;
  }
  return `<td class="num${v==null?' dim':''}">${txt}</td>`;
}
function dataRow(name, o, cls, was){
  const cells = COLS.map(c=>cell(
      c.k==='inRate' ? inRateOf(o) : get(o,c.k), c,
      c.k==='inRate' ? inRateOf(was) : get(was,c.k))).join('');
  return `<tr class="${cls||''}"><th class="nm">${name}</th>${cells}</tr>`;
}
function groupRow(label){
  return `<tr class="grprow"><th colspan="${COLS.length+1}">${label}</th></tr>`;
}
function table(rows){
  return `<div class="tw"><table class="sum">
    <thead><tr><th class="nm">구분</th>${COLS.map(c=>`<th class="num">${c.label}</th>`).join('')}</tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

function rowsOf(view){
  if(view==='season'){
    const b1 = SUM.block1.filter(d=>d.mode==='new');
    const seasons = [...new Set(b1.filter(d=>d.season).map(d=>d.season))];
    return seasons.map(s2 => groupRow(s2) + b1.filter(d=>d.season===s2)
        .map(d=>dataRow(d.item==='TTL' ? (s2+' TTL') : d.item, d.cur, d.item==='TTL'?'ttl':'', d.was))
        .join('')).join('')
      + b1.filter(d=>d.kind==='신상품 TTL').map(d=>dataRow('신상품 TTL', d.cur, 'ttl grand', d.was)).join('');
  }
  if(view==='newItem')
    return SUM.newItem.map(d=>dataRow(d.item, d, d.item==='TOTAL'?'ttl grand':'', d.was)).join('');
  if(view==='newCat')
    return [...new Set(SUM.newCat.map(d=>d.item))].map(g =>
      groupRow(g) + SUM.newCat.filter(d=>d.item===g).map(d=>dataRow(d.cat, d, '', d.was)).join('')).join('');
  return groupRow('복종') + SUM.runItem.map(d=>dataRow(d.item, d, d.item==='TOTAL'?'ttl grand':'', d.was)).join('')
    + [...new Set(SUM.runCat.map(d=>d.item))].map(g =>
        groupRow(g+' 카테고리') + SUM.runCat.filter(d=>d.item===g).map(d=>dataRow(d.cat, d, '', d.was)).join('')).join('');
}

/* ---------- 전년 동시점 비교 ---------- */
const CMP_META = {
  qtyIn   : {label:'입고량',      f:'n'},
  sales   : {label:'누계판매량',  f:'n'},
  sellRate: {label:'수량판매율',  f:'p'},
  salesTag: {label:'누계판매TAG', f:'w'},
  salesAmt: {label:'실판매금액',  f:'w'},
  disc    : {label:'할인율',      f:'p'},
};
let CMK = 'qtyIn';

function cmpPanel(){
  const meta = CMP_META[CMK], fm = FMT[meta.f];
  const rows = SUM.block1.filter(d=>d.mode==='new');
  const max = Math.max(...rows.flatMap(d=>[get(d.cur,CMK)||0, get(d.prev,CMK)||0].map(Math.abs)), .0001);
  const chips = Object.keys(CMP_META).map(k =>
    `<button class="chip sm${k===CMK?' on':''}" data-c="${k}">${CMP_META[k].label}</button>`).join('');
  const body = rows.map(d=>{
    const c = get(d.cur,CMK), p = get(d.prev,CMK);
    const isTtl = d.item==='TTL';
    const nm = isTtl ? (d.kind||'TTL') : (d.season+' · '+d.item);
    let dl = '-', cls = 'flat';
    if(c!=null && p){ const r=(c-p)/Math.abs(p)*100; dl=(r>0?'+':'')+r.toFixed(0)+'%'; cls=r>0?'up':(r<0?'down':'flat'); }
    const bar = (v,c2,tag)=>`<div class="cbar ${c2}"><span>${tag}</span>
        <span class="tr"><i style="width:${Math.min(100,Math.abs(v||0)/max*100)}%"></i></span>
        <b>${fm(v)}</b></div>`;
    return `<div class="crow"><span class="nm"${isTtl?' style="font-weight:800"':''}>${nm}</span>
      <div class="bars">${bar(c,'cur','26FW')}${bar(p,'prv','전년')}</div>
      <span class="delta ${cls}">${dl}</span></div>`;
  }).join('');
  return `<div class="panel">
    <h3>26FW vs 전년(25년) 동시점 비교</h3>
    <div class="sub">파랑 = 26FW, 회색 = 전년 동요일 시점 · 우측은 증감률</div>
    <div class="mrow sm">${chips}</div>
    ${body}</div>`;
}

/* ---------- 렌더 ---------- */
function bindCmp(){
  document.querySelectorAll('#cmp .chip').forEach(b=>b.addEventListener('click',()=>{
    CMK = b.dataset.c;
    document.getElementById('cmp').innerHTML = cmpPanel();
    bindCmp();
  }));
}
function renderSum(){
  document.getElementById('metrics').innerHTML = '<span class="flabel">집계표</span>' +
    VIEWS.map(v=>`<button class="chip${v.k===VIEW?' on':''}" data-v="${v.k}">${v.label}</button>`).join('');
  document.querySelectorAll('#metrics .chip').forEach(b=>b.addEventListener('click',()=>{
    VIEW = b.dataset.v; renderSum();
  }));

  const v = VIEWS.find(x=>x.k===VIEW);
  document.getElementById('panels').innerHTML =
    `<div class="panel"><h3>${v.label}</h3>
     <div class="sub">${v.sub} · 입고율 옆 게이지는 0~100% 기준 · 값 오른쪽 ▲▼ 는 직전 스타일맵 대비 증감</div>
     ${table(rowsOf(VIEW))}</div>`;

  document.getElementById('cmp').innerHTML = cmpPanel();
  bindCmp();
}
renderSum();
</script>
